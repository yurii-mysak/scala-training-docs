rungs:

  # ───────────────────────── Phase 1 — Foundations (B) ─────────────────────────

  - id: ai-ml-01
    title: "What machine learning actually optimises"
    level: B
    est_min: 20
    prereqs: []
    summary: >-
      Supervised machine learning is function fitting: pick a model family with adjustable
      parameters, define a loss that scores how wrong its predictions are, and search for the
      parameters that make the loss small. The real goal is not low loss on the data you already
      have but good predictions on data you have not seen — generalisation. This four-part frame
      (data, model, loss, optimiser) is the skeleton every later rung hangs on, from linear
      regression to LLM pretraining.
    key_points:
      - "Supervised learning in one line: learn f(x) ≈ y from examples; features, target, prediction."
      - "A model is a family of functions indexed by parameters; training means choosing the parameters."
      - "Loss functions: mean absolute error and mean squared error for numbers; classifiers use log loss (rung 09)."
      - "Training loss versus loss on unseen data: the gap is what overfitting means, and why data is held back."
      - "The frame data → model → loss → optimiser, and where each later rung of this track plugs into it."
    diagram: >-
      A training loop: training data (x, y) → model f(x; θ) → predictions ŷ → loss L(ŷ, y) →
      optimiser updates θ → back to the model. A side branch shows unseen data flowing into the
      same trained model to measure generalisation, with no arrow back to the optimiser.
    example: >-
      Five houses (size in m², price in k$). In a Kaggle notebook with numpy, compare two candidate
      lines price = a·size + b by computing MAE and MSE for each and pick the winner. Then add one
      outlier house (a mansion) and observe that MSE and MAE now disagree about which line is
      better — a first taste of "the loss you choose decides what good means". About 10 lines.
    presentation: minimal
    sources:
      - title: "DOU — what to study to become an ML/CV engineer in 2026 (The Fourth Law team)"
        url: https://dou.ua/forums/topic/62000/
        locator: "Whole article: the roadmap and the reasoning for its order (classical ML and maths before deep learning and CV)"
        kind: blog
        verified: false
      - title: "Kaggle Learn — Intro to Machine Learning"
        url: https://www.kaggle.com/learn/intro-to-machine-learning
        locator: "Lesson 1, \"How Models Work\""
        kind: course
        verified: false
      - title: "Google Machine Learning Crash Course"
        url: https://developers.google.com/machine-learning/crash-course
        locator: "Module \"Linear regression\" → page \"Loss\" (L1/L2 loss, MAE/MSE)"
        kind: course
        verified: false

  - id: ai-ml-02
    title: "Your first model: pandas in, predictions out"
    level: B
    est_min: 25
    prereqs: [ai-ml-01]
    summary: >-
      Before any maths, get the mechanics into your hands: load a CSV into a pandas DataFrame,
      look at it, choose features X and target y, fit a scikit-learn model and predict. Kaggle's
      Intro to ML does exactly this with the Melbourne housing data, and the Pandas micro-course
      covers the DataFrame operations you will reach for daily. For a Scala engineer, a DataFrame
      is closest to a Spark DataFrame: columnar, vectorised, with groupby/agg.
    key_points:
      - "DataFrame and Series; read_csv, head, describe; selecting with columns, loc and iloc."
      - "Choosing the prediction target y and the feature list X; dropping rows with missing values as the first crude fix."
      - "The scikit-learn contract: define → fit → predict (evaluate comes in rung 03)."
      - "DecisionTreeRegressor as a first model: no scaling needed, easy to picture."
      - "pandas ↔ Spark DataFrame parallels: vectorised column operations, groupby and aggregation."
    diagram: >-
      Left-to-right pipeline: CSV file → DataFrame (head/describe) → select y and X →
      model.fit(X, y) → model.predict(X_new) → predictions column; the four scikit-learn steps
      define/fit/predict/evaluate labelled under the arrows, with "evaluate" greyed out as next lesson.
    example: >-
      Kaggle notebook cells: pd.read_csv on the Melbourne housing CSV used by the course; .describe();
      pick five numeric features (Rooms, Bathroom, Landsize, Lattitude, Longtitude — the course's own
      column spellings); DecisionTreeRegressor(random_state=1).fit(X, y); predict the first five rows
      and compare with y.head(). Finish with one groupby: mean Price by Rooms.
    presentation: minimal
    sources:
      - title: "Kaggle Learn — Intro to Machine Learning"
        url: https://www.kaggle.com/learn/intro-to-machine-learning
        locator: "Lesson 2, \"Basic Data Exploration\"; Lesson 3, \"Your First Machine Learning Model\""
        kind: course
        verified: false
      - title: "Kaggle Learn — Pandas"
        url: https://www.kaggle.com/learn/pandas
        locator: "Lesson 1 \"Creating, Reading and Writing\"; Lesson 2 \"Indexing, Selecting & Assigning\"; Lesson 4 \"Grouping and Sorting\""
        kind: course
        verified: false

  - id: ai-ml-03
    title: "Validation, overfitting and data leakage"
    level: B
    est_min: 25
    prereqs: [ai-ml-02]
    summary: >-
      In-sample error lies: a deep enough tree memorises the training set and scores perfectly
      while predicting new data badly. This rung introduces held-out validation, the
      underfitting–overfitting curve controlled by model capacity, cross-validation for small
      datasets, and data leakage — the bug where information about the answer sneaks into the
      features. These habits separate a model that works from one that only looks like it does.
    key_points:
      - "Train / validation / test splits; the test set is touched once; train_test_split."
      - "Capacity versus error: underfitting (high bias) and overfitting (high variance); the U-shaped validation curve."
      - "k-fold cross-validation: a steadier estimate at k times the cost."
      - "Data leakage: target leakage and train–test contamination (e.g. preprocessing fitted on all rows)."
      - "QA analogy: the validation set is a test suite the model must never see during development."
    diagram: >-
      Error versus model capacity (max_leaf_nodes on a log axis): training error falls
      monotonically, validation error is U-shaped; the sweet spot is marked, the left region
      labelled "underfitting", the right "overfitting".
    example: >-
      The Kaggle Intro to ML exercise: train_test_split the housing data, loop max_leaf_nodes over
      [5, 50, 500, 5000], print validation MAE for each and choose the best. Then compute the
      in-sample MAE of the 5000-leaf tree to see how misleading it is. Optional: cross_val_score
      with cv=5 on the best setting.
    presentation: minimal
    sources:
      - title: "Kaggle Learn — Intro to Machine Learning"
        url: https://www.kaggle.com/learn/intro-to-machine-learning
        locator: "Lesson 4 \"Model Validation\"; Lesson 5 \"Underfitting and Overfitting\""
        kind: course
        verified: false
      - title: "Kaggle Learn — Intermediate Machine Learning"
        url: https://www.kaggle.com/learn/intermediate-machine-learning
        locator: "Lesson 5 \"Cross-Validation\"; Lesson 7 \"Data Leakage\""
        kind: course
        verified: false
      - title: "StatQuest — Machine Learning Fundamentals: Bias and Variance"
        url: https://statquest.org/video-index/
        locator: "Video index → \"Machine Learning Fundamentals: Bias and Variance\" (whole video, ~6 min)"
        kind: video
        verified: false

  - id: ai-ml-04
    title: "Vectors and matrices as data"
    level: B
    est_min: 20
    prereqs: [ai-ml-01]
    summary: >-
      Every model in this track treats data as vectors and matrices: a row of features is a
      vector, a dataset is a matrix, and a linear model is a matrix–vector product. 3Blue1Brown's
      view of vectors as arrows and matrices as transformations of space gives the geometric
      intuition; numpy gives the code. This is the vocabulary needed for gradients, neural network
      layers and embeddings.
    key_points:
      - "Two views of a vector: a list of numbers (a feature vector) and an arrow in space."
      - "Linear combinations and span: everything reachable by scaling and adding vectors."
      - "A matrix as a linear transformation; its columns are where the basis vectors land."
      - "Matrix–vector and matrix–matrix products; shapes (n×d)·(d) → (n) as a batch of predictions."
      - "numpy shapes and broadcasting; shape errors as the everyday reality."
    diagram: >-
      Left: a 4×3 data matrix X (4 houses × [size, rooms, age]) and a weight vector w of length 3;
      an arrow labelled "X @ w" produces a length-4 vector of predictions. Right: the 2×2 matrix
      [[2, 1], [0, 1]] drawn as a transformation moving the unit square spanned by î and ĵ to a
      parallelogram.
    example: >-
      numpy: X = 4 houses × [size, rooms, age]; w = [3.0, 10.0, −0.5]; compute X @ w and verify
      one entry by hand. Then apply [[2, 1], [0, 1]] to î = (1, 0), ĵ = (0, 1) and (1, 1), and
      check that the image of (1, 1) is the sum of the images of î and ĵ (linearity).
    presentation: minimal
    sources:
      - title: "3Blue1Brown — Essence of Linear Algebra"
        url: https://www.3blue1brown.com/topics/linear-algebra
        locator: "Ch. 1 \"Vectors, what even are they?\"; ch. 2 \"Linear combinations, span, and basis vectors\"; ch. 3 \"Linear transformations and matrices\""
        kind: video
        verified: false
      - title: "Khan Academy — Linear algebra"
        url: https://www.khanacademy.org/math/linear-algebra
        locator: "Unit \"Vectors and spaces\" → lesson \"Vectors\"; unit \"Matrix transformations\" → lesson \"Functions and linear transformations\""
        kind: course
        verified: false

  - id: ai-ml-05
    title: "Dot products and similarity"
    level: B
    est_min: 20
    prereqs: [ai-ml-04]
    summary: >-
      The dot product is the most-used operation in ML: a linear model's prediction is one, every
      neuron computes one, and Transformer attention is built from them. Geometrically it measures
      how much two vectors point the same way; normalised, it becomes cosine similarity, the
      standard way to compare embeddings. This intuition pays off in rungs 12, 20 and 21.
    key_points:
      - "Algebraic definition (sum of products) and geometric meaning (|a|·|b|·cos θ, projection)."
      - "The sign tells same direction, orthogonal, or opposite."
      - "Vector norm (length) and normalisation to unit length."
      - "Cosine similarity versus the raw dot product: sensitivity to magnitude."
      - "Where it reappears: w·x + b, neurons, embedding search, attention scores q·k."
    diagram: >-
      Two arrows a and b from the origin with angle θ between them; the projection of b onto a
      drawn as a dashed perpendicular; a small table beside it: θ = 0° → cos 1, 90° → 0,
      180° → −1.
    example: >-
      numpy: three toy word-count vectors for documents about cats, dogs and tax; compute pairwise
      dot products and cosine similarities. Then multiply the cat document by 10 (the same text
      repeated ten times) and show that its dot products change while its cosine similarities do not.
    presentation: minimal
    sources:
      - title: "3Blue1Brown — Essence of Linear Algebra"
        url: https://www.3blue1brown.com/topics/linear-algebra
        locator: "Ch. 9 \"Dot products and duality\" (the projection interpretation in the first half)"
        kind: video
        verified: false
      - title: "Khan Academy — Linear algebra"
        url: https://www.khanacademy.org/math/linear-algebra
        locator: "Unit \"Vectors and spaces\" → lesson \"Vector dot and cross products\""
        kind: course
        verified: false
      - title: "StatQuest — Cosine Similarity, Clearly Explained"
        url: https://statquest.org/video-index/
        locator: "Video index → \"Cosine Similarity, Clearly Explained!!!\""
        kind: video
        verified: false

  - id: ai-ml-06
    title: "Gradient descent in one variable"
    level: B
    est_min: 20
    prereqs: [ai-ml-01]
    summary: >-
      Training means minimising a loss, and almost all of modern ML does it with gradient descent:
      compute the slope of the loss, step downhill, repeat. With a single parameter everything is
      visible — the derivative, the learning rate, convergence, overshooting and divergence.
      Rung 07 generalises the same loop to many parameters.
    key_points:
      - "The derivative as the slope of the loss at the current parameter value."
      - "Update rule θ ← θ − η · dL/dθ; the learning rate η is the step size."
      - "η too small: slow; η too large: oscillation or divergence."
      - "Stopping rules: small gradient, small step, or a fixed step budget."
      - "Convex (one bowl) versus non-convex (many valleys) losses, as a preview of neural networks."
    diagram: >-
      A parabola L(θ) with a ball at successive θ values stepping down to the minimum; a second
      panel shows the same parabola with too-large steps zig-zagging across the bowl and away from it.
    example: >-
      Pure Python: minimise L(w) = (w − 3)² from w = 0 with η = 0.1, 0.9 and 1.1 for 20 steps,
      printing w each step — smooth convergence, oscillating convergence, divergence. Then fit only
      an intercept b to five numbers by gradient descent on MSE and confirm it converges to their mean.
    presentation: minimal
    sources:
      - title: "StatQuest — Gradient Descent, Step-by-Step"
        url: https://statquest.org/video-index/
        locator: "Video index → \"Gradient Descent, Step-by-Step\" (the intercept-only example in the first half)"
        kind: video
        verified: false
      - title: "3Blue1Brown — Neural Networks"
        url: https://www.3blue1brown.com/topics/neural-networks
        locator: "Ch. 2 \"Gradient descent, how neural networks learn\" — the cost function and ball-rolling-downhill segment (roughly the first third)"
        kind: video
        verified: false
      - title: "Google Machine Learning Crash Course"
        url: https://developers.google.com/machine-learning/crash-course
        locator: "Module \"Linear regression\" → pages \"Gradient descent\" and \"Hyperparameters\" (learning rate)"
        kind: course
        verified: false

  - id: ai-ml-07
    title: "Gradient descent in many variables: fitting linear regression"
    level: B
    est_min: 25
    prereqs: [ai-ml-04, ai-ml-06]
    summary: >-
      With many parameters the derivative becomes the gradient — a vector of partial derivatives
      pointing uphill — and gradient descent steps against it. For linear regression with mean
      squared error the gradient has a compact matrix form, so the whole training loop is a few
      lines of numpy. Mini-batch stochastic gradient descent, which estimates the gradient from a
      sample, is how every network in phase 2 is trained.
    key_points:
      - "Partial derivatives and the gradient vector ∇L; the negative gradient is the steepest-descent direction."
      - "Linear regression ŷ = Xw + b, MSE loss, gradient (2/n)·Xᵀ(ŷ − y) for w and the mean residual for b."
      - "Feature scaling: unscaled features make gradient descent zig-zag down a narrow valley."
      - "Batch versus stochastic versus mini-batch gradient descent; epochs."
      - "Closed-form least squares exists for linear regression, but gradient descent is what scales to everything else."
    diagram: >-
      A contour plot of a two-parameter loss surface (elliptical contours) with the descent path
      drawn as arrows perpendicular to the contours; a second path, for unscaled features,
      zig-zags along a long narrow valley.
    example: >-
      numpy lab: generate 200 points from y = 2·x1 − 3·x2 + 1 + noise; implement batch gradient
      descent with the matrix gradient for 500 steps; print the recovered w and b. Repeat with x2
      multiplied by 100 to provoke the learning-rate problem, fix it with standardisation, and
      compare with np.linalg.lstsq.
    presentation: standard
    sources:
      - title: "3Blue1Brown — Neural Networks"
        url: https://www.3blue1brown.com/topics/neural-networks
        locator: "Ch. 2 \"Gradient descent, how neural networks learn\" — the segment on the gradient of the cost as a vector of nudges"
        kind: video
        verified: false
      - title: "StatQuest — Stochastic Gradient Descent, Clearly Explained"
        url: https://statquest.org/video-index/
        locator: "Video index → \"Stochastic Gradient Descent, Clearly Explained!!!\""
        kind: video
        verified: false
      - title: "CS231n notes — Optimization: Stochastic Gradient Descent"
        url: https://cs231n.github.io/optimization-1/
        locator: "Sections \"Computing the gradient\" and \"Gradient Descent\" (incl. mini-batch gradient descent)"
        kind: course
        verified: false

  - id: ai-ml-08
    title: "Probability you need for ML: distributions, Bayes, likelihood"
    level: B
    est_min: 25
    prereqs: [ai-ml-01]
    summary: >-
      Classifiers output probabilities, most losses are negative log-likelihoods, and metrics
      depend on base rates, so a minimum of probability is non-negotiable. This rung covers
      distributions (Bernoulli, categorical, normal), conditional probability and Bayes' theorem,
      and the difference between probability and likelihood that underlies maximum likelihood
      estimation. It sets up logistic regression (rung 09), cross-entropy, and calibration (rung 32).
    key_points:
      - "Random variables; Bernoulli, categorical and normal distributions; mean and variance."
      - "Conditional probability and Bayes' theorem; base-rate neglect."
      - "Probability (data given fixed parameters) versus likelihood (parameters given fixed data)."
      - "Maximum likelihood estimation, and why we minimise negative log-likelihood (products become sums, numerically stable)."
      - "Independence assumptions; naive Bayes as the tiny model built from them (optional aside)."
    diagram: >-
      Two panels. (1) A Bayes tree: transactions split by prior (fraud 0.2% / legit 99.8%), then by
      the detector's result, with the flagged-fraud and flagged-legit leaves highlighted to show
      P(fraud | flagged). (2) A normal curve slid along fixed data points at three candidate means,
      with the likelihood highest where the curve fits the data.
    example: >-
      Python: a fraud detector catches 95% of fraud and wrongly flags 1% of legitimate
      transactions; fraud's base rate is 0.2%. Compute P(fraud | flagged) with Bayes' theorem
      (0.95·0.002 / (0.95·0.002 + 0.01·0.998) ≈ 0.16). Then with numpy compute the log-likelihood
      of 10 coin flips with 7 heads for p = 0.1 … 0.9 and confirm the maximum is at p = 0.7.
    presentation: standard
    sources:
      - title: "StatQuest — Probability is not Likelihood"
        url: https://statquest.org/video-index/
        locator: "Video index → \"Probability is not Likelihood. Find out why!!!\"; then the Bayes' Theorem video in the Statistics section"
        kind: video
        verified: false
      - title: "Goodfellow, Bengio, Courville — Deep Learning"
        url: https://www.deeplearningbook.org/
        locator: "Ch. 3 \"Probability and Information Theory\", §3.1–3.9 and §3.11 \"Bayes' Rule\"; ch. 5 §5.5 \"Maximum Likelihood Estimation\""
        kind: book
        verified: false

  - id: ai-ml-09
    title: "Logistic regression: from scores to probabilities"
    level: B
    est_min: 25
    prereqs: [ai-ml-07, ai-ml-08]
    summary: >-
      Logistic regression is linear regression's classification sibling: compute a linear score
      w·x + b, squash it with the sigmoid into a probability, and train by minimising log loss
      (binary cross-entropy) — the negative log-likelihood from rung 08. The decision threshold is
      a separate, business-level choice. The multi-class generalisation, softmax plus
      cross-entropy, is exactly the output layer of every neural classifier and every LLM.
    key_points:
      - "Sigmoid σ(z) = 1/(1 + e^(−z)); the linear score as log-odds."
      - "Log loss / binary cross-entropy, and why squared error fits probabilities poorly."
      - "The gradient of log loss has the same (ŷ − y)·x shape as linear regression's."
      - "The threshold is separate from the model; the decision boundary is a hyperplane."
      - "Softmax and categorical cross-entropy for K classes — the LLM output layer in miniature."
    diagram: >-
      Left: a number line of linear scores z mapped through the S-shaped sigmoid to probabilities
      between 0 and 1, with the 0.5 threshold dashed. Right: the log-loss curves −log(p) for y = 1
      and −log(1 − p) for y = 0, showing the steep penalty for confident wrong answers.
    example: >-
      scikit-learn: LogisticRegression on load_breast_cancer (features standardised); predict_proba
      for three test rows; compute their log loss by hand with numpy and compare with
      sklearn.metrics.log_loss on the same rows. Then lower the threshold from 0.5 to 0.2 and count
      how many predictions flip.
    presentation: standard
    sources:
      - title: "StatQuest — Logistic Regression"
        url: https://statquest.org/video-index/
        locator: "Video index → \"StatQuest: Logistic Regression\", then \"Logistic Regression Details Pt 2: Maximum Likelihood\""
        kind: video
        verified: false
      - title: "Google Machine Learning Crash Course"
        url: https://developers.google.com/machine-learning/crash-course
        locator: "Module \"Logistic regression\" → pages on the sigmoid function, log loss and regularization"
        kind: course
        verified: false
      - title: "CS231n notes — Linear classification"
        url: https://cs231n.github.io/linear-classify/
        locator: "Section \"Softmax classifier\" (cross-entropy loss, probabilistic interpretation)"
        kind: course
        verified: false

  - id: ai-ml-10
    title: "Decision trees and ensembles: what Kaggle actually wins with"
    level: B
    est_min: 30
    prereqs: [ai-ml-03]
    summary: >-
      On tabular data — the data most businesses actually have — gradient-boosted trees remain
      the strongest default, and they are what the Kaggle courses steer you to. This rung explains
      how a tree picks splits, why single trees overfit, how random forests average many
      decorrelated trees, and how gradient boosting adds small trees that fit the current
      ensemble's errors. It ends with the practical pipeline: impute, encode categoricals, then
      XGBoost with early stopping on a validation set.
    key_points:
      - "Splitting by impurity reduction (Gini or entropy for classification, variance for regression); depth controls capacity."
      - "Bagging and random forests: bootstrap samples plus random feature subsets lower variance."
      - "Gradient boosting: sequential small trees fitted to residuals (negative gradients); learning rate versus number of trees."
      - "XGBoost / LightGBM in practice: early stopping on a validation set (check the API of your installed version)."
      - "Preprocessing inside a Pipeline (imputation, one-hot or ordinal encoding) so nothing leaks."
    diagram: >-
      Three columns. (1) One deep decision tree with its splits. (2) A random forest: several trees
      trained on bootstrap samples, outputs averaged. (3) Gradient boosting: tree 1 → residuals →
      tree 2 → residuals → tree 3, with predictions summed and scaled by the learning rate.
    example: >-
      Kaggle Intermediate ML: build a Pipeline with SimpleImputer and OneHotEncoder inside a
      ColumnTransformer; compare RandomForestRegressor(n_estimators=100) with XGBRegressor
      (n_estimators=1000, learning_rate=0.05, early stopping on a validation split) and the
      rung-03 single tree; report validation MAE for all three in one table.
    presentation: standard
    sources:
      - title: "Kaggle Learn — Intro to Machine Learning"
        url: https://www.kaggle.com/learn/intro-to-machine-learning
        locator: "Lesson 6 \"Random Forests\""
        kind: course
        verified: false
      - title: "Kaggle Learn — Intermediate Machine Learning"
        url: https://www.kaggle.com/learn/intermediate-machine-learning
        locator: "Lesson 2 \"Missing Values\"; Lesson 3 \"Categorical Variables\"; Lesson 4 \"Pipelines\"; Lesson 6 \"XGBoost\""
        kind: course
        verified: false
      - title: "StatQuest — Decision Trees and Gradient Boost"
        url: https://statquest.org/video-index/
        locator: "Video index → \"Decision and Classification Trees, Clearly Explained!!!\" and \"Gradient Boost Part 1 (of 4): Regression Main Ideas\""
        kind: video
        verified: false

  - id: ai-ml-11
    title: "Evaluation metrics: choosing what good means"
    level: B
    est_min: 25
    prereqs: [ai-ml-03, ai-ml-09]
    summary: >-
      A model is only as good as the metric it is held to, and the wrong metric hides failures:
      99% accuracy on a 1%-positive problem can be a model that never says yes. This rung covers
      MAE and RMSE, the confusion matrix, precision, recall, F1, ROC and precision–recall curves,
      and log loss, and ties metric and threshold choice to the cost of each kind of mistake. As a
      former QA lead you already think in false positives and false negatives; this puts numbers on them.
    key_points:
      - "Regression: MAE versus RMSE (sensitivity to outliers) and the predict-the-mean baseline."
      - "Confusion matrix; accuracy and why it fails under class imbalance."
      - "Precision, recall and F1; moving the threshold trades one for the other."
      - "ROC curve and AUC (threshold-free ranking quality); precision–recall curve for rare positives."
      - "Log loss as a proper score for probabilities — preview of Brier score and calibration (rung 32)."
    diagram: >-
      A 2×2 confusion matrix (TP, FP, FN, TN) with arrows showing precision = TP/(TP + FP) and
      recall = TP/(TP + FN); beside it an ROC curve with the diagonal random baseline and one
      point labelled "threshold 0.5".
    example: >-
      scikit-learn on the rung-09 breast-cancer model: confusion_matrix, classification_report,
      roc_auc_score and average_precision_score; sweep thresholds 0.1 … 0.9 and print precision and
      recall at each; then choose the threshold that minimises 10·FN + FP ("a missed malignant case
      costs ten false alarms").
    presentation: standard
    sources:
      - title: "StatQuest — The Confusion Matrix; ROC and AUC"
        url: https://statquest.org/video-index/
        locator: "Video index → \"Machine Learning Fundamentals: The Confusion Matrix\" and \"ROC and AUC, Clearly Explained!\""
        kind: video
        verified: false
