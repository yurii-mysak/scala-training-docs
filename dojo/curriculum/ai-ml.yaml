        url: https://developers.google.com/machine-learning/crash-course
        locator: "Module \"Classification\" → \"Thresholds and the confusion matrix\"; \"Accuracy, recall, precision, and related metrics\"; \"ROC and AUC\""
        kind: course
        verified: false
      - title: "scikit-learn User Guide — Metrics and scoring"
        url: https://scikit-learn.org/stable/modules/model_evaluation.html
        locator: "Section \"Classification metrics\" (confusion matrix, precision/recall/F-measure, ROC, log loss) and \"Regression metrics\""
        kind: docs
        verified: false

  # ──────────────────── Phase 2 — Neural networks and PyTorch (B → I) ────────────────────

  - id: ai-ml-12
    title: "From perceptron to multilayer network"
    level: B
    est_min: 20
    prereqs: [ai-ml-05, ai-ml-07]
    summary: >-
      A neuron is a dot product plus a bias passed through a non-linear activation — logistic
      regression is a single neuron. Stacking neurons into layers, each a matrix multiply followed
      by a non-linearity, gives a multilayer perceptron that can represent functions no linear
      model can; XOR is the classic example. 3Blue1Brown's digit-recognition network is the mental
      picture for the rest of phase 2.
    key_points:
      - "The perceptron and its limit: only linearly separable problems (XOR fails)."
      - "A layer is W·x + b followed by an activation; an MLP is a composition of layers."
      - "Without the non-linearity, stacked linear layers collapse into one linear map."
      - "Counting parameters: weights plus biases per layer, e.g. the 784-16-16-10 network."
      - "Hidden layers as learned features, with the honest caveat that they are rarely as clean as the edges-and-strokes story."
    diagram: >-
      A 2-2-1 network for XOR: inputs x1, x2 → two hidden neurons (one OR-like, one AND-like) →
      one output neuron; beside it the four XOR points in the plane with the two hidden neurons'
      lines carving out the positive region.
    example: >-
      numpy forward pass of a 2-2-1 network with hand-set weights and a step (or steep sigmoid)
      activation that solves XOR; evaluate all four inputs. Then count the parameters of
      3Blue1Brown's 784-16-16-10 network: (784·16 + 16) + (16·16 + 16) + (16·10 + 10) = 13,002.
    presentation: standard
    sources:
      - title: "3Blue1Brown — Neural Networks"
        url: https://www.3blue1brown.com/topics/neural-networks
        locator: "Ch. 1 \"But what is a neural network?\" — layers, weights and biases, the 13,002-parameter count and the matrix notation near the end"
        kind: video
        verified: false
      - title: "Kaggle Learn — Intro to Deep Learning"
        url: https://www.kaggle.com/learn/intro-to-deep-learning
        locator: "Lesson 1 \"A Single Neuron\"; Lesson 2 \"Deep Neural Networks\""
        kind: course
        verified: false
      - title: "StatQuest — Neural Networks Pt. 1: Inside the Black Box"
        url: https://statquest.org/video-index/
        locator: "Video index → \"The Essential Main Ideas of Neural Networks\" / \"Neural Networks Pt. 1: Inside the Black Box\""
        kind: video
        verified: false

  - id: ai-ml-13
    title: "Backpropagation step by step"
    level: B
    est_min: 30
    prereqs: [ai-ml-12]
    summary: >-
      Backpropagation is the chain rule applied systematically on a computation graph: a forward
      pass computes values, a backward pass sends gradients from the loss to every parameter by
      multiplying local derivatives. Andrej Karpathy's micrograd builds a working autograd engine
      in about a hundred lines of Python, which demystifies what PyTorch does in the next rung.
      Once seen, "the network learns" stops being magic.
    key_points:
      - "Computation graph: nodes are operations; values flow forward, gradients flow backward."
      - "Chain rule as local gradient × upstream gradient; the local rules for add, multiply and tanh."
      - "Gradients accumulate (+=) when a value feeds several downstream nodes."
      - "Reverse-mode autodiff costs roughly one extra forward pass regardless of the number of parameters."
      - "Numerical gradient checking with finite differences as a test oracle."
    diagram: >-
      A small graph for L = (w·x + b − y)²: leaves w, x, b, y → multiply → add → subtract →
      square → L; forward values written above each edge and backward gradients below it in a
      second colour.
    example: >-
      Pure Python, no libraries: forward pass of L = (w·x + b − y)² with w = 2, x = 3, b = 1,
      y = 10 gives prediction 7, residual −3, L = 9. Backward by hand: dL/dpred = −6, dL/dw = −18,
      dL/db = −6. Verify both with central finite differences (L(w + h) − L(w − h)) / 2h. Optional:
      follow the first hour of the micrograd video.
    presentation: standard
    sources:
      - title: "Andrej Karpathy — The spelled-out intro to neural networks and backpropagation: building micrograd"
        url: https://www.youtube.com/watch?v=VMj-3S1tku0
        locator: "First hour: derivative intuition, the Value class, manual backpropagation through a neuron (chapters are listed in the video description)"
        kind: video
        verified: false
      - title: "3Blue1Brown — Neural Networks"
        url: https://www.3blue1brown.com/topics/neural-networks
        locator: "Ch. 3 \"Backpropagation, intuitively\" (formerly \"What is backpropagation really doing?\"); ch. 4 \"Backpropagation calculus\""
        kind: video
        verified: false
      - title: "CS231n notes — Backpropagation, Intuitions"
        url: https://cs231n.github.io/optimization-2/
        locator: "Sections \"Simple expressions and interpretation of the gradient\", \"Compound expressions with chain rule\", \"Patterns in backward flow\" (CS231n Lecture 4, 2017 numbering)"
        kind: course
        verified: false

  - id: ai-ml-14
    title: "PyTorch basics: tensors, autograd and a training loop"
    level: B
    est_min: 30
    prereqs: [ai-ml-13]
    summary: >-
      PyTorch is the default deep-learning framework, and its core is small: tensors (numpy arrays
      that can live on a GPU), autograd (rung 13's micrograd at industrial strength), nn.Module for
      models, and a training loop you write yourself. The official "Learn the Basics" tutorial
      covers all of it on FashionMNIST. Writing the loop by hand — zero_grad, forward, loss,
      backward, step — is the habit that makes every later model readable.
    key_points:
      - "Tensors: shape, dtype, device; numpy interop; broadcasting as in numpy."
      - "Autograd: requires_grad, loss.backward(), .grad, and torch.no_grad() for evaluation."
      - "Dataset and DataLoader: batching and shuffling."
      - "nn.Module, nn.Sequential, nn.Linear, nn.ReLU; model.parameters()."
      - "The five-line training step (zero_grad, forward, loss, backward, step) plus a separate evaluation loop."
    diagram: >-
      One epoch as a loop: DataLoader yields a batch (X, y) → model(X) → loss_fn(pred, y) →
      loss.backward() fills .grad → optimizer.step() updates parameters → optimizer.zero_grad() →
      next batch; a side box shows the evaluation loop under torch.no_grad().
    example: >-
      Lab: reproduce rung 07's linear regression in PyTorch (synthetic data, nn.Linear(2, 1),
      MSELoss, SGD lr 0.1, 200 steps) and confirm it recovers w ≈ [2, −3], b ≈ 1. Check that
      autograd reproduces rung 13's hand gradients (dL/dw = −18, dL/db = −6 for w = 2, x = 3,
      b = 1, y = 10). Then run the FashionMNIST quickstart for two epochs.
    presentation: standard
    sources:
      - title: "PyTorch Tutorials — Learn the Basics"
        url: https://pytorch.org/tutorials/beginner/basics/intro.html
        locator: "Pages \"Tensors\", \"Datasets & DataLoaders\", \"Build the Neural Network\", \"Automatic Differentiation with torch.autograd\", \"Optimizing Model Parameters\""
        kind: docs
        verified: false
      - title: "StatQuest — Introduction to Coding Neural Networks with PyTorch"
        url: https://statquest.org/video-index/
        locator: "Video index → \"Introduction to Coding Neural Networks with PyTorch\" (and \"Tensors for Neural Networks, Clearly Explained!!!\")"
        kind: video
        verified: false

  - id: ai-ml-15
    title: "Activation functions and initialisation"
    level: I
    est_min: 25
    prereqs: [ai-ml-14]
    summary: >-
      Deep networks fail to train for two classic reasons: gradients vanish or explode as they
      pass through many layers, and a poor choice of activation or initial weight scale makes it
      worse. This rung compares sigmoid, tanh, ReLU and its variants (GELU is what Transformers
      use), and explains why initialisation must keep activation variance roughly constant across
      layers — Xavier/Glorot for tanh, He/Kaiming for ReLU. Batch and layer normalisation are
      introduced as the engineering fix that made deep nets far less fragile.
    key_points:
      - "Sigmoid/tanh saturation and vanishing gradients; ReLU's non-saturating side and dead units; Leaky ReLU, GELU."
      - "Why all-zero initialisation fails (symmetry) and why the scale matters."
      - "Xavier/Glorot versus He/Kaiming initialisation, each justified by a one-line variance argument."
      - "Batch normalisation, and layer normalisation as the Transformer variant."
      - "Diagnosing training with per-layer activation and gradient histograms."
    diagram: >-
      Top: sigmoid, tanh, ReLU and GELU curves with their derivatives underneath. Bottom: a strip
      of activation histograms across 10 layers — collapsing to zero with too-small init,
      saturating with too-large init, staying stable with He init.
    example: >-
      PyTorch lab: a 10-layer MLP of width 256 with tanh; push a batch of random inputs through and
      print each layer's activation standard deviation for init std 0.01, 1.0 and Xavier. Repeat
      with ReLU and nn.init.kaiming_normal_ and compare.
    presentation: standard
    sources:
      - title: "CS231n notes — Neural Networks Part 1: Setting up the Architecture"
        url: https://cs231n.github.io/neural-networks-1/
        locator: "Section \"Commonly used activation functions\" (CS231n Lecture 6 \"Training Neural Networks I\", 2017 numbering)"
        kind: course
        verified: false
      - title: "CS231n notes — Neural Networks Part 2: Setting up the Data and the Loss"
        url: https://cs231n.github.io/neural-networks-2/
        locator: "Sections \"Weight Initialization\" and \"Batch Normalization\""
        kind: course
        verified: false
      - title: "He et al. — Delving Deep into Rectifiers (2015)"
        url: https://arxiv.org/abs/1502.01852
        locator: "§2.2 on initialisation of filter weights for rectifiers (the He/Kaiming variance argument)"
        kind: paper
        verified: false

  - id: ai-ml-16
    title: "Optimisers: SGD, momentum, Adam"
    level: I
    est_min: 25
    prereqs: [ai-ml-07, ai-ml-14]
    summary: >-
      Plain gradient descent struggles in the long, narrow valleys real loss surfaces have.
      Momentum accumulates a velocity that smooths out zig-zags; adaptive methods (RMSProp, Adam)
      scale each parameter's step by a running estimate of its gradient magnitude. Adam — and
      AdamW with decoupled weight decay — is the default for Transformers, while SGD with momentum
      still competes for CNNs. Learning-rate schedules such as warmup and cosine decay matter as
      much as the optimiser.
    key_points:
      - "SGD with momentum: the velocity update and the heavy-ball intuition; Nesterov as a variant."
      - "Adagrad/RMSProp: per-parameter step sizes from running averages of squared gradients."
      - "Adam = momentum + RMSProp + bias correction; default hyperparameters as given in the paper."
      - "AdamW: weight decay decoupled from the adaptive update."
      - "Learning-rate schedules: step decay, cosine, warmup; why the learning rate is the first hyperparameter to tune."
    diagram: >-
      A narrow elliptical loss valley with three trajectories from the same start point: SGD
      zig-zagging across the valley, momentum overshooting then settling, Adam heading more
      directly to the minimum.
    example: >-
      PyTorch lab: minimise the Rosenbrock function f(x, y) = (1 − x)² + 100(y − x²)² from
      (−1.5, 2) with torch.optim.SGD (lr 1e-3), SGD with momentum 0.9, and Adam (lr 1e-2) for 2,000
      steps each, printing the distance to (1, 1) every 500 steps. Then train the rung-14
      FashionMNIST model for two epochs with SGD versus AdamW and compare.
    presentation: standard
    sources:
      - title: "CS231n notes — Neural Networks Part 3: Learning and Evaluation"
        url: https://cs231n.github.io/neural-networks-3/
        locator: "Sections \"Parameter updates\" (SGD and bells and whistles, annealing the learning rate, per-parameter adaptive methods) — CS231n Lecture 7 \"Training Neural Networks II\", 2017 numbering"
        kind: course
        verified: false
      - title: "Kingma & Ba — Adam: A Method for Stochastic Optimization (2014)"
        url: https://arxiv.org/abs/1412.6980
        locator: "Algorithm 1 and §2 (the update rule, bias correction, default hyperparameters)"
        kind: paper
        verified: false
      - title: "PyTorch documentation — torch.optim"
        url: https://pytorch.org/docs/stable/optim.html
        locator: "Algorithms table (SGD, Adam, AdamW) and \"How to adjust learning rate\" (schedulers)"
        kind: docs
        verified: false

  - id: ai-ml-17
    title: "Regularisation: weight decay, dropout, early stopping"
    level: I
    est_min: 25
    prereqs: [ai-ml-03, ai-ml-14]
    summary: >-
      Neural networks have enough capacity to memorise their training set, so regularisation is
      how generalisation is bought back. This rung covers L2 weight decay, dropout (randomly
      zeroing activations during training so the network cannot rely on any single unit), early
      stopping on validation loss, and how augmentation and normalisation also regularise. It
      revisits rung 03's under/overfitting curve, now as train and validation loss per epoch.
    key_points:
      - "L2 penalty / weight decay shrinks weights; its strength is a hyperparameter."
      - "Dropout: train-time random masking with rescaling (inverted dropout), off at evaluation — model.train() versus model.eval()."
      - "Early stopping: monitor validation loss, keep the best checkpoint, use patience."
      - "Reading learning curves to diagnose overfitting versus underfitting."
      - "More data and augmentation as the strongest regulariser (bridge to rung 19)."
    diagram: >-
      Two learning-curve plots of train and validation loss versus epoch: (a) unregularised —
      validation loss turns upward after some epoch, with the early-stopping point marked; (b) with
      dropout and weight decay — a narrower gap and a lower validation minimum.
    example: >-
      PyTorch lab: deliberately overfit a 3-layer MLP on 1,000 FashionMNIST images for 30 epochs
      and plot train versus validation loss; add nn.Dropout(0.5) and weight_decay=1e-4 in AdamW and
      rerun; implement early stopping with patience 3 that saves the best state_dict. Forget
      model.eval() once on purpose and observe the noisy validation numbers.
    presentation: standard
    sources:
      - title: "Kaggle Learn — Intro to Deep Learning"
        url: https://www.kaggle.com/learn/intro-to-deep-learning
        locator: "Lesson 4 \"Overfitting and Underfitting\"; Lesson 5 \"Dropout and Batch Normalization\""
        kind: course
        verified: false
      - title: "Srivastava et al. — Dropout: A Simple Way to Prevent Neural Networks from Overfitting (JMLR 2014)"
        url: https://jmlr.org/papers/v15/srivastava14a.html
        locator: "Figure 1 (dropout network) and the \"Model Description\" section (train-time masking, test-time scaling)"
        kind: paper
        verified: false
      - title: "CS231n notes — Neural Networks Part 2"
        url: https://cs231n.github.io/neural-networks-2/
        locator: "Section \"Regularization\" (L2, L1, max norm, dropout, inverted dropout)"
        kind: course
        verified: false

  - id: ai-ml-18
    title: "Convolutional networks: the intuition"
    level: I
    est_min: 30
    prereqs: [ai-ml-14]
    summary: >-
      Images break the MLP: a 224×224 colour image has 150,528 inputs, and a fully connected
      layer ignores that neighbouring pixels are related. Convolutional layers slide small learned
      filters across the image, sharing weights and preserving spatial structure; pooling and
      strides shrink the map while channels grow, building a hierarchy from edges to textures to
      parts. CS231n lecture 5 and its notes are the reference; Kaggle's Computer Vision course is
      the hands-on version.
    key_points:
      - "Convolution as a sliding dot product (rung 05 again); kernel size, stride, padding, output size (W − F + 2P)/S + 1."
      - "Local connectivity and weight sharing: parameter count versus a dense layer."
      - "Channels: RGB in, many feature maps out; ReLU after each convolution."
      - "Max pooling and how the receptive field grows with depth."
      - "The classic shape [conv → ReLU → pool] × N → flatten → dense head; ResNet's skip connections in one sentence."
    diagram: >-
      A 5×5 input grid with a 3×3 filter sliding at stride 1 to produce a 3×3 feature map (one
      output cell computed explicitly); then a network sketch image → conv/ReLU → pool → conv/ReLU
      → pool → flatten → dense → class scores, with tensor shapes annotated at each stage.
    example: >-
      PyTorch: apply a hand-made 3×3 vertical-edge kernel (columns 1, 0, −1) with F.conv2d to a
      synthetic 8×8 image whose left half is dark and right half bright, and print the feature map.
      Then create nn.Conv2d(3, 16, 3, padding=1), check the output shape for a (1, 3, 32, 32) input,
      and verify the parameter count 3·3·3·16 + 16 = 448 against model.parameters().
    presentation: standard
    sources:
      - title: "Stanford CS231n — Deep Learning for Computer Vision"
        url: https://cs231n.stanford.edu/
        locator: "Lecture 5 \"Convolutional Neural Networks\" (2017 lecture-video numbering; find the matching lecture on the current schedule page)"
        kind: course
        verified: false
      - title: "CS231n notes — Convolutional Neural Networks: Architectures, Convolution / Pooling Layers"
        url: https://cs231n.github.io/convolutional-networks/
        locator: "Sections \"Convolutional Layer\" (local connectivity, spatial arrangement, parameter sharing), \"Pooling Layer\", \"ConvNet Architectures\""
        kind: course
        verified: false
      - title: "Kaggle Learn — Computer Vision"
        url: https://www.kaggle.com/learn/computer-vision
        locator: "Lesson 2 \"Convolution and ReLU\"; Lesson 3 \"Maximum Pooling\"; Lesson 4 \"The Sliding Window\""
        kind: course
        verified: false

  - id: ai-ml-19
    title: "Transfer learning and data augmentation"
    level: I
    est_min: 30
    prereqs: [ai-ml-17, ai-ml-18]
    summary: >-
      In practice almost nobody trains a vision model from scratch: you take a network pretrained
      on ImageNet, keep its convolutional base as a feature extractor and train a new head, or
      fine-tune the top layers, on your small dataset. Data augmentation stretches that small
      dataset by applying label-preserving transformations — flips, crops, colour jitter, blur —
      at training time. Albumentations is the library the dou.ua roadmap recommends; this rung
      covers which augmentations are safe for which task and how to wire them into a PyTorch Dataset.
    key_points:
      - "Pretrained base + new head; freezing versus fine-tuning; a lower learning rate for pretrained layers."
      - "Pretrained weights come with an expected input size and normalisation — respect them."
      - "Augmentation as encoding invariances; label-preserving versus label-breaking transforms (e.g. horizontal flip on text or digits)."
      - "Albumentations Compose pipelines; geometric versus pixel-level transforms; the same transform applied to masks and boxes for segmentation and detection."
      - "Augment at train time only; test-time augmentation as an optional extra."
    diagram: >-
      Two parts: (1) a frozen pretrained convolutional base (greyed out) feeding a new trainable
      classification head; (2) one input photo fanning out into six augmented variants (flip, crop,
      rotate, brightness, blur, cutout) that all map to the same label.
    example: >-
      Lab: an Albumentations pipeline A.Compose([A.HorizontalFlip(p=0.5),
      A.RandomBrightnessContrast(p=0.3), A.Normalize(), ToTensorV2()]) inside a PyTorch Dataset's
      __getitem__; visualise eight augmented copies of one image. Then load torchvision's resnet18
      with pretrained weights, replace model.fc with nn.Linear(512, num_classes), freeze the rest,
      and train one epoch on a small image-folder dataset.
    presentation: standard
    sources:
      - title: "Albumentations documentation"
        url: https://albumentations.ai/docs/
        locator: "Introduction (what image augmentation is and why it helps); getting-started guide for classification; transforms reference (pixel-level vs spatial-level)"
        kind: docs
        verified: false
      - title: "Kaggle Learn — Computer Vision"
        url: https://www.kaggle.com/learn/computer-vision
        locator: "Lesson 1 \"The Convolutional Classifier\" (pretrained base + head); Lesson 6 \"Data Augmentation\""
        kind: course
        verified: false
      - title: "CS231n notes — Transfer Learning"
        url: https://cs231n.github.io/transfer-learning/
        locator: "Sections \"ConvNet as fixed feature extractor\", \"Fine-tuning the ConvNet\", \"When and how to fine-tune?\" (CS231n Lecture 7, 2017 numbering)"
        kind: course
        verified: false

  # ─────────────────── Phase 3 — Modern deep learning and LLMs (I) ───────────────────

  - id: ai-ml-20
    title: "Embeddings and representation learning"
    level: I
    est_min: 25
    prereqs: [ai-ml-05, ai-ml-14]
    summary: >-
      An embedding maps discrete things — words, tokens, products, users, documents — to dense
      vectors whose geometry carries meaning, so similar items sit close by cosine similarity
      (rung 05). Word2vec showed such vectors can be learned as a side effect of a simple
      prediction task, and every modern model, from recommenders to LLMs, starts with an embedding
      table learned the same way. This is also the foundation of semantic search and RAG (rung 28).
    key_points:
      - "One-hot versus dense vectors; an embedding layer is a lookup table, equivalent to one-hot × matrix."
      - "Learning by prediction: skip-gram and CBOW, the context window, negative sampling (intuition only)."
      - "The distributional hypothesis; vector-arithmetic analogies and their limits."
      - "Static word vectors versus contextual embeddings (Transformer hidden states)."
      - "Sentence/document embedding models for similarity search; dimensionality and normalisation."
    diagram: >-
      Left: a one-hot vector for "king" multiplied by an embedding matrix selects one row. Right: a
      2-D projection with clusters (animals, countries, verbs) and the king − man + woman ≈ queen
      parallelogram.
    example: >-
      Lab: nn.Embedding(10, 4) in PyTorch to see that it is just a table. Then with
      sentence-transformers' all-MiniLM-L6-v2, embed six sentences (two about car washes, two about
      Scala, two about cats), compute the cosine-similarity matrix and check the clusters. Add one
      Ukrainian sentence and compare against paraphrase-multilingual-MiniLM-L12-v2.
    presentation: standard
    sources:
      - title: "Jay Alammar — The Illustrated Word2vec"
        url: https://jalammar.github.io/illustrated-word2vec/
        locator: "Sections \"Word Embeddings\", \"Language Modeling\", \"Skipgram\", \"Negative Sampling\""
        kind: blog
        verified: false
      - title: "StatQuest — Word Embedding and Word2Vec"
        url: https://statquest.org/video-index/
        locator: "Video index → \"Word Embedding and Word2Vec, Clearly Explained!!!\""
        kind: video
        verified: false
      - title: "Mikolov et al. — Efficient Estimation of Word Representations in Vector Space (2013)"
        url: https://arxiv.org/abs/1301.3781
        locator: "§3 \"New Log-linear Models\" (CBOW, Skip-gram) with Figure 1; §4 on the word-analogy test"
        kind: paper
        verified: false

  - id: ai-ml-21
    title: "Attention from first principles"
    level: I
    est_min: 30
    prereqs: [ai-ml-20]
    summary: >-
      Attention lets each token build its representation as a weighted average of other tokens'
      values, with the weights computed from how well its query matches their keys — dot products
      (rung 05) turned into a probability distribution by softmax (rung 09). Scaled dot-product
      attention, softmax(QKᵀ/√d_k)·V, is one line of linear algebra, and causal masking makes it
      usable for next-token prediction. This rung builds it by hand before rung 22 assembles the
      full Transformer.
    key_points:
      - "The problem: meaning depends on context; the fixed-size RNN bottleneck as historical motivation."
      - "Queries, keys and values as three learned projections of the same embeddings (self-attention)."
      - "Scores QKᵀ, scaling by √d_k so the softmax does not saturate, softmax over keys, weighted sum of V."
      - "The causal mask: a token may only attend to earlier positions."
      - "Cost grows as O(n²) in sequence length — the root of context-window limits (rungs 25–26)."
    diagram: >-
      A four-token sentence: for token 3, arrows to tokens 1–4 labelled with attention weights
      (summing to 1) from softmax(q₃·kᵢ/√d). Below, the matrix form: Q (n×d) × Kᵀ (d×n) → n×n
      score matrix with the upper triangle masked → row-wise softmax → × V.
    example: >-
      numpy lab: four tokens with random 8-dim embeddings and random W_q, W_k, W_v (8×4); compute
      Q, K, V, the scaled scores, a causal mask (−inf above the diagonal), a row-wise softmax and
      the output weights @ V; assert every row sums to 1 and row 0 attends only to itself. Then
      compare with torch.nn.functional.scaled_dot_product_attention(q, k, v, is_causal=True).
    presentation: standard
    sources:
      - title: "3Blue1Brown — Neural Networks"
        url: https://www.3blue1brown.com/topics/neural-networks
        locator: "Ch. 6 \"Attention in transformers, step-by-step\" (formerly \"…visually explained\") — the query/key dot-product grid, softmax and masking segments"
        kind: video
        verified: false
      - title: "Vaswani et al. — Attention Is All You Need (2017)"
        url: https://arxiv.org/abs/1706.03762
        locator: "§3.2.1 \"Scaled Dot-Product Attention\" (equation 1 and the footnote on √d_k), Figure 2 left"
        kind: paper
        verified: false
      - title: "StatQuest — Attention for Neural Networks"
        url: https://statquest.org/video-index/
        locator: "Video index → \"Attention for Neural Networks, Clearly Explained!!!\""
        kind: video
        verified: false

  - id: ai-ml-22
    title: "The Transformer, block by block"
    level: I
    est_min: 30
    prereqs: [ai-ml-21]
    summary: >-
      "Attention Is All You Need" (2017) combined multi-head self-attention with position-wise
      feed-forward layers, residual connections, layer normalisation and positional encodings into
      the Transformer; essentially every modern LLM is a stack of its decoder blocks. This rung
      walks one block end to end with tensor shapes, explains why several heads, why residuals,
      and how position enters a model whose attention is otherwise order-blind. It closes with the
      three families: encoder-only (BERT), encoder–decoder (the original, T5) and decoder-only (GPT, Claude).
    key_points:
      - "Multi-head attention: h heads of size d_model/h in parallel, concatenated and projected."
      - "The position-wise feed-forward network (typically 4× wider) holds much of the parameter count."
      - "Residual stream plus layer norm (pre-norm in modern models) makes deep stacks trainable."
      - "Position: sinusoidal encodings in the paper; learned and rotary (RoPE) encodings in modern models."
      - "Encoder-only versus encoder–decoder versus decoder-only; the final linear + softmax over the vocabulary."
    diagram: >-
      One decoder block as a vertical stack: token embeddings + positions → LayerNorm → masked
      multi-head self-attention → add (residual) → LayerNorm → feed-forward (d → 4d → d) → add →
      next block; shapes (B, T, C) annotated at each step; after the last block → linear → softmax
      over the vocabulary.
    example: >-
      PyTorch lab: implement a ~40-line pre-norm decoder block (rung-21 attention or
      nn.MultiheadAttention, LayerNorm, a 2-layer MLP with GELU) with d_model = 64, 4 heads, T = 8;
      push a (2, 8, 64) tensor through two stacked blocks printing shapes; count parameters per
      block and compare with ≈ 12·d² (4d² for the attention projections + 8d² for the MLP) plus
      biases and norms.
    presentation: standard
    sources:
      - title: "Vaswani et al. — Attention Is All You Need (2017)"
        url: https://arxiv.org/abs/1706.03762
        locator: "§3.1 \"Encoder and Decoder Stacks\" with Figure 1; §3.2.2 \"Multi-Head Attention\"; §3.3 \"Position-wise Feed-Forward Networks\"; §3.5 \"Positional Encoding\""
        kind: paper
        verified: false
      - title: "Jay Alammar — The Illustrated Transformer"
        url: https://jalammar.github.io/illustrated-transformer/
        locator: "Sections \"The Beast With Many Heads\", \"Representing The Order of The Sequence Using Positional Encoding\", \"The Residuals\", \"The Final Linear and Softmax Layer\""
        kind: blog
        verified: false
      - title: "Andrej Karpathy — Let's build GPT: from scratch, in code, spelled out"
        url: https://www.youtube.com/watch?v=kCc8FmEb1nY
        locator: "Chapters on multi-headed self-attention, the feed-forward layer, residual connections and layernorm (second half of the video; chapter list in the description)"
        kind: video
        verified: false

  - id: ai-ml-23
    title: "Tokenisation: how text becomes tokens"
    level: I
    est_min: 25
    prereqs: [ai-ml-22]
    summary: >-
      Models do not see characters or words; they see integer token ids produced by a tokenizer,
      usually byte-pair encoding (BPE), which merges frequent byte sequences into a fixed-size
      vocabulary. Tokenisation explains a surprising number of LLM quirks — trouble counting
      letters, arithmetic oddities, whitespace sensitivity — and it sets the price, because APIs
      bill per token and non-English text such as Ukrainian often needs more tokens per word.
      Karpathy's tokenizer lecture builds BPE from scratch.
    key_points:
      - "Why not characters or whole words: sequence length versus vocabulary size versus unknown words."
      - "BPE training: start from bytes, repeatedly merge the most frequent adjacent pair; the vocabulary is the merge list."
      - "Byte-level BPE covers any Unicode; alternatives: WordPiece, SentencePiece/Unigram."
      - "Token count drives cost, latency and context usage; language and script matter (Cyrillic, code, numbers)."
      - "Quirks traced to tokenisation: spelling and counting tasks, leading spaces, special tokens."
    diagram: >-
      A toy corpus (the low/lower/newest/widest style example from Sennrich et al.) going through
      three successive merges, each merge adding one vocabulary entry; a side table maps the final
      token ids back to strings.
    example: >-
      Lab: count tokens for the same two sentences in English and in Ukrainian — with tiktoken for an
      open tokenizer and with Anthropic's token-counting endpoint for Claude — compute the ratio and
      print the token pieces to see where words split. Then implement five BPE merges in ~20 lines
      of Python on the toy vocabulary from Sennrich et al. (Algorithm 1) and print each merge.
    presentation: standard
    sources:
      - title: "Andrej Karpathy — Let's build the GPT Tokenizer"
        url: https://www.youtube.com/watch?v=zduSFxRajkE
        locator: "Opening segment on why tokenization causes LLM weirdness; the BPE implementation segment (pair counting and merging); chapter list in the description"
        kind: video
        verified: false
      - title: "Sennrich, Haddow, Birch — Neural Machine Translation of Rare Words with Subword Units (2015)"
        url: https://arxiv.org/abs/1508.07909
        locator: "§3.2 \"Byte Pair Encoding\", Algorithm 1 and Figure 1"
        kind: paper
        verified: false
      - title: "Hugging Face LLM Course"
        url: https://huggingface.co/learn/llm-course
        locator: "Chapter 6 (the Tokenizers library), section \"Byte-Pair Encoding tokenization\""
        kind: course
        verified: false

  - id: ai-ml-24
    title: "Pretraining vs fine-tuning vs RLHF"
    level: I
    est_min: 30
    prereqs: [ai-ml-22, ai-ml-23]
    summary: >-
      A chat model is built in stages. Pretraining teaches a Transformer to predict the next token
      over an enormous text corpus, producing a base model that continues documents rather than
      answering questions. Supervised fine-tuning on curated conversations teaches the assistant
      format, and reinforcement learning — from human preferences (RLHF), AI feedback, or
      verifiable rewards — shapes behaviour beyond what demonstrations can teach. Knowing which
      stage produced a behaviour tells you whether to fix it with prompting, fine-tuning or a
      different model.
    key_points:
      - "Pretraining objective: next-token cross-entropy over the vocabulary; a base model is a document completer."
      - "Scale trades off parameters, data and compute (compute-optimal scaling, Chinchilla) — cite numbers from the source."
      - "Supervised fine-tuning: imitation of demonstrations in a chat template."
      - "RLHF pipeline: preference pairs → reward model → policy optimisation (PPO) with a KL penalty; DPO as the reward-model-free alternative."
      - "RL from verifiable rewards (maths, code) and why reasoning models came out of it."
    diagram: >-
      A three-stage pipeline: internet-scale text → pretraining → base model; curated dialogues →
      SFT → instruction model; prompts + preference comparisons → reward model → RL (PPO) or DPO →
      assistant model. Each arrow is labelled with its data and its objective.
    example: >-
      Lab: (1) a model guessing uniformly over a 50,000-token vocabulary has loss ln(50000) ≈ 10.8
      nats per token; compute the analogous baseline for Karpathy's 65-character Shakespeare model,
      ln(65) ≈ 4.17, and compare with the validation loss he reaches in "Let's build GPT".
      (2) Implement the DPO loss for one preference pair in numpy from given policy and reference
      log-probabilities, and watch it fall as the chosen response's log-probability rises.
    presentation: standard
    sources:
      - title: "Andrej Karpathy — Deep Dive into LLMs like ChatGPT"
        url: https://www.youtube.com/watch?v=7xTGNNLPyMI
        locator: "Chapters on pretraining (data, tokenization, training, base model), post-training/SFT, and reinforcement learning incl. RLHF (chapter list in the description)"
        kind: video
        verified: false
      - title: "Ouyang et al. — Training language models to follow instructions with human feedback (InstructGPT, 2022)"
        url: https://arxiv.org/abs/2203.02155
        locator: "Figure 2 (the three steps: SFT, reward model, PPO) and the \"Models\" subsection of §3 Methods"
        kind: paper
        verified: false
      - title: "Hugging Face blog — Illustrating Reinforcement Learning from Human Feedback (RLHF)"
        url: https://huggingface.co/blog/rlhf
        locator: "Sections on pretraining language models, reward model training, and fine-tuning with RL"
        kind: blog
        verified: false

  - id: ai-ml-25
    title: "Inference: sampling, temperature and the KV cache"
    level: I
    est_min: 25
    prereqs: [ai-ml-24]
    summary: >-
      Generation is a loop: run the model on the context, get logits over the vocabulary, turn them
      into a distribution, pick a token, append it, repeat. Decoding choices — greedy, temperature,
      top-k, top-p — trade determinism against diversity and explain why the same prompt can give
      different answers. The KV cache stores each layer's keys and values so every new token costs
      one incremental step instead of recomputing the prefix; it is why prefill and decode behave
      differently and why long contexts are memory-hungry.
    key_points:
      - "Autoregressive decoding; logits → softmax with temperature T (T → 0 approaches greedy, T > 1 flattens)."
      - "Top-k and top-p (nucleus) sampling; why greedy and beam search produce repetitive open-ended text."
      - "Prefill (parallel over the prompt) versus decode (one token at a time); time-to-first-token versus tokens per second."
      - "KV-cache size ≈ 2 × layers × KV heads × head_dim × tokens × bytes per value; grouped-query attention shrinks it."
      - "Stop sequences and max tokens; temperature 0 is not a hard determinism guarantee on hosted APIs (quote the provider's docs)."
    diagram: >-
      The generation loop: tokens so far → model (per-layer KV-cache blocks growing by one column
      per step) → logits → softmax(logits / T) → top-p filter → sample → append token → back into
      the model; a side bar contrasts the single prefill step over the whole prompt with the
      one-token decode steps.
    example: >-
      numpy lab: logits [2.0, 1.0, 0.5, 0.1, −1.0] for five candidate tokens; compute softmax at
      T = 0.2, 1.0 and 2.0; apply top-p 0.9 and renormalise; sample 1,000 times at each setting and
      tabulate the frequencies. Then compute the KV cache for a hypothetical model with 32 layers,
      8 KV heads, head_dim 128, a 32,768-token context and 2-byte values: 2·32·8·128·32768·2 bytes
      = 4 GiB per sequence.
    presentation: standard
    sources:
      - title: "Hugging Face blog — How to generate text: using different decoding methods"
        url: https://huggingface.co/blog/how-to-generate
        locator: "Sections \"Greedy Search\", \"Beam search\", \"Sampling\" (temperature), \"Top-K Sampling\", \"Top-p (nucleus) sampling\""
        kind: blog
        verified: false
      - title: "Holtzman et al. — The Curious Case of Neural Text Degeneration (2019)"
        url: https://arxiv.org/abs/1904.09751
        locator: "Figure 1 (degenerate repetition from beam search) and §3 on nucleus, top-k and temperature sampling"
        kind: paper
        verified: false
      - title: "Hugging Face Transformers docs — KV cache"
        url: https://huggingface.co/docs/transformers/kv_cache
        locator: "Opening explanation of key/value caching during generation and the cache strategies table"
        kind: docs
        verified: false

  - id: ai-ml-26
    title: "Context windows and prompting as programming"
    level: I
    est_min: 25
    prereqs: [ai-ml-25]
    summary: >-
      For an application developer the context window is the program's entire working memory:
      system prompt, instructions, documents, tool results and history all compete for a finite
      token budget, and the model's attention over them is not uniform. Prompting is therefore
      closer to programming than to wording — clear role and task, structured inputs, examples,
      explicit output contracts, room to think — and context engineering decides what enters the
      window at each step. Anthropic's documentation is the reference for Claude.
    key_points:
      - "The context window as working memory: input plus output tokens; long-context cost and the lost-in-the-middle effect."
      - "Prompt structure: system prompt for role, clear and direct instructions, XML-tagged inputs, few-shot examples, output contracts."
      - "Letting the model think (chain of thought, extended thinking) and when it is worth the tokens."
      - "Context engineering: retrieve just in time, compact or summarise history, keep tool outputs small."
      - "Prompt caching for stable prefixes; prompts versioned and tested like code (20-llm-agent-systems/production-llmops.md §3)."
    diagram: >-
      A stacked bar of one context window: system prompt (cached) | tool definitions | retrieved
      documents | conversation history | current user turn | reserved output budget; arrows show
      which segments get compacted or evicted as the conversation grows.
    example: >-
      Lab: call the Anthropic Messages API with curl twice for the same task — turn a car-wash
      support ticket into JSON — first as a one-line prompt, then with a system role, the ticket in
      <ticket> tags, one example and an explicit JSON schema; compare five runs of each. Measure each
      prompt with the token-counting endpoint (POST /v1/messages/count_tokens).
    presentation: standard
    sources:
      - title: "Claude developer documentation"
        url: https://docs.claude.com/
        locator: "Build with Claude → Prompt engineering (overview; be clear and direct; use examples; let Claude think; use XML tags; system prompts) and → Context windows"
        kind: docs
        verified: false
      - title: "Anthropic Engineering — Effective context engineering for AI agents"
        url: https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents
        locator: "Sections on context as a finite resource and on long-horizon techniques (compaction, structured note-taking, sub-agents)"
        kind: blog
        verified: false
      - title: "Liu et al. — Lost in the Middle: How Language Models Use Long Contexts (2023)"
        url: https://arxiv.org/abs/2307.03172
        locator: "Figure 1 (U-shaped accuracy versus the position of the relevant document)"
        kind: paper
        verified: false

  - id: ai-ml-27
    title: "Evaluating LLM systems"
    level: I
    est_min: 30
    prereqs: [ai-ml-11, ai-ml-26]
    summary: >-
      LLM outputs are non-deterministic free text, so "does it work?" becomes a measurement
      problem: define success criteria, build an eval set from real traffic and edge cases, grade
      with code where possible, with a calibrated LLM judge where not, and with humans to anchor
      both. Section 20 of this repo already covers agent evaluation and LLM-as-judge at interview
      depth; this rung is the bridge from foundations — it connects them to rung 11's metrics and
      adds the statistics needed to tell a real improvement from noise.
    key_points:
      - "Success criteria first: specific, measurable and tied to the product (rung 11 applied to text)."
      - "Grader hierarchy: deterministic checks → model-graded rubrics → human review; cost versus fidelity."
      - "LLM-as-judge biases (position, verbosity, self-preference) and calibrating the judge against human labels (llm-as-judge.md §4–5)."
      - "Building the eval set: real traffic, failure-driven cases, held-out data; trajectory versus outcome for agents (evaluating-agents.md §3–5)."
      - "Noise: k samples per case and confidence intervals — with 50 cases at ~80% pass rate the 95% interval is roughly ±11 points."
    diagram: >-
      The evaluation ladder: assertion-style checks → offline eval set with graders → LLM judge
      calibrated against human labels → online A/B or shadow traffic; a feedback arrow carries
      production failures back into the eval set.
    example: >-
      Python lab: a 20-case eval for the rung-26 ticket-to-JSON prompt with a code grader (valid
      JSON, required keys, allowed enum values) plus a 3-point rubric scored by a judge model; label
      10 outputs yourself and compute judge–human agreement; bootstrap a 95% confidence interval on
      the pass rate with numpy.
    presentation: standard
    sources:
      - title: "This repo — 20-llm-agent-systems/evaluating-agents.md"
        url: https://github.com/yurii-mysak/scala-training-docs/blob/main/20-llm-agent-systems/evaluating-agents.md
        locator: "§2 \"The evaluation ladder\"; §3 \"Building the offline eval set\"; §5 \"Trajectory versus outcome evaluation\""
        kind: docs
        verified: false
      - title: "This repo — 20-llm-agent-systems/llm-as-judge.md"
        url: https://github.com/yurii-mysak/scala-training-docs/blob/main/20-llm-agent-systems/llm-as-judge.md
        locator: "§3 \"Rubric design\"; §4 \"Biases, and what to do about them\"; §5 \"Calibrating against human labels\""
        kind: docs
        verified: false
      - title: "Claude developer documentation"
        url: https://docs.claude.com/
        locator: "Test & evaluate → \"Define success criteria\" and \"Develop test cases\" (eval design principles, grading methods)"
        kind: docs
        verified: false

  - id: ai-ml-28
    title: "RAG done properly"
    level: I
    est_min: 30
    prereqs: [ai-ml-20, ai-ml-27]
    summary: >-
      Retrieval-augmented generation puts relevant documents into the context so the model answers
      from your data instead of its memory. Done properly it is a search system first and an LLM
      feature second: chunking, hybrid lexical plus embedding retrieval, reranking, and — the step
      most often skipped — evaluating retrieval separately from generation. The repo's
      rag-and-retrieval.md covers the pipeline; this rung adds the foundations (embeddings from
      rung 20, ranking metrics) and Anthropic's contextual retrieval technique.
    key_points:
      - "Pipeline: ingest → chunk → embed and index → retrieve (BM25 + vectors) → rerank → assemble context → generate with citations."
      - "Chunking trade-offs; contextual retrieval: prepend chunk-specific context before embedding and BM25 indexing."
      - "Hybrid search and reciprocal rank fusion; cross-encoder rerankers."
      - "Retrieval metrics — recall@k, MRR, nDCG — measured on labelled queries before touching the generator."
      - "Generation checks (groundedness, citation accuracy); when long context or agentic search beats one-shot RAG (rag-and-retrieval.md §7)."
    diagram: >-
      Two lanes. Offline: documents → chunker → contextualiser → embedder + BM25 indexer →
      indexes. Online: query → hybrid retrieval → rank fusion → reranker → top-k chunks → prompt →
      answer with citations. Evaluation probes attach after the reranker (recall@k) and after
      generation (faithfulness).
    example: >-
      Python lab: eight short documents about car-wash membership rules and five labelled
      questions; retrieve with rank_bm25 and with sentence-transformers cosine similarity, fuse with
      reciprocal rank fusion (score = Σ 1/(60 + rank)), and compute recall@3 and MRR for BM25,
      vectors and the fusion. Feed the top-3 fused chunks to Claude with an instruction to cite
      chunk ids.
    presentation: standard
    sources:
      - title: "This repo — 20-llm-agent-systems/rag-and-retrieval.md"
        url: https://github.com/yurii-mysak/scala-training-docs/blob/main/20-llm-agent-systems/rag-and-retrieval.md
        locator: "§1 \"The pipeline\"; §2 \"Chunking\"; §4 \"Hybrid search\"; §5 \"Reranking\"; §6 \"Evaluating retrieval\"; §7 \"Agentic retrieval versus one-shot RAG\""
        kind: docs
        verified: false
      - title: "Anthropic — Introducing Contextual Retrieval"
        url: https://www.anthropic.com/news/contextual-retrieval
        locator: "Sections on contextual embeddings + contextual BM25, adding a reranker, and the reported retrieval-failure reductions (quote the numbers)"
        kind: blog
        verified: false
      - title: "Lewis et al. — Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks (2020)"
        url: https://arxiv.org/abs/2005.11401
        locator: "Figure 1 and §2 \"Methods\" (retriever + generator)"
        kind: paper
        verified: false

  - id: ai-ml-29
    title: "Agents as distributed systems"
    level: I
    est_min: 30
    prereqs: [ai-ml-26, ai-ml-27]
    summary: >-
      An agent is an LLM in a loop that chooses tools, observes results and decides when to stop,
      which makes it a distributed system with a non-deterministic coordinator. Anthropic's
      "Building effective agents" separates workflows (predefined code paths: chaining, routing,
      parallelisation, orchestrator–workers, evaluator–optimiser) from agents (model-directed
      control flow) and argues for the simplest pattern that works. This rung maps those patterns
      onto the Akka reflexes already written up in the repo's agent-architectures.md: supervision,
      at-least-once delivery with idempotent tools, timeouts, budgets and backpressure.
    key_points:
      - "The augmented LLM (model + tools + retrieval + memory) as the building block."
      - "Workflow patterns versus autonomous agents; add autonomy only when it pays for itself."
      - "The loop: model call → tool_use → execute → tool_result → repeat; stop conditions and step/token budgets."
      - "Failure modes mapped: tool timeout ≈ ask timeout, retries need idempotency keys, conversation state ≈ single-writer entity (agent-architectures.md §5, agent-state-and-checkpointing.md)."
      - "Multi-agent orchestration multiplies tokens and coordination errors — worth it when parallel breadth pays."
    diagram: >-
      An agent loop drawn like an actor system: an orchestrator LLM (supervisor) dispatching
      messages to worker agents and tools, each tool call carrying an idempotency key and a timeout;
      a budget meter (steps, tokens, money) and a checkpoint store beside the loop.
    example: >-
      Python lab (~50 lines with the anthropic SDK): a one-tool agent (lookup_order(order_id)) using
      the Messages API tool-use loop; add a max_steps budget, a per-tool timeout, an idempotency key
      on a refund tool, and log each step as a JSON line. Inject a tool failure and watch whether the
      loop recovers or stops cleanly.
    presentation: standard
    sources:
      - title: "Anthropic Engineering — Building effective agents"
        url: https://www.anthropic.com/engineering/building-effective-agents
        locator: "Sections \"Building block: The augmented LLM\", the workflow patterns (prompt chaining, routing, parallelization, orchestrator-workers, evaluator-optimizer), \"Agents\", and the appendix on prompt-engineering your tools"
        kind: blog
        verified: false
      - title: "This repo — 20-llm-agent-systems/agent-architectures.md"
        url: https://github.com/yurii-mysak/scala-training-docs/blob/main/20-llm-agent-systems/agent-architectures.md
        locator: "§1 \"The decomposition\"; §3 \"Topologies\"; §5 \"Agents as distributed systems\"; §6 \"When an agent is the wrong answer\""
        kind: docs
        verified: false
      - title: "Anthropic Engineering — How we built our multi-agent research system"
        url: https://www.anthropic.com/engineering/multi-agent-research-system
        locator: "Architecture overview (orchestrator–worker) and the discussion of token usage and when multi-agent systems are worth the cost"
        kind: blog
        verified: false

  # ──────────────────── Phase 4 — AI engineering frontier (I → A) ────────────────────

  - id: ai-ml-30
    title: "MCP and tool-use protocols in depth"
    level: I
    est_min: 25
    prereqs: [ai-ml-29]
    summary: >-
      Tool use is a contract: the model sees a name, a description and a JSON Schema, emits a
      structured call, and your code executes it and returns a result. The Model Context Protocol
      standardises that contract between hosts (Claude Code, desktop apps, IDEs) and servers,
      adding resources, prompts, capability negotiation and transports on top of JSON-RPC 2.0.
      You already build MCP servers; this rung goes under the hood — lifecycle, transports,
      security — and into what makes a tool easy for a model to use correctly.
    key_points:
      - "Native tool use: tool definitions, tool_use / tool_result blocks, tool_choice, parallel tool calls."
      - "MCP architecture: host, client, server; server primitives (tools, resources, prompts) and client features (sampling, roots, elicitation)."
      - "Lifecycle and transports: initialize and capability negotiation; stdio versus Streamable HTTP; authorization for remote servers."
      - "Tool design for agents: fewer, higher-level tools, namespacing, token-efficient responses, actionable errors, descriptions written as prompts."
      - "Security: tool output is untrusted input (prompt injection), tool poisoning, least privilege, confirmation before side effects."
    diagram: >-
      Sequence diagram: host (Claude Code) ↔ MCP client ↔ MCP server — initialize → capabilities →
      tools/list → the model decides on a tool_use → tools/call → result → tool_result back into the
      model's context; a dashed trust boundary encloses the server and the external API it calls.
    example: >-
      Lab: a ~25-line MCP server with the official Python SDK (FastMCP) exposing one tool,
      get_wash_status(site_id), with typed parameters and a precise description; inspect it with
      npx @modelcontextprotocol/inspector, list tools, call it and read the JSON-RPC messages. Then
      rewrite the description and error message following Anthropic's tool-writing guidance and
