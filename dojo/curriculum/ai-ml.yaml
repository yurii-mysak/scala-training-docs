  - id: ai-ml-32
    title: "Calibration: when 0.8 means 80%"
    level: I
    est_min: 25
    prereqs: [ai-ml-09, ai-ml-11]
    summary: >-
      A model is calibrated when, among all the cases it scores 0.8, about 80% turn out positive.
      Calibration is what makes a probability usable for decisions — thresholds,
      abstain-and-escalate rules, expected-cost routing — and it is separate from accuracy: a
      model can rank perfectly and still be overconfident. Modern deep networks are often
      miscalibrated, and simple post-hoc fixes (temperature scaling, Platt scaling, isotonic
      regression) repair much of it. This is the prerequisite for the decision models in rungs 33–35.
    key_points:
      - "Definition; the reliability diagram; expected calibration error (ECE) and its binning caveats."
      - "Proper scoring rules — log loss and Brier score — reward calibrated probabilities; accuracy and AUC do not."
      - "Why modern networks are overconfident (Guo et al.) and temperature scaling as a one-parameter fix fitted on validation data."
      - "Platt (sigmoid) versus isotonic calibration in scikit-learn's CalibratedClassifierCV, and their data needs."
      - "Using calibrated probabilities: expected-cost thresholds and abstention (act if p ≥ τ, otherwise escalate)."
    diagram: >-
      A reliability diagram: predicted-confidence bins on the x-axis, observed accuracy on the
      y-axis, the diagonal as perfect calibration; an overconfident model's bars fall below the
      diagonal at high confidence, and the same model after temperature scaling hugs it; a small
      histogram of prediction counts sits underneath.
    example: >-
      scikit-learn lab: train GaussianNB and LogisticRegression on make_classification
      (n_samples=20000); plot calibration_curve for both and compute brier_score_loss and log_loss;
      wrap GaussianNB in CalibratedClassifierCV(method="isotonic") and re-plot. Then implement
      temperature scaling for a softmax classifier by finding T that minimises validation NLL with
      scipy.optimize.minimize_scalar.
    presentation: deep
    sources:
      - title: "Guo, Pleiss, Sun, Weinberger — On Calibration of Modern Neural Networks (ICML 2017)"
        url: https://arxiv.org/abs/1706.04599
        locator: "Figure 1 (LeNet vs ResNet reliability diagrams); §2 definitions (reliability diagrams, ECE); §4.2 temperature scaling"
        kind: paper
        verified: false
      - title: "scikit-learn User Guide — Probability calibration"
        url: https://scikit-learn.org/stable/modules/calibration.html
        locator: "Sections \"Calibration curves\" and \"Calibrating a classifier\" (sigmoid vs isotonic, CalibratedClassifierCV usage)"
        kind: docs
        verified: false

  - id: ai-ml-33
    title: "Decision models: Jev and the System One idea"
    level: A
    est_min: 30
    prereqs: [ai-ml-32]
    summary: >-
      A decision model offers a different contract from a chat model: you supply context, a
      question and a closed set of options, and it returns a calibrated probability for each
      option — a fast, "System One" judgement rather than deliberate free-text generation.
      TypeSafe's Jev, described in a September 2026 post and reachable through Vercel AI Gateway
      and OpenRouter, works this way. This rung explains the contract, what calibrated option
      probabilities buy you over parsing an LLM's text answer, and how to call Jev; because these
      sources post-date the model's training data, every product claim in the lesson must be a
      verbatim quote.
    key_points:
      - "The contract: (context, question, options) → probability per option, versus prompt → text; no output parsing, no off-list answers."
      - "System One versus System Two (Kahneman's framing): fast classification-style judgement versus deliberate multi-step generation."
      - "Why calibration (rung 32) is the product: thresholds, abstention and expected-cost decisions become arithmetic."
      - "Access through OpenAI-compatible gateways (OpenRouter, Vercel AI Gateway): model id, request shape and pricing come from the guides, never from memory."
      - "Evaluating one: accuracy plus log loss/Brier and a reliability diagram on your own labelled cases, against an LLM baseline."
    diagram: >-
      Two contracts side by side. Left: a chat LLM receives a prompt and emits free text that a
      parser must map to an option, with a failure branch for unparseable or off-list answers.
      Right: a decision model receives options [A, B, C] and emits a probability vector such as
      [0.71, 0.22, 0.07], which feeds a rule "act if max p ≥ τ, else escalate".
    example: >-
      Lab: following the OpenRouter Jev guide exactly (model id and request fields as documented
      there), send one curl request with a car-wash support ticket and four routing options and
      print the returned probabilities. Send the same ticket to a chat model asking for one option
      name, and compare latency (curl -w '%{time_total}') and the effort of handling each output.
      Label ten tickets and save them for rung 34.
    presentation: deep
    sources:
      - title: "mager.co — Jev decision model (2026-09-19)"
        url: https://mager.co/blog/2026-09-19-jev-decision-model/
        locator: "Whole post — what Jev returns, the System One framing, how it is accessed through gateways"
        kind: blog
        verified: false
      - title: "OpenRouter docs — community guide: Jev"
        url: https://openrouter.ai/docs/guides/community/jev
        locator: "Request format (question and option list), response fields carrying the probabilities, model id"
        kind: docs
        verified: false
      - title: "Vercel AI Gateway documentation"
        url: https://vercel.com/docs/ai-gateway
        locator: "Getting started; models and providers; OpenAI-compatible API"
        kind: docs
        verified: false

  - id: ai-ml-34
    title: "Routing and tool selection as classification: Clef on Workers AI"
    level: A
    est_min: 30
    prereqs: [ai-ml-30, ai-ml-33]
    summary: >-
      Many decisions inside an agent are classification in disguise: which tool to call, which
      sub-agent or model tier to route to, whether to escalate to a human. Cloudflare's Clef and
      Clef-flash, open-weight decision models released on Workers AI on 2026-10-01 and positioned
      against Jev, make it practical to run such classifiers at the edge and to inspect or
      fine-tune them. This rung frames routing as classification, sets out when a decision model
      beats an LLM and when it does not, and builds a router with an abstention threshold.
    key_points:
      - "Routing and tool selection as K-way classification: the options are tool names or routes, a closed and known label set."
      - "When a decision model wins: high volume, tight latency or cost budgets, closed option sets, need for calibrated confidence and auditability."
      - "When an LLM wins: open-ended output, multi-step reasoning, option sets that change per request without good descriptions, or when tool arguments are needed and not just the choice."
      - "Clef versus Clef-flash versus Jev — open weights versus hosted, size versus latency — stated only as the sources state it, with quotes."
      - "Router design: confidence threshold τ, fallback to an LLM or a human below τ, every decision logged for evaluation; cascades continue in rung 37."
    diagram: >-
      A router flowchart: incoming request → decision model over {billing_tool, wash_status_tool,
      refund_agent, human} → if max p ≥ τ dispatch to that option, else → LLM fallback or human
      queue; a side panel plots accuracy, coverage (share auto-routed) and cost per 1,000 requests
      as τ varies.
    example: >-
      Lab: call Clef-flash through the Workers AI REST API (POST
      https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/ai/run/ followed by the model id
      from the changelog, with the input format it documents) on the ten labelled tickets from
      rung 33; compute accuracy and Brier score; sweep τ from 0.5 to 0.95 and plot coverage against
      accuracy; put Jev and a chat-model baseline in the same table.
    presentation: deep
    sources:
      - title: "Cloudflare changelog — Clef on Workers AI (2026-10-01)"
        url: https://developers.cloudflare.com/changelog/post/2026-10-01-clef-workers-ai/
        locator: "Whole entry — model ids (Clef, Clef-flash), input/output schema, licence and availability"
        kind: news
        verified: false
      - title: "Flavio Copes — Clef"
        url: https://flaviocopes.com/clef/
        locator: "Whole post — practical walkthrough of calling Clef and what it returns"
        kind: blog
        verified: false
      - title: "The Register — Cloudflare tries to outplay Jev with open-weight Clef models (2026-10-01)"
        url: https://www.theregister.com/ai-and-ml/2026/10/01/cloudflare-tries-to-outplay-jev-with-open-weight-clef-models/5300649
        locator: "Comparison with Jev; open-weight licensing and positioning"
        kind: news
        verified: false

  - id: ai-ml-35
    title: "RL fine-tuning of decision models"
    level: A
    est_min: 30
    prereqs: [ai-ml-16, ai-ml-24, ai-ml-34]
    summary: >-
      A decision model's output is a probability distribution over options, which makes it a
      natural policy for reinforcement learning: sample an option, observe a reward (was the route
      right, did the tool call succeed), and push probability toward options that earned reward.
      This rung builds the policy-gradient idea from REINFORCE to the group-relative baseline used
      by GRPO, shows why a 0/1 reward collapses calibration while a proper scoring rule preserves
      it, and covers the practical path for open-weight models like Clef: LoRA adapters, a KL
      penalty against the reference model, and offline evaluation before rollout.
    key_points:
      - "Policy gradient in one line: ∇J = E[R · ∇log π(a|s)]; baselines cut variance; GRPO uses the mean reward of a sampled group as the baseline, with no value network."
      - "Rewards from logs: outcome labels, delayed signals, and bandit feedback (you only see the outcome of the option you chose)."
      - "Calibration-preserving objectives: log score or Brier versus 0/1 correctness, whose optimum is a deterministic, overconfident policy."
      - "Stability: KL penalty to the reference model, small learning rates, LoRA adapters on open weights."
      - "Reward hacking and distribution shift; offline evaluation and shadow traffic before promotion (rung 36)."
    diagram: >-
      An RL loop: context (ticket) → decision-model policy π(option | context) → a group of K
      sampled options → environment (tool runs or a human verifies) → rewards → GRPO update
      (advantage = reward − group mean, KL to the reference model) → updated LoRA adapter; a side
      gauge tracks ECE from the reliability diagram so calibration drift stays visible.
    example: >-
      numpy lab: a 3-option softmax policy for one context where the correct option is B 70% of
      the time and A 30%. (a) REINFORCE with 0/1 reward — sample an option, reward 1 if it matches
      the sampled label, θ += lr·R·∇log π — and watch p(B) climb toward 1. (b) Gradient ascent on
      the log score log π(label) — and watch p converge to about [0.3, 0.7, 0.0]. Compare Brier
      scores. Finally replace the single sample in (a) with a group of 8 and a group-mean baseline,
      GRPO-style, and compare gradient variance.
    presentation: deep
    sources:
      - title: "OpenAI Spinning Up in Deep RL"
        url: https://spinningup.openai.com/
        locator: "Introduction to RL → Part 3 \"Intro to Policy Optimization\" (deriving the simplest policy gradient; baselines)"
        kind: course
        verified: false
      - title: "Shao et al. — DeepSeekMath: Pushing the Limits of Mathematical Reasoning in Open Language Models (2024)"
        url: https://arxiv.org/abs/2402.03300
        locator: "The reinforcement-learning section introducing Group Relative Policy Optimization (GRPO), and the PPO-versus-GRPO figure"
        kind: paper
        verified: false
      - title: "Hugging Face TRL documentation"
        url: https://huggingface.co/docs/trl
        locator: "GRPOTrainer page; PEFT/LoRA integration"
        kind: docs
        verified: false

  - id: ai-ml-36
    title: "Evals in CI: regression gates for non-deterministic systems"
    level: A
    est_min: 30
    prereqs: [ai-ml-27, ai-ml-31]
    summary: >-
      Once prompts, models, tools and decision thresholds are code, every change needs a
      regression gate — but the system under test is stochastic, slow, and costs money per run.
      This rung designs an evals-in-CI pipeline: a tiered suite (fast deterministic checks on
      every PR, sampled model-graded evals nightly), statistically sound pass/fail rules, pinned
      model and judge versions, and budget controls. It operationalises the repo's
      evaluating-agents.md §7 "Regression detection in CI" with concrete tooling.
    key_points:
      - "Tiering: smoke (deterministic, every commit) → regression set (sampled, per PR, budgeted) → full suite and human review (nightly or pre-release)."
      - "Gate on intervals, not points: several samples per case, bootstrap or Wilson intervals; pass@k versus pass^k for consistency."
      - "Pin everything that can drift — model snapshot ids, judge prompt and model, dataset version — and record them in the run artifact."
      - "Flakiness: quarantine, temperature policy, separating model regressions from infrastructure errors."
      - "Cost and time budgets in CI; caching unchanged cases; tooling options (promptfoo, Inspect, plain pytest)."
    diagram: >-
      CI pipeline: PR opened → lint and unit tests → deterministic eval tier (seconds) → sampled
      regression tier (k samples × N cases, budget cap) → compare with the baseline run (bootstrap
      interval on the difference) → gate pass/fail → artifact (scores, model ids, cost); a nightly
      job runs the full suite and refreshes the baseline.
    example: >-
      Lab: a GitHub Actions workflow (~30 lines of YAML) that runs a pytest-based eval of the
      rung-27 ticket-to-JSON prompt on 20 cases × 3 samples, writes results.json, and fails when the
      95% bootstrap interval of (new − baseline) pass rate lies entirely below zero — a confident
      regression — while only warning when the interval overlaps zero. The bootstrap is about 15
      lines of numpy.
    presentation: deep
    sources:
      - title: "This repo — 20-llm-agent-systems/evaluating-agents.md"
        url: https://github.com/yurii-mysak/scala-training-docs/blob/main/20-llm-agent-systems/evaluating-agents.md
        locator: "§7 \"Regression detection in CI\"; §11 \"A practical eval architecture\"; §12 \"Anti-patterns\""
        kind: docs
        verified: false
      - title: "Hamel Husain — Your AI Product Needs Evals"
        url: https://hamel.dev/blog/posts/evals/
        locator: "The three levels: unit tests, human and model evaluation, A/B testing; the section on running assertions in CI"
        kind: blog
        verified: false
      - title: "promptfoo documentation"
        url: https://www.promptfoo.dev/docs/intro/
        locator: "Configuration → assertions and metrics; integrations → CI/CD (GitHub Actions)"
        kind: docs
        verified: false

  - id: ai-ml-37
    title: "Cost and latency engineering"
    level: A
    est_min: 30
    prereqs: [ai-ml-25, ai-ml-34]
    summary: >-
      In production, tokens are money and time-to-first-token is user experience, so cost and
      latency become first-class design constraints. This rung builds a cost model from token
      counts, then works through the levers in order of payoff: shorter and cached prompts, the
      right model tier per request (routing and cascades, with a decision model from rung 34 as
      the router), batch APIs for offline work, streaming for perceived latency, and on the
      serving side KV-cache management, continuous batching and speculative decoding. It extends
      the repo's production-llmops.md §4–6.
    key_points:
      - "Cost model: (input tokens × input price + output tokens × output price) × volume; output tokens dominate generation latency."
      - "Prompt caching of stable prefixes; batch processing for non-interactive jobs; per-request token budgets."
      - "Model cascades and routing: cheap model or decision model first, escalate on low confidence, measure quality per tier."
      - "Latency anatomy: queueing, prefill (TTFT), decode (tokens/s), tool round-trips; streaming and parallel tool calls."
      - "Serving-side levers for open weights: continuous batching, PagedAttention KV management, quantisation, speculative decoding."
    diagram: >-
      Left: a latency waterfall for one agent turn (network → queue → prefill/TTFT → decode → tool
      call → second model call). Right: a cost waterfall showing monthly spend after each lever
      (caching, routing, batching) is applied.
    example: >-
      Python lab: a cost calculator for a support assistant at 270k interactions per month (the
      volume in section 20's case study), 3k input and 400 output tokens per call, 2.5 calls per
      interaction; take current prices from the provider's pricing page rather than memory. Model
      three levers — 80% of input served from a cached prefix, 60% of traffic resolved by a
      decision-model router, nightly summarisation moved to batch processing — and print the
      monthly total after each.
    presentation: deep
    sources:
      - title: "This repo — 20-llm-agent-systems/production-llmops.md"
        url: https://github.com/yurii-mysak/scala-training-docs/blob/main/20-llm-agent-systems/production-llmops.md
        locator: "§4 \"Cost and token budgeting\"; §5 \"Latency budgets and streaming UX\"; §6 \"Caching\"; §7 \"Rate limits, retries, provider failover\""
        kind: docs
        verified: false
      - title: "Claude developer documentation"
        url: https://docs.claude.com/
        locator: "Build with Claude → Prompt caching; Batch processing; Token counting; Streaming messages; and the pricing page"
        kind: docs
        verified: false
      - title: "Kwon et al. — Efficient Memory Management for Large Language Model Serving with PagedAttention (vLLM, 2023)"
        url: https://arxiv.org/abs/2309.06180
        locator: "Introduction and early figures on KV-cache memory waste; the PagedAttention method section"
        kind: paper
        verified: false

  - id: ai-ml-38
    title: "Capstone: ship a small ML or agent project end to end"
    level: A
    est_min: 30
    prereqs: [ai-ml-36, ai-ml-37]
    summary: >-
      The ladder ends by shipping something real and small enough to finish in a few sessions: a
      problem statement and metric, data or an eval set, a baseline, a model or agent, an
      evaluation report, a deployment and monitoring. This rung is the plan and the definition of
      done rather than a lecture; suggested projects reuse what was built along the way — a
      calibrated ticket router (decision model versus fine-tuned classifier versus LLM), an MCP
      server with evals in CI, or a Kaggle tabular submission with a written post-mortem. The
      write-up becomes the filed lesson.
    key_points:
      - "Scope by metric: one user-facing decision, one primary metric, one guardrail metric, a baseline to beat."
      - "Data and evals first: a labelled set (100+ cases or a Kaggle split) built before the model."
      - "Baselines in order: rule or heuristic → classical ML (rung 10) or decision model (rung 33) → LLM or agent; keep the simplest that meets the bar."
      - "Ship it: a containerised service or MCP server, evals in CI (rung 36), a cost and latency budget (rung 37), logging for online evaluation."
      - "Post-mortem: what the metric hid, a calibration check, the next iteration; file into 24-ai-ml-foundations."
    diagram: >-
      A project timeline: problem and metric → data/eval set → baseline → model or agent →
      offline eval report → deploy behind a CI gate → monitor (online metrics, drift, cost) →
      feedback into the eval set, with "definition of done" checkpoints marked along it.
    example: >-
      Lab (the first ten minutes of the capstone): write a one-page project brief in Markdown —
      problem, user, decision, metric and target, guardrail, data source, baseline, eval plan,
      deployment target, cost budget — for one suggested project, and create the repo skeleton
      (src/, evals/, .github/workflows/eval.yml, README) with one failing eval test that defines done.
    presentation: deep
