track: ai-ml
name: AI / ML foundations
weight: 5
files_to: 24-ai-ml-foundations
description: >-
  One ladder from "what does a model actually optimise" to shipping calibrated decision models
  and agents, for an experienced backend/distributed-systems engineer with no formal ML
  background. Phase 1 (rungs 1–11, Beginner) follows the dou.ua ML/CV roadmap by The Fourth Law
  team: Kaggle Learn for the hands-on mechanics, 3Blue1Brown and Khan Academy for linear algebra,
  StatQuest for statistics, so every later idea has its maths in place before it is needed.
  Phase 2 (rungs 12–19) builds neural networks from a single neuron upward, doing backpropagation
  by hand before PyTorch's autograd does it, with CS231n lectures 1–7 as the reference for
  training and convolutional networks. Phase 3 (rungs 20–29) runs embeddings → attention →
  Transformer → tokens → training stages → inference → prompting, then bridges into the
  interview-level material already in 20-llm-agent-systems (evaluation, RAG, agents) instead of
  repeating it. Phase 4 (rungs 30–38) is the engineering frontier — MCP and agent harnesses,
  calibration as the prerequisite for decision models (Jev, Clef), RL fine-tuning, evals in CI,
  cost and latency — and ends with an end-to-end capstone.
