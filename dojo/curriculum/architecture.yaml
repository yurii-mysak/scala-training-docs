  - id: architecture-19
    title: Case study — Spotify's data and event-delivery platform
    level: A
    est_min: 25
    prereqs: [architecture-13, architecture-18]
    summary: >-
      Spotify's event-delivery system and data platform are a long, well-documented migration story,
      with explicit reasoning about delivery guarantees, operational cost and ownership. The writer
      picks the relevant posts; the lesson reads them with DDIA vocabulary (logs, at-least-once
      delivery, batch vs stream) and this track's vocabulary (quality-attribute trade-offs,
      incremental migration, ownership of data).
    key_points:
      - Requirements as quality attributes — completeness, latency, cost and operability of event delivery
      - Build vs buy — moving from self-run infrastructure to managed services, and what was traded away
      - Migration strategy — running old and new in parallel, verifying completeness, cutting over incrementally
      - Ownership — producers own event schemas, the platform owns the pipes
      - Lessons that transfer to a much smaller system (car-wash POS events)
    diagram: >-
      Before/after architecture of event delivery as described in the chosen posts — producers, the
      old pipeline and its storage, the new managed pipeline and processing — with the parallel-run
      verification path highlighted.
    example: >-
      From the chosen posts extract the system's top three quality-attribute scenarios and its main
      trade-off point, and write a five-line ADR summary (context, decision, consequences) as Spotify
      might have written it. Then apply the same lens to the car-wash platform: which site events must
      never be lost (transactions) and which may be sampled (telemetry), and what each implies for
      delivery guarantees.
    presentation: deep
    sources:
      - title: Spotify Engineering blog
        url: https://engineering.atspotify.com/
        locator: the "Spotify's Event Delivery – The Road to the Cloud" series (2016, parts I–III) and later data-platform posts — the writer picks 2-3
