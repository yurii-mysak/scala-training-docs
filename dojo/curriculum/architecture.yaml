rungs:
  # ---------------------------------------------------------------- Beginner — design principles
  - id: architecture-01
    title: Coupling and cohesion
    level: B
    est_min: 20
    prereqs: []
    summary: >-
      The two words behind almost every design argument: cohesion (things that change together live
      together) and coupling (how much one module must know about, or change with, another). One
      before/after refactoring makes the terms concrete, and connascence gives a finer vocabulary for
      kinds of coupling. Opens the new 25-software-architecture section; the glossary in
      15-system-design/Architecture-Dev-Process.md §2 stays the quick reference.
    key_points:
      - Cohesion — the elements of a module serve one purpose and change for the same reason
      - Coupling — how far a change in one module forces a change in another; aim for low coupling and high cohesion
      - Classic coupling kinds from worst to best (content, common, control, stamp, data) and connascence (name, type, meaning, position, algorithm, timing) with strength, locality and degree
      - Coupling to stable things is cheap, coupling to volatile things is expensive
    diagram: >-
      Before and after module diagram — a WashService that computes prices, formats receipts and talks
      to the payment terminal SDK, split into Pricing, Receipt and a PaymentGateway trait, with arrows
      showing which module depends on which.
    example: >-
      Take a 30-line Scala WashService.completeWash method that prices a wash with a hard-coded match
      on package-name strings, formats a receipt string and calls the terminal SDK directly. List every
      reason it could change (new package, receipt layout, new terminal vendor). Extract Pricing and
      Receipt, put the terminal behind a trait, and count reasons-to-change per module after the split;
      name the connascence of meaning (magic package strings) you removed.
    presentation: minimal
    sources:
      - title: Connascence
        url: https://connascence.io/
        locator: pages on static and dynamic connascence types, and on strength, locality and degree
        kind: docs
        verified: false
      - title: Reducing Coupling (Martin Fowler, IEEE Software, 2001)
        url: https://martinfowler.com/ieeeSoftware/coupling.pdf
        locator: whole column (why coupling matters, dependency direction, separated interfaces)
        kind: paper
        verified: false

  - id: architecture-02
    title: Dependency direction and the dependency rule
    level: B
    est_min: 20
    prereqs: [architecture-01]
    summary: >-
      Which way arrows point matters more than how many there are. Source-code dependencies should
      point toward the stable, abstract policy (the domain), never toward volatile details such as
      frameworks, databases and devices; when control flow has to go the other way, an interface owned
      by the policy inverts the dependency. This is the dependency rule at the heart of Clean
      Architecture and the bridge to the D in SOLID.
    key_points:
      - Source-code dependency vs runtime control flow — they can point in opposite directions
      - Depend in the direction of stability, and stable modules should be abstract
      - The dependency rule — inner circles (entities, use cases) know nothing about outer ones (controllers, gateways, DB, UI)
      - Invert a dependency with an interface owned by the high-level module, and wire implementations at the composition root (dependency injection)
      - No dependency cycles between modules
    diagram: >-
      Two small diagrams — before, Pricing imports PostgresPriceRepo (the domain depends on the DB);
      after, Pricing depends on a PriceRepo trait in the domain package and PostgresPriceRepo
      implements it, with a dashed control-flow arrow still going from domain to DB.
    example: >-
      In a tiny Scala project (or on paper) write package domain with trait PriceRepo and
      class Pricing(repo: PriceRepo), and package infra with class PostgresPriceRepo extends
      domain.PriceRepo; wire them in Main. Draw the import graph and check no arrow points from
      domain to infra. Then grep the imports of one real module you own and find one dependency that
      points the wrong way.
    presentation: minimal
    sources:
      - title: The Clean Architecture (Robert C. Martin, 2012)
        url: https://blog.cleancoder.com/uncle-bob/2012/08/13/the-clean-architecture.html
        locator: sections "The Dependency Rule" and "Crossing boundaries"
        kind: blog
        verified: false
      - title: Inversion of Control Containers and the Dependency Injection pattern (Martin Fowler)
        url: https://martinfowler.com/articles/injection.html
        locator: sections "Inversion of Control" and "Forms of Dependency Injection"
        kind: blog
        verified: false

  - id: architecture-03
    title: SOLID in practice I — SRP, OCP, LSP
    level: B
    est_min: 25
    prereqs: [architecture-02]
    summary: >-
      The first three SOLID principles read as practical heuristics rather than slogans: a module
      answers to one actor, it is extended by adding code rather than editing tested code, and a
      subtype keeps the contract of its base type. Deepens the micro-examples in
      15-system-design/Architecture-Dev-Process.md §2.1 with Scala-flavoured before/after code.
    key_points:
      - SRP — a module is responsible to one actor (one source of change), which is not the same as doing one thing
      - OCP — add behaviour by adding code (new implementations) instead of editing stable code, and know which axis of change you are protecting
      - LSP — a subtype must keep the base type's contract (no stronger preconditions, no weaker postconditions); the rectangle/square trap
      - In Scala, sealed ADTs make OCP a deliberate trade-off — new functions are easy, new cases are not (the expression problem)
    diagram: >-
      Class diagram of a DiscountPolicy trait with PercentageDiscount and FixedDiscount, a new
      LoyaltyTierDiscount added without touching Checkout (OCP), and a broken subtype that throws for
      small totals (an LSP violation) marked in red.
    example: >-
      Write a 20-line Scala Checkout that applies discounts through a match on a string type. Refactor
      it to a DiscountPolicy trait and add a loyalty-tier policy without touching Checkout (OCP). Then
      write a policy that throws for totals under 10 and show which existing caller breaks (LSP).
      Finally name the actor each class answers to (SRP).
    presentation: minimal
    sources:
      - title: The Principles of OOD (Robert C. Martin)
        url: http://butunclebob.com/ArticleS.UncleBob.PrinciplesOfOod
        locator: the list of class-design principles (SRP, OCP, LSP) and the linked articles
        kind: blog
        verified: false
      - title: The Clean Code Blog (Robert C. Martin)
        url: https://blog.cleancoder.com/
        locator: posts "The Single Responsibility Principle" (May 2014) and "The Open Closed Principle" (May 2014)
        kind: blog
        verified: false

  - id: architecture-04
    title: SOLID in practice II — ISP and DIP
    level: B
    est_min: 20
    prereqs: [architecture-03]
    summary: >-
      Interface segregation (clients should not depend on methods they do not use, hence role
      interfaces) and dependency inversion (the high-level policy owns the abstraction and details
      implement it). Together with the dependency rule from rung 2 they are what make ports and
      adapters possible, and they map directly onto Scala traits and constructor injection.
    key_points:
      - ISP — split fat interfaces into role interfaces shaped by each client; fewer forced rebuilds and fewer fake methods in test doubles
      - DIP — high-level and low-level modules both depend on abstractions, and the abstraction belongs to the high-level side
      - DIP (a principle) vs dependency injection (a technique) vs IoC containers (a tool)
      - Scala idioms — small traits, constructor parameters, given/using, or effect-system layers for wiring
    diagram: >-
      A fat PaymentTerminal interface (authorize, capture, refund, printReceipt, updateFirmware) split
      into role interfaces used by three clients — Checkout, Refunds and Maintenance.
    example: >-
      Take a six-method PaymentTerminal trait and the three clients that use it; write the role
      interfaces each client actually needs, and a test double for Checkout that now implements two
      methods instead of six. Then invert one dependency: move an Authorizer trait into the checkout
      module and make the vendor SDK adapter implement it.
    presentation: standard
    sources:
      - title: RoleInterface (Martin Fowler, bliki)
        url: https://martinfowler.com/bliki/RoleInterface.html
        locator: whole entry (role vs header interfaces)
        kind: blog
        verified: false
      - title: Inversion of Control Containers and the Dependency Injection pattern (Martin Fowler)
        url: https://martinfowler.com/articles/injection.html
        locator: sections "Inversion of Control", "Constructor Injection with PicoContainer" and "Service Locator vs Dependency Injection"
        kind: blog
        verified: false
      - title: The Principles of OOD (Robert C. Martin)
        url: http://butunclebob.com/ArticleS.UncleBob.PrinciplesOfOod
        locator: the Interface Segregation and Dependency Inversion principle entries
        kind: blog
        verified: false

  - id: architecture-05
    title: Composition over inheritance, and information hiding
    level: B
    est_min: 25
    prereqs: [architecture-01]
    summary: >-
      Parnas's 1972 criterion — decompose a system by the design decisions likely to change and hide
      each behind a module interface — is where modularity as we use the word comes from. The rung
      pairs it with "favour composition over inheritance": inheritance exposes a parent's internals to
      its subclasses (the fragile base class), while composition and delegation keep the secret
      hidden. Scala's traits, case classes and ADTs make both concrete.
    key_points:
      - Parnas — modularise by secrets (decisions likely to change), not by processing steps
      - Information hiding — the interface reveals as little as possible about the decision behind it
      - Fragile base class — a subclass breaks when the parent's internal call pattern changes; inheritance is white-box reuse
      - Composition and delegation are black-box reuse; Scala trait mixins are still inheritance and need the same care
      - Algebraic data types plus functions as a composition-first alternative to class hierarchies
    diagram: >-
      Parnas's two decompositions of the KWIC index system side by side — modules by processing step
      vs modules by hidden decision — showing the change "store lines differently in memory" rippling
      through the first and staying inside one module in the second.
    example: >-
      Read the KWIC example in Parnas's paper (its two modularisations). Then, in Scala, subclass
      java.util.HashSet as CountingSet, override add and addAll to count insertions, call addAll with
      three elements and observe a count of six, because the parent's addAll calls add internally (the
      classic fragile-base-class demo). Rewrite it as a wrapper that delegates to a Set and confirm
      the count is three.
    presentation: standard
    sources:
      - title: On the Criteria To Be Used in Decomposing Systems into Modules (D. L. Parnas, CACM 1972)
        url: https://dl.acm.org/doi/10.1145/361598.361623
        locator: the KWIC example — Modularization 1 vs Modularization 2, and the section on the criteria
        kind: paper
        verified: false
      - title: Scala 3 Book — Domain Modeling, Tools
        url: https://docs.scala-lang.org/scala3/book/domain-modeling-tools.html
        locator: sections on traits, case classes and enums (ADTs)
        kind: docs
        verified: false

  # ---------------------------------------------------------------- Intermediate — structure, DDD, docs, integration
  - id: architecture-06
    title: Layered, hexagonal (ports and adapters) and clean architecture
    level: I
    est_min: 25
    prereqs: [architecture-02, architecture-04]
    summary: >-
      Three ways of drawing the same idea — keep domain logic independent of delivery and
      infrastructure. Layering (presentation, domain, data) is the familiar default; hexagonal
      architecture reframes it as a domain core with ports and interchangeable adapters (UI, tests,
      DB, devices); Clean Architecture adds concentric policy levels and the dependency rule. The rung
      shows when each pays for itself and when it is ceremony.
    key_points:
      - Presentation–domain–data layering; strict vs relaxed layers; the layer-skipping and anaemic-domain traps
      - Hexagonal — driving (primary) vs driven (secondary) ports, one adapter per technology, the test harness as just another adapter
      - Clean Architecture — entities, use cases, interface adapters, frameworks and drivers; data crosses boundaries as simple structures
      - Same core idea with different emphasis; the cost is indirection and mapping code, so apply it where the domain is non-trivial or the infrastructure volatile
      - Package by layer vs package by feature or component
    diagram: >-
      A car-wash site controller drawn as a hexagon — driving ports (POS UI, mobile-app API, test
      harness) on the left, driven ports (payment terminal, wash tunnel controller, cloud sync,
      Postgres) on the right, each with its adapter outside the hexagon.
    example: >-
      Take one use case, "start a wash for a member", and list its ports, marking which are driving
      and which are driven. Write the use-case function signature in Scala so it depends only on ports
      (MemberRepo, TunnelController, Clock), then a ten-line set of in-memory adapters and one unit
      test that runs the use case with no database or hardware.
    presentation: standard
    sources:
      - title: PresentationDomainDataLayering (Martin Fowler, bliki)
        url: https://martinfowler.com/bliki/PresentationDomainDataLayering.html
        locator: whole entry
        kind: blog
        verified: false
      - title: Hexagonal Architecture (Alistair Cockburn)
        url: https://alistair.cockburn.us/hexagonal-architecture/
        locator: sections on intent, ports and adapters, and the test-harness adapter
        kind: blog
        verified: false
      - title: The Clean Architecture (Robert C. Martin, 2012)
        url: https://blog.cleancoder.com/uncle-bob/2012/08/13/the-clean-architecture.html
        locator: the concentric-circles diagram and the sections on each layer
        kind: blog
        verified: false

  - id: architecture-07
    title: DDD basics I — ubiquitous language and bounded contexts
    level: I
    est_min: 25
    prereqs: [architecture-05]
    summary: >-
      The strategic half of domain-driven design: a ubiquitous language shared by domain experts and
      code, and bounded contexts that limit where one model and its language apply, related by a
      context map. As a Product Owner Yuriy already owns much of the car-wash language, so the lab maps
      the domain's own words onto contexts.
    key_points:
      - Ubiquitous language — the same terms in conversation, documents and code, and renaming code when the language changes
      - Bounded context — an explicit boundary inside which one model is consistent; the same word (customer, transaction) means different things in different contexts
      - Context-map relationships — partnership, shared kernel, customer–supplier, conformist, anticorruption layer, open host service with a published language
      - Contexts tend to align with teams (Conway's law) and often with deployable boundaries, but not necessarily one microservice each
    diagram: >-
      A context map for a car-wash platform — Wash Operations, Memberships & Billing, Payments, Site
      Equipment, Reporting — with relationship labels such as an anticorruption layer toward the
      payment processor and a published language from Wash Operations to Reporting.
    example: >-
      List ten terms the car-wash team uses every day (wash, package, member, plan, redemption,
      transaction, site, lane, tunnel, upsell). For each, write which context owns it and where the
      same word means something different elsewhere. Draw the context map, mark one anticorruption
      layer, and note one place where the code's names disagree with the business language.
    presentation: standard
    sources:
      - title: UbiquitousLanguage (Martin Fowler, bliki)
        url: https://martinfowler.com/bliki/UbiquitousLanguage.html
        locator: whole entry
        kind: blog
        verified: false
      - title: BoundedContext (Martin Fowler, bliki)
        url: https://martinfowler.com/bliki/BoundedContext.html
        locator: whole entry, including the sales/support context diagram
        kind: blog
        verified: false
      - title: Domain-Driven Design Reference (Eric Evans)
        url: https://www.domainlanguage.com/ddd/reference/
        locator: sections "Bounded Context", "Context Map" and the context-relationship patterns
        kind: docs
        verified: false

  - id: architecture-08
    title: DDD basics II — entities, value objects and aggregates
    level: I
    est_min: 25
    prereqs: [architecture-07]
    summary: >-
      The tactical building blocks: entities (identity over time), value objects (immutable, compared
      by value, natural as Scala case classes) and aggregates — the consistency boundary that protects
      invariants, changes in one transaction and is referenced from outside only by id. Choosing
      aggregate size is the main design decision; it links forward to transactions in the DDIA track
      and to 06-databases-and-distributed-data/Event-Sourcing-Guide.md.
    key_points:
      - Entity vs value object; making illegal states unrepresentable with value types
      - Aggregate and aggregate root — invariants enforced inside the boundary, outside references by id only
      - Rules of thumb — small aggregates, one aggregate per transaction, eventual consistency between aggregates
      - Domain events as the way aggregates communicate; repositories load and save whole aggregates
    diagram: >-
      A Membership aggregate (root Membership; Plate and BillingPeriod value objects inside) with its
      invariants listed inside the boundary, and a WashTransaction aggregate outside that refers to it
      only by membershipId.
    example: >-
      Model a car-wash Membership in Scala: value objects (Plate, PlanId, Money) as case classes, and
      an aggregate root with redeemWash(plate, at) and changePlan(planId) returning
      Either[DomainError, (Membership, List[Event])]. Enforce two invariants (a maximum number of plates
      per plan; at most one included wash per day). Decide whether WashTransaction belongs in the same
      aggregate and justify it in two sentences.
    presentation: standard
    sources:
      - title: DDD_Aggregate (Martin Fowler, bliki)
        url: https://martinfowler.com/bliki/DDD_Aggregate.html
        locator: whole entry
        kind: blog
        verified: false
      - title: ValueObject (Martin Fowler, bliki)
        url: https://martinfowler.com/bliki/ValueObject.html
        locator: whole entry
        kind: blog
        verified: false
      - title: Effective Aggregate Design (Vaughn Vernon)
        url: https://www.dddcommunity.org/library/vernon_2011/
        locator: Parts I–II — the rules on true invariants, small aggregates, reference by identity, eventual consistency outside the boundary
        kind: paper
        verified: false

  - id: architecture-09
    title: Documenting architecture I — the C4 model
    level: I
    est_min: 20
    prereqs: [architecture-06]
    summary: >-
      The C4 model gives architecture diagrams a shared set of abstractions (person, software system,
      container, component) and zoom levels (context, containers, components, code), plus notation
      guidance that makes a diagram readable without its author. It replaces whiteboard
      boxes-and-arrows with something reviewable, and pairs with ADRs in the next rung.
    key_points:
      - Abstractions first, notation second — person, software system, container (a separately runnable or deployable unit), component
      - Level 1 system context, level 2 containers, level 3 components; level 4 code is usually generated or skipped
      - Supplementary diagrams — system landscape, dynamic, deployment
      - Notation — a title and key on every diagram, element type and technology on every box, labelled one-directional arrows
      - Diagrams as code (Structurizr DSL, PlantUML, Mermaid C4) so diagrams are versioned with the repo
    diagram: >-
      A C4 level-2 container diagram of the car-wash platform — POS at the site, site controller,
      cloud API, member mobile app, payment provider and reporting database — written in Mermaid C4
      syntax.
    example: >-
      Draw the system-context and container diagrams (levels 1 and 2) for the car-wash platform in
      Mermaid (C4Context and C4Container) or Structurizr DSL. Then review them against the notation
      guidance on c4model.com and fix every miss — missing technology labels, unlabelled or
      two-headed arrows, no key.
    presentation: standard
    sources:
      - title: The C4 model for visualising software architecture
        url: https://c4model.com/
        locator: sections "Abstractions", "Diagrams" (System context, Container, Component, Code, supplementary) and "Notation"
        kind: docs
        verified: false

  - id: architecture-10
    title: Documenting architecture II — architecture decision records
    level: I
    est_min: 20
    prereqs: [architecture-09]
    summary: >-
      An ADR is a short note capturing one architecturally significant decision — its context, the
      decision, its status and its consequences — that is superseded rather than edited. Michael
      Nygard's 2011 format and the MADR template make decisions reviewable and give future maintainers
      the "why" that code and diagrams cannot. This sets up the capstone, where Yuriy writes one for a
      real POS decision.
    key_points:
      - Architecturally significant means hard to reverse, cross-cutting or expensive; not every choice deserves an ADR
      - Nygard's format — title, status, context, decision, consequences; one decision per record; superseded, never rewritten
      - MADR adds decision drivers and considered options with pros and cons
      - ADRs live in the repo next to the code, numbered, and enter review through a pull request
    diagram: >-
      State diagram of an ADR's life — proposed, accepted, then deprecated or superseded by a later
      ADR — with the pull-request review step on the way to accepted.
    example: >-
      Write a one-page retroactive ADR for a decision already made in a system you know (for example
      "Akka Cluster Sharding for per-site state" or "Postgres rather than Cassandra for transactions")
      in MADR format: context and problem, decision drivers, two or three considered options with pros
      and cons, outcome, consequences. Time-box it to ten minutes and note which section was hardest.
    presentation: standard
    sources:
      - title: Architectural Decision Records (adr.github.io)
        url: https://adr.github.io/
        locator: definitions of AD/ADR/ASR and the templates section
        kind: docs
        verified: false
      - title: Documenting Architecture Decisions (Michael Nygard, Cognitect blog, 2011)
        url: https://cognitect.com/blog/2011/11/15/documenting-architecture-decisions
        locator: sections "Decision record", "Format" and "Experience"
        kind: blog
        verified: false
      - title: MADR — Markdown Any Decision Records
        url: https://adr.github.io/madr/
        locator: the template and its sections (context, decision drivers, considered options, outcome, consequences)
        kind: docs
        verified: false

  - id: architecture-11
    title: API design — resources, versioning, idempotency
    level: I
    est_min: 30
    prereqs: [architecture-08]
    summary: >-
      Designing an HTTP API as a set of resources (nouns, collections, standard methods), choosing a
      versioning and compatibility policy, and making unsafe operations safe to retry with idempotency
      keys. Links 15-system-design/grpc_protobuf_schema_design.md (§4–§5 for the RPC side) and
      15-system-design/idempotency-and-deduplication.md (§3 for the full key protocol) instead of
      repeating them.
    key_points:
      - Resource-oriented design — resources and collections, standard methods (list, get, create, update, delete), custom methods sparingly; HTTP verbs and status codes used with intent
      - Safe vs idempotent methods — GET, PUT and DELETE are idempotent by definition, POST is not; idempotency keys make POST retryable
      - Compatibility — only additive changes within a major version; versioning in the path, a header or the package; a deprecation policy
      - Pagination, filtering and errors are part of the contract
      - REST vs gRPC — the resource model works for both; choose by consumers and tooling
    diagram: >-
      The car-wash API's resource tree (sites/{site}/lanes/{lane}, members/{member}/vehicles/{plate},
      washes/{wash}) with methods on each node, and a POST /washes carrying an Idempotency-Key header
      through a client retry.
    example: >-
      Design six endpoints for "start a wash, list a member's washes, cancel a wash": paths, methods,
      request and response bodies, status codes. Add an Idempotency-Key to POST /washes and write the
      server rule in pseudo-code (store key with response; same key and same body replays the stored
      response; same key with a different body is rejected). List two changes you could ship without a
      version bump and one that needs v2.
    presentation: standard
    sources:
      - title: Google Cloud API Design Guide — Resource-oriented design
        url: https://cloud.google.com/apis/design/resources
        locator: whole page; then the guide's "Standard methods" and "Versioning" pages
        kind: docs
        verified: false
      - title: Azure Architecture Center — RESTful web API design
        url: https://learn.microsoft.com/en-us/azure/architecture/best-practices/api-design
        locator: sections on organising the API around resources, idempotent operations, and versioning a RESTful web API
        kind: docs
        verified: false
      - title: Designing robust and predictable APIs with idempotency (Stripe blog)
        url: https://stripe.com/blog/idempotency
        locator: sections on idempotency keys and on retries with exponential backoff
        kind: blog
        verified: false

  - id: architecture-12
    title: Modular monolith vs microservices — and when to split
    level: I
    est_min: 25
    prereqs: [architecture-07, architecture-11]
    summary: >-
      Microservices buy independent deployment and scaling at the price of distributed-systems
      complexity, the "microservice premium". Fowler's MonolithFirst argues for starting with a
      well-modularised monolith whose module boundaries follow bounded contexts, and splitting only
      when a boundary is stable and a concrete force (team autonomy, scaling, release cadence, fault
      isolation) justifies it. The rung ends with a checklist for the split decision.
    key_points:
      - Microservice characteristics — componentisation via services, organised around business capabilities, decentralised data, smart endpoints and dumb pipes
      - The microservice premium — it only pays off above a certain system complexity; prerequisites such as rapid provisioning, monitoring and deployment
      - Modular monolith — enforce module boundaries inside one deployable (separate sbt modules, no shared tables, explicit module APIs)
      - Split triggers — team cognitive load, scaling differences, release cadence, failure isolation; extract with a strangler fig
      - The distributed-monolith anti-pattern — services that must be deployed together or share a database
    diagram: >-
      Fowler's premium sketch — productivity against base complexity, with the monolith and
      microservice curves crossing — and a marker for where the car-wash platform probably sits today.
    example: >-
      Score the car-wash platform's main modules (for example Wash Operations, Memberships, Payments,
      Reporting, Site Equipment) from 1 to 5 on four split forces (team ownership, scaling difference,
      change cadence, failure isolation) in a small table. Pick the module with the strongest case for
      extraction, name the data it would have to own, and list the synchronous calls that would start
      crossing a network boundary.
    presentation: standard
    sources:
      - title: Microservices (James Lewis and Martin Fowler, 2014)
        url: https://martinfowler.com/articles/microservices.html
        locator: section "Characteristics of a Microservice Architecture" and "Are Microservices the Future?"
        kind: blog
        verified: false
      - title: MonolithFirst (Martin Fowler, bliki)
        url: https://martinfowler.com/bliki/MonolithFirst.html
