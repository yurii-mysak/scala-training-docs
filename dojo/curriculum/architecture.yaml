  - id: architecture-13
    title: Event-driven architecture and eventual consistency
    level: I
    est_min: 25
    prereqs: [architecture-12]
    summary: >-
      "Event-driven" names at least four different patterns — event notification, event-carried state
      transfer, event sourcing and CQRS — with very different coupling and consistency consequences.
      The rung untangles them, then shows how to stay correct with eventual consistency between
      services: the transactional outbox, idempotent consumers and sagas. It links rather than repeats
      06-databases-and-distributed-data/Event-Sourcing-Guide.md and
      15-system-design/event_sourcing_cqrs_sagas_guide.md.
    key_points:
      - Event notification vs event-carried state transfer vs event sourcing vs CQRS
      - Events decouple senders from receivers but hide the overall flow — you need tracing and an event catalogue
      - The dual-write problem, and the transactional outbox (or CDC) for reliable publishing
      - Consumers must be idempotent, ordering holds per key only, and sagas (orchestrated or choreographed) coordinate multi-service workflows with compensations
      - Eventual consistency is a product decision — what may users see stale, and for how long
    diagram: >-
      Sequence diagram — the Memberships service commits a PlanChanged row and an outbox row in one
      transaction; a relay publishes to Kafka; Billing and Notifications consume idempotently, one of
      them ignoring a redelivered duplicate.
    example: >-
      For the flow "member upgrades plan, billing prorates, the site gate then allows the premium
      package", classify each message as a notification, a state transfer or a command. Write the
      outbox table DDL (id, aggregate_id, type, payload jsonb, created_at, published_at) and the
      relay's SELECT ... FOR UPDATE SKIP LOCKED polling loop in pseudo-code, and state the maximum
      staleness the site gate can tolerate.
    presentation: standard
    sources:
      - title: What do you mean by "Event-Driven"? (Martin Fowler, 2017)
        url: https://martinfowler.com/articles/201701-event-driven.html
        locator: the four patterns — Event Notification, Event-Carried State Transfer, Event-Sourcing, CQRS
        kind: blog
        verified: false
      - title: CQRS (Martin Fowler, bliki)
        url: https://martinfowler.com/bliki/CQRS.html
        locator: whole entry, especially "When to use it"
        kind: blog
        verified: false
      - title: Pattern — Transactional outbox (microservices.io)
        url: https://microservices.io/patterns/data/transactional-outbox.html
        locator: sections Problem, Solution, Resulting context
        kind: docs
        verified: false

  - id: architecture-14
    title: Resilience I — timeouts, retries with backoff, idempotency keys
    level: I
    est_min: 25
    prereqs: [architecture-11]
    summary: >-
      The first line of defence for anything called over a network: every call has a timeout derived
      from latency percentiles, retries are capped and use exponential backoff with jitter and a retry
      budget, and only idempotent operations (natively or through an idempotency key) are retried.
      Links 15-system-design/third-party-failure-modes.md (timeouts and retries) and
      15-system-design/idempotency-and-deduplication.md.
    key_points:
      - Timeouts — connect vs request timeouts, set from the dependency's high percentiles plus margin, deadlines propagated across hops
      - Retries amplify load — retry at one layer only, cap attempts, use a retry budget or token bucket
      - Exponential backoff with full jitter avoids synchronised retry storms
      - Retry only transient failures and idempotent operations; idempotency keys make POSTs safe to retry
    diagram: >-
      Timeline of 100 clients retrying after a short outage — without jitter (synchronised spikes at
      each backoff step) and with full jitter (load spread out) — with a retry-budget ceiling drawn.
    example: >-
      In 15 lines of Scala or Python implement retry(f, maxAttempts = 4, base = 100 ms, cap = 2 s)
      with full jitter (sleep a random time between 0 and min(cap, base times 2^attempt)). Simulate 100
      clients against a server that recovers after one second and count requests per 100 ms bucket
      with and without jitter. Then decide which of three POS calls (authorise payment, fetch member,
      open the tunnel gate) may be retried, and with which key.
    presentation: standard
    sources:
      - title: Timeouts, retries, and backoff with jitter (Amazon Builders' Library)
        url: https://aws.amazon.com/builders-library/timeouts-retries-and-backoff-with-jitter/
        locator: sections on timeouts, retries and backoff, and jitter
        kind: blog
        verified: false
      - title: Exponential Backoff And Jitter (AWS Architecture Blog)
        url: https://aws.amazon.com/blogs/architecture/exponential-backoff-and-jitter/
        locator: the comparison of no jitter, full jitter, equal jitter and decorrelated jitter
        kind: blog
        verified: false
      - title: Retry pattern (Azure Architecture Center)
        url: https://learn.microsoft.com/en-us/azure/architecture/patterns/retry
        locator: sections "Solution" and "Issues and considerations"
        kind: docs
        verified: false

  - id: architecture-15
    title: Resilience II — circuit breakers, bulkheads and graceful degradation
    level: I
    est_min: 25
    prereqs: [architecture-14]
    summary: >-
      When a dependency is down, stop calling it (a circuit breaker moves between closed, open and
      half-open), and make sure one slow dependency cannot exhaust shared resources (bulkheads:
      separate pools, queues and limits per dependency). With fallbacks and load shedding they turn a
      cascading failure into a degraded mode. Builds on the circuit-breaker pattern already traced
      through 15-system-design (see the pattern table in its README) and on
      third-party-failure-modes.md.
    key_points:
      - Circuit-breaker states and parameters — failure threshold, open duration, half-open probe; one breaker per dependency or host
      - Bulkhead — isolate thread pools, connection pools and queues per dependency or tenant so a failure stays local
      - Fallbacks — cached value, default, queue for later, feature switched off; chosen per use case together with the product owner
      - Load shedding and backpressure as the server-side counterpart; Akka ships a CircuitBreaker and backpressured streams
      - Test it with fault injection and watch breaker state in metrics
    diagram: >-
      A circuit-breaker state machine (closed to open on threshold, open to half-open after a timeout,
      half-open back to closed on success or open on failure) next to a bulkhead picture with separate
      pools for payments and reporting.
    example: >-
      For the car-wash site controller list three external dependencies (payment processor, cloud
      membership API, licence-plate recognition). For each choose breaker thresholds, a bulkhead (pool
      size or queue) and the degraded behaviour while open (for example offline authorisation up to a
      limit, a cached member list, manual plate entry), as a small table. Optionally wrap a fake call
      that fails 60% of the time in akka.pattern.CircuitBreaker and log the state transitions.
    presentation: standard
    sources:
      - title: CircuitBreaker (Martin Fowler, bliki)
        url: https://martinfowler.com/bliki/CircuitBreaker.html
        locator: whole entry, including the half-open state
        kind: blog
        verified: false
      - title: Circuit Breaker pattern (Azure Architecture Center)
        url: https://learn.microsoft.com/en-us/azure/architecture/patterns/circuit-breaker
        locator: sections "Solution" and "Issues and considerations"
        kind: docs
        verified: false
      - title: Bulkhead pattern (Azure Architecture Center)
        url: https://learn.microsoft.com/en-us/azure/architecture/patterns/bulkhead
        locator: sections "Solution" and "Issues and considerations"
        kind: docs
        verified: false

  # ---------------------------------------------------------------- Advanced — trade-offs, evolution, case studies, capstone
  - id: architecture-16
    title: Quality attributes and trade-off analysis (ATAM-lite)
    level: A
    est_min: 30
    prereqs: [architecture-10]
    summary: >-
      Architecture is mostly choosing which quality attributes to favour — availability, latency,
      modifiability, security, cost, operability — when they conflict. The rung teaches
      quality-attribute scenarios, a lightweight version of SEI's ATAM (utility tree, sensitivity
      points, trade-off points, risks) and fitness functions as the automated, continuous check that a
      chosen attribute stays true.
    key_points:
      - A quality attribute only means something as a measurable scenario — source, stimulus, environment, artefact, response, response measure
      - The utility tree prioritises scenarios by business value and technical difficulty (H/M/L)
      - ATAM outputs — sensitivity points, trade-off points, risks and non-risks
      - Fitness functions — automated tests or metrics that guard an attribute (latency check, dependency-rule test, cost alarm)
      - Well-Architected pillars as a checklist of attribute families and their known trade-offs
    diagram: >-
      A utility tree — the root "Utility" branching into Availability, Performance, Modifiability,
      Security and Cost, each with one or two concrete car-wash scenarios rated (value, difficulty).
    example: >-
      Write five quality-attribute scenarios for the car-wash POS in six-part form, arrange them in a
      utility tree, and run ATAM-lite on one decision (for example "the site controller authorises
      members offline when the cloud is unreachable"): name one sensitivity point, one trade-off point
      (availability vs revenue or fraud risk) and one risk. Turn one scenario into a fitness function
      you could automate — metric, threshold, where it runs.
    presentation: deep
    sources:
      - title: ATAM — Method for Architecture Evaluation (Kazman, Klein, Clements; SEI technical report, 2000)
        url: https://insights.sei.cmu.edu/library/atam-method-for-architecture-evaluation/
        locator: the steps of the ATAM, quality-attribute utility trees, sensitivity and trade-off points
        kind: paper
        verified: false
      - title: Azure Well-Architected Framework
        url: https://learn.microsoft.com/en-us/azure/well-architected/
        locator: the five pillars and the tradeoffs page of each pillar
        kind: docs
        verified: false
      - title: Architectural fitness function (Thoughtworks Technology Radar)
        url: https://www.thoughtworks.com/radar/techniques/architectural-fitness-function
        locator: whole blip
        kind: docs
        verified: false

  - id: architecture-17
    title: Evolutionary architecture
    level: A
    est_min: 25
    prereqs: [architecture-16]
    summary: >-
      An evolutionary architecture supports guided, incremental change: fitness functions protect what
      matters, small reversible steps reduce risk, and patterns such as the strangler fig and
      sacrificial architecture make large migrations safe. Architecture rules encoded as automated
      checks are also what let many contributors, coding agents included, change a codebase without
      eroding its structure.
    key_points:
      - Incremental change guided by fitness functions (atomic vs holistic, triggered vs continual)
      - Architecture rules as tests — ArchUnit-style checks for layering, cycles and naming on the JVM
      - Strangler fig — route traffic gradually from legacy to new code behind a facade; sacrificial architecture
      - The last responsible moment and reversibility; design for replaceability rather than reuse
      - Team structure (Conway's law) as an architectural dimension
    diagram: >-
      A strangler-fig migration in three stages — a facade in front of the legacy system; the new
      component serving one route; the legacy system shrunk to the remaining routes and finally
      removed.
    example: >-
      Write two fitness functions for a JVM codebase you know: (1) an ArchUnit rule (runnable from
      Scala through JUnit) that fails if any class in a ..domain.. package depends on ..infra.. or on
      akka.http; (2) a CI check that fails when p95 latency in the latest load-test report exceeds a
      threshold. Then sketch a three-step strangler-fig plan for moving one legacy POS feature behind a
      facade.
    presentation: deep
    sources:
      - title: Architectural fitness function (Thoughtworks Technology Radar)
        url: https://www.thoughtworks.com/radar/techniques/architectural-fitness-function
        locator: whole blip
        kind: docs
        verified: false
      - title: ArchUnit
        url: https://www.archunit.org/
        locator: User Guide → layer checks, cycle checks and the ArchUnit JUnit support
        kind: docs
        verified: false
      - title: StranglerFigApplication (Martin Fowler, bliki)
        url: https://martinfowler.com/bliki/StranglerFigApplication.html
        locator: whole entry
        kind: blog
        verified: false

  - id: architecture-18
    title: Case study — Spotify's developer platform and Backstage
    level: A
    est_min: 25
    prereqs: [architecture-12, architecture-17]
    summary: >-
      How a large engineering organisation keeps hundreds of autonomous teams productive: Spotify's
      developer platform, golden paths, the Backstage software catalogue (ownership, templates,
      TechDocs) and fleet-wide change management. The lesson writer picks two or three Spotify
      Engineering posts and reads them through the lens of earlier rungs — coupling, bounded
      contexts, recorded decisions and evolutionary change.
    key_points:
      - The problem — fragmentation and cognitive load as the number of teams grows
      - Golden paths — an opinionated, supported way to build a service, offered rather than mandated
      - Software catalogue with ownership metadata; templates as a consistency mechanism
      - Fleet management — automated fleet-wide changes (such as dependency upgrades) instead of asking every team
      - The trade-offs Spotify names — autonomy vs alignment, platform cost, adoption
    diagram: >-
      Backstage at the centre — software catalogue, software templates, TechDocs and plugins — with
      service teams consuming golden paths on one side and the platform team producing them on the
      other.
    example: >-
      After reading the chosen posts, write a half-page "what would transfer" note for your own
      organisation: the first golden path you would define (for example a new Scala service with
      logging, metrics and CI), the metadata every service must declare (owner, on-call, dependencies),
      and one fleet-wide change you would automate. Name the earlier rung each idea connects to.
    presentation: deep
    sources:
      - title: Spotify Engineering blog
        url: https://engineering.atspotify.com/
        locator: posts on golden paths, Backstage (open-sourced in 2020), developer experience and fleet management / the fleet-first mindset — the writer picks 2-3
        kind: blog
        verified: false
      - title: Backstage
        url: https://backstage.io/
        locator: Docs → Overview ("What is Backstage?"), Software Catalog, Software Templates
