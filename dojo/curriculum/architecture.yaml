description: >-
  From code-level design principles (coupling and cohesion, dependency direction, SOLID, information
  hiding) through architectural styles, DDD, documentation (C4, ADRs), API and integration design and
  resilience, up to quality-attribute trade-offs, evolutionary architecture, Spotify case studies and a
  capstone ADR for a real car-wash POS decision. Each level reuses the previous level's vocabulary, and
  rungs link the existing notes in 15-system-design and 06-databases-and-distributed-data instead of
  repeating them.
