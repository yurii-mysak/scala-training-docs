  - id: architecture-20
    title: Capstone — the architect as decision-maker (an ADR for the car-wash POS)
    level: A
    est_min: 30
    prereqs: [architecture-10, architecture-16]
    summary: >-
      The ladder ends where architecture work actually happens: making a significant decision under
      uncertainty and recording it so others can review, challenge and later revisit it. Yuriy picks a
      real, open decision on the car-wash POS platform, frames it with quality-attribute scenarios,
      compares two or three options with explicit trade-offs and a fitness function, and writes an ADR
      ready for team review.
    key_points:
      - Choosing an architecturally significant decision — irreversible, cross-cutting or costly
      - Decision drivers written as quality-attribute scenarios; options include doing nothing
      - A trade-off table and the decisive argument; risks and how they will be detected (fitness functions)
      - Consequences, good and bad; status, review path and when to revisit
      - The architect's role — facilitate the decision, make it explicit, own the follow-through
    diagram: >-
      A C4 container or component diagram of the part of the POS the decision touches, with the
      differences between the options highlighted.
    example: >-
      Write the ADR in MADR format for one real open decision — candidates include how site
      transactions are journaled and reconciled with the cloud, where per-vehicle tier pricing is
      computed, or how a payment-terminal vendor is abstracted. Include context, at least three
      decision drivers as scenarios, two or three options with pros and cons, the decision,
      consequences, one fitness function and a C4 diagram. Time-box it to 30 minutes; it is filed as
      the capstone and is ready to open as a pull request for team review.
    presentation: deep
    sources:
      - title: MADR — Markdown Any Decision Records
        url: https://adr.github.io/madr/
        locator: the full template and the filled-in examples
        kind: docs
        verified: false
