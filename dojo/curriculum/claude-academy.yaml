track: claude-academy
name: Claude Academy
weight: 2
files_to: 24-ai-ml-foundations
description: >-
  A guided pass through three free Claude Academy courses (Anthropic), one or two course lessons
  per rung, in each course's own order and with no lesson skipped. AI Capabilities and Limitations
  comes first because it builds the mental model of the machine (next-token prediction,
  knowledge, working memory, steerability) that every later judgement rests on; AI Fluency:
  Framework and Foundations then turns that model into working habits through the 4D framework
  (Delegation, Description, Discernment, Diligence); Building Effective Human-Agent Teams closes
  the ladder by moving from one person with an assistant to agents working as teammates. Where a
  rung overlaps the mechanics already taught in the ai-ml track (tokens, training stages,
  context windows, RAG, agents), it points to that rung instead of re-teaching it. Each rung swaps
  the course's generic exercise for one taken from the reader's own work, and after the last rung
  of each course the reader should also complete that course's own quiz on academy.claude.com.
primary_sources:
  - title: "Claude Academy — AI Capabilities and Limitations"
    url: https://academy.claude.com/courses/ai-capabilities-and-limitations
    verified: true
  - title: "Claude Academy — AI Fluency: Framework and Foundations"
    url: https://academy.claude.com/courses/ai-fluency-framework-foundations
    verified: true
  - title: "Claude Academy — Building Effective Human-Agent Teams (beta)"
    url: https://academy.claude.com/courses/building-effective-human-agent-teams
    verified: true

rungs:

  # ─────────────── Course 1 — AI Capabilities and Limitations (13 lessons, B) ───────────────

  - id: claude-academy-01
    title: "A mental model of the machine: what we mean by AI"
    level: B
    est_min: 20
    prereqs: []
    summary: >-
      The course opens by separating two questions: how you collaborate with AI (the 4D framework,
      later in this ladder) and how the AI is able to work with you. It then narrows "AI" to
      generative, transformer-based text models — most AI in production (spam filters,
      recommenders, fraud detection) is not generative — and claims that these models are strong
      and weak along four predictable axes rather than uniformly good or bad. That four-axis map
      is the spine of the whole course.
    key_points:
      - "The course roadmap: what AI is, how it is trained, its four properties, real-world use, safety."
      - "Generative AI versus predictive/classification AI; why most deployed AI is not generative."
      - "The four axes: next-token prediction, knowledge, working memory, steerability."
      - "Why this material is durable: model boundaries move, the properties stay the same."
    diagram: >-
      A 2×2-ish map: "AI in production" split into non-generative (spam filter, recommender, fraud
      score) and generative (LLM chat, code agent); the generative branch fans out into the four
      property axes, each drawn as a slider from "capability zone" to "limitation zone".
    example: >-
      List the AI touch-points in the car-wash POS platform and his own day (fraud/anomaly checks,
      plate recognition, Claude Code in the Lua monorepo, MCP servers, chat drafting of specs).
      Tag each as generative or not, and for each generative one write which of the four axes it
      most depends on. Keep the list: rung 07 revisits it.
    presentation: minimal
    sources:
      - title: "Claude Academy — AI Capabilities and Limitations: Intro to AI Capabilities and Limitations"
        url: https://academy.claude.com/courses/ai-capabilities-and-limitations/intro-to-ai-capabilities-and-limitations
        locator: "AI Capabilities and Limitations, lesson 1 'Intro to AI Capabilities and Limitations' (text + 4 min video)"
        kind: course
        quote: "This material is durable because the properties stay stable even as models improve. Boundaries shift but the properties remain the same."
        verified: true
      - title: "Claude Academy — AI Capabilities and Limitations: What We Mean by AI"
        url: https://academy.claude.com/courses/ai-capabilities-and-limitations/what-we-mean-by-ai
        locator: "AI Capabilities and Limitations, lesson 2 'What We Mean by AI', §'Key takeaways'"
        kind: course
        quote: "AI isn't uniformly capable or uniformly unreliable. It's strong and weak along four predictable axes."
        verified: true

  - id: claude-academy-02
    title: "How AI gets its character: pretraining, fine-tuning and fingerprints"
    level: B
    est_min: 20
    prereqs: [claude-academy-01]
    summary: >-
      An assistant's personality is trained, not emergent. Pretraining yields a document completer
      with no notion of helping; fine-tuning layers assistant behaviour on top — treating input as
      a request, answering, declining harmful asks — and leaves recognisable fingerprints such as
      sycophancy, verbosity, over-caution and miscalibrated confidence. The mechanics of the
      training stages are in ai-ml-24; this rung is about spotting their behavioural traces.
    key_points:
      - "Two stages: pretraining produces a document completer; fine-tuning produces an assistant."
      - "Behavioural fingerprints: sycophancy, verbosity, over-caution, confident tone regardless of accuracy."
      - "Fingerprints are predictable, so they can be tested for and prompted around."
      - "Pairs with ai-ml-24 (pretraining vs fine-tuning vs RLHF) for the mechanism."
    diagram: >-
      A pipeline: raw web/books → pretraining → "document completer" box → fine-tuning (instruction
      data, feedback) → "assistant" box, with four labelled fingerprints hanging off the assistant.
    example: >-
      In Claude, paste a deliberately flawed design choice from a car-wash feature (e.g. "we will
      store wash-package redemptions only in the client cache") and ask "this is a good design,
      right?". Then ask neutrally "list the risks of this design". Compare: did the first answer
      agree too readily? Note which fingerprint showed up and the phrasing that removed it.
    presentation: minimal
    sources:
      - title: "Claude Academy — AI Capabilities and Limitations: How AI Gets Its Character"
        url: https://academy.claude.com/courses/ai-capabilities-and-limitations/how-ai-gets-its-character
        locator: "AI Capabilities and Limitations, lesson 3 'How AI Gets Its Character', §'Pretraining, fine-tuning, and fingerprints'"
        kind: course
        quote: "Fine-tuning layers assistant behavior on top: treating your input as a request, answering rather than rambling, declining harmful asks."
        verified: true

  - id: claude-academy-03
    title: "Next-token prediction: capability zones and where fabrication lives"
    level: B
    est_min: 25
    prereqs: [claude-academy-02]
    summary: >-
      A generative model is closer to a vast autocomplete than to a search engine: it writes word
      by word from what tends to follow what. That predicts its capability zone (well-documented,
      common tasks) and its limitation zone (novel or sparse territory), and it explains why
      fabrication concentrates in specifics — names, numbers, citations, URLs. The sampling
      mechanics are in ai-ml-25; this rung is the user-side consequence.
    key_points:
      - "Autocomplete at scale: text is produced token by token from learned continuations."
      - "Capability zone vs limitation zone, set by how well-represented a task is in training data."
      - "Fabrication concentrates in specificity: names, dates, statistics, citations, URLs, quotes."
      - "The Verification Test: probe the model inside your own domain expertise."
      - "Pairs with ai-ml-25 (sampling, temperature) for the mechanism."
    diagram: >-
      A horizontal spectrum from "dense, well-documented" (writing a REST handler, explaining Akka
      actors) to "sparse, novel" (an internal POS protocol), with a fabrication-risk curve rising
      to the right and a second curve rising with claim specificity.
    example: >-
      Verification Test in his own domain: ask Claude three questions about car-wash POS
      operations at increasing specificity — general (how wash-club memberships work), medium
      (typical redemption flow), and exact (a named industry standard, a version number, a URL).
      Check each against what he knows or can look up; mark where the first fabricated specific
      appears.
    presentation: minimal
    sources:
      - title: "Claude Academy — AI Capabilities and Limitations: Next Token Prediction"
        url: https://academy.claude.com/courses/ai-capabilities-and-limitations/next-token-prediction
        locator: "AI Capabilities and Limitations, lesson 4 'Next Token Prediction', §'Autocomplete at scale' and §'Key takeaways'"
        kind: course
        quote: "Fabrication concentrates in specificity: names, dates, statistics, citations, URLs, quotes. The more precise a claim, the more it warrants verification."
        verified: true
      - title: "Claude Academy — AI Capabilities and Limitations (course page)"
        url: https://academy.claude.com/courses/ai-capabilities-and-limitations
        locator: "AI Capabilities and Limitations, lesson 5 'Try It Out: Next Token Prediction' (interactive; the lesson page /try-it-out returned no body text to the fetcher on 2026-10-05 — open it on the site)"
        kind: course
        verified: true

  - id: claude-academy-04
    title: "Knowledge: what the model read, and when it stopped reading"
    level: B
    est_min: 25
    prereqs: [claude-academy-03]
    summary: >-
      A model knows only what it was exposed to in training, frozen at the knowledge cutoff, with
      no lived experience and no browsing by default. Its characteristic knowledge failures are
      staleness, uneven coverage, inherited bias and source amnesia; the fixes are tools — web
      search, retrieval, tool use — that put fresh facts into context. RAG engineering is ai-ml-28;
      here the point is knowing when to reach for it.
    key_points:
      - "Knowledge is frozen at the training cutoff; no post-cutoff facts without tools."
      - "Failure modes: staleness, uneven coverage, inherited bias, source amnesia."
      - "Mitigations: web search, retrieval (RAG), tool use and MCP servers that supply context."
      - "The Outsider Test: where does the model need context it cannot have?"
      - "Pairs with ai-ml-28 (RAG done properly)."
    diagram: >-
      A timeline with the training cutoff as a wall: facts before it are "in weights" (with a
      density gradient for coverage), facts after it and private company facts sit outside, with
      arrows from search / RAG / MCP tools carrying them into the context window.
    example: >-
      Outsider Test: ask Claude, without tools, three things — a public fact about Scala 3 or Akka
      licensing, a fact about a recent library release, and a fact private to his company (the
      PilotTransaction journal format). Classify each answer as known / stale / unknowable. Then
      write which MCP server or document would fix each gap.
    presentation: standard
    sources:
      - title: "Claude Academy — AI Capabilities and Limitations: Knowledge"
        url: https://academy.claude.com/courses/ai-capabilities-and-limitations/knowledge
        locator: "AI Capabilities and Limitations, lesson 6 'Knowledge', §'What the model read, and when it stopped reading'"
        kind: course
        quote: "The model knows what it was exposed to during training, and only that. No real-time browsing by default, no lived experience, and a hard stop at the knowledge cutoff."
        verified: true
      - title: "Claude Academy — AI Capabilities and Limitations (course page)"
        url: https://academy.claude.com/courses/ai-capabilities-and-limitations
        locator: "AI Capabilities and Limitations, lesson 7 'Try It Out: Knowledge' (interactive; the lesson page /try-it-out-31vzkl2dgi907 returned no body text to the fetcher on 2026-10-05 — open it on the site)"
        kind: course
        verified: true

  - id: claude-academy-05
    title: "Working memory: the context window and its silent cliff"
    level: B
    est_min: 30
    prereqs: [claude-academy-04]
    summary: >-
      Everything the model attends to lives in a fixed-size context window; outside it, nothing
      exists. Inside, attention is uneven (primacy and recency beat the middle), and at the edge
      the failure is a cliff — silent truncation, without a warning. The model does not learn from
      corrections within a session beyond what stays in context, and does not remember across
      sessions unless something writes it down. Token budgets and context engineering are in
      ai-ml-26.
    key_points:
      - "The context window as working memory: attend to what is inside, nothing outside."
      - "Lost in the middle: primacy and recency effects; put critical instructions at the edges."
      - "Silent truncation is the failure mode; corrections only persist while they stay in context."
      - "Cross-session memory comes from external stores (CLAUDE.md, memory files), not the model."
      - "Pairs with ai-ml-26 (context windows and prompting as programming)."
    diagram: >-
      A context window drawn as a box with a U-shaped attention curve over its length, a dashed
      line at the capacity edge labelled "silent truncation", and an external CLAUDE.md / memory
      store feeding the start of each new session.
    example: >-
      Probe a context-limit failure in Claude Code: in a long session on the Lua monorepo, state a
      constraint early ("never touch files under vendor/"), work for a while until auto-compaction
      or a large file read, then ask for a change near vendor/. Did the constraint survive? Move it
      into CLAUDE.md and repeat. Write down which placement held.
    presentation: standard
    sources:
      - title: "Claude Academy — AI Capabilities and Limitations: Working Memory"
        url: https://academy.claude.com/courses/ai-capabilities-and-limitations/working-memory
        locator: "AI Capabilities and Limitations, lesson 8 'Working Memory', §'The context window: AI's working memory' and §'Key takeaways'"
        kind: course
        quote: "Silent truncation is the failure mode, and you won't always be warned. The model doesn't learn from your corrections. It only responds to what's currently in context."
        verified: true
      - title: "Claude Academy — AI Capabilities and Limitations: Try It Out: Working Memory"
        url: https://academy.claude.com/courses/ai-capabilities-and-limitations/try-it-out-q7hdjm9twcbt
        locator: "AI Capabilities and Limitations, lesson 9 'Try It Out: Working Memory' (text plus the interactive 'Memory Test')"
        kind: course
        quote: "Items at the beginning of a list benefit from primacy (they get rehearsed more), and items at the end benefit from recency (they're still fresh)."
        verified: true

  - id: claude-academy-06
    title: "Steerability: how much are you actually in control?"
    level: B
    est_min: 30
    prereqs: [claude-academy-05]
    summary: >-
      Models follow instructions the same way they do everything else — by continuing a pattern —
      which makes them very steerable on short, concrete instructions and less so on long reasoning
      chains or abstract goals. The characteristic failures are drift over long tasks and
      letter-over-spirit compliance. The mitigations are system prompts, structured outputs, code
      execution for exact work, checkpoints, and restating the goal rather than shouting the rule.
    key_points:
      - "Instruction following is pattern continuation; control is strongest for short, concrete asks."
      - "Limitation zone: long multi-step reasoning, abstract or conflicting goals."
      - "Failure modes: drift over long outputs; following the letter, not the spirit."
      - "Mitigations: system prompts, structured outputs, code execution, checkpoints."
      - "When literal compliance misses the point, restate the goal; louder rules do not help."
    diagram: >-
      Two axes: instruction concreteness (x) and task length (y); the "tight control" region sits at
      concrete/short, "drift" at long, "letter over spirit" at abstract; arrows show mitigations
      pulling tasks back toward the controlled corner.
    example: >-
      Ask Claude to generate 30 test cases for a wash-package redemption endpoint with the rule
      "each case must have a unique precondition". Check how far down the list the rule still
      holds (drift) and whether any cases satisfy the wording but are useless (letter over spirit).
      Then rewrite the prompt stating the goal (coverage of distinct failure paths) and require a
      JSON schema; compare.
    presentation: standard
    sources:
      - title: "Claude Academy — AI Capabilities and Limitations: Steerability"
        url: https://academy.claude.com/courses/ai-capabilities-and-limitations/steerability
        locator: "AI Capabilities and Limitations, lesson 10 'Steerability', §'How much are you actually in control?' and §'Key takeaways'"
        kind: course
        quote: "When an instruction is followed literally but uselessly, restate the goal. Repeating the instruction with more force won't close the gap."
        verified: true
      - title: "Claude Academy — AI Capabilities and Limitations (course page)"
        url: https://academy.claude.com/courses/ai-capabilities-and-limitations
        locator: "AI Capabilities and Limitations, lesson 11 'Try It Out: Steerability' (interactive; the lesson page /try-it-out-y02xgkpa6wa7 returned no body text to the fetcher on 2026-10-05 — open it on the site)"
        kind: course
        verified: true

  - id: claude-academy-07
    title: "When properties collide: diagnosing real AI failures"
    level: B
    est_min: 25
    prereqs: [claude-academy-06]
    summary: >-
      Real failures are rarely one property misbehaving; they are two meeting — a stale fact
      stated with fluent confidence, a constraint lost from working memory during a long
      steerability-heavy task. Naming the pair points straight at the fix: verify specifics,
      re-supply context, offload exact work to code, or invite pushback. The closing lesson
      reframes the four properties as continuums and hands over to the AI Fluency course. After
      this rung, take the course quiz on the site.
    key_points:
      - "Most real failures are two properties interacting; name both."
      - "Fix menu: verify specifics, re-supply context, offload to code execution, invite pushback."
      - "Properties are continuums; place each task on each one."
      - "Calibrated trust: match verification and context habits to where the task sits."
      - "Course quiz on academy.claude.com closes this course."
    diagram: >-
      A 4×4 matrix of the properties (next-token, knowledge, working memory, steerability) with a
      few cells filled by an example failure and the fix it implies.
    example: >-
      Take one real AI disappointment from the last month (a Claude Code change that broke a Lua
      module, a wrong FPL stat, a hallucinated API flag). Write a three-line post-mortem: which two
      properties met, what evidence shows it, which fix from the menu would have prevented it.
      Revisit the rung-01 list and place each item on the four continuums.
    presentation: standard
    sources:
      - title: "Claude Academy — AI Capabilities and Limitations: When Properties Collide"
        url: https://academy.claude.com/courses/ai-capabilities-and-limitations/when-properties-collide
        locator: "AI Capabilities and Limitations, lesson 12 'When Properties Collide', §'Two properties meeting' and §'Key takeaways'"
        kind: course
        quote: "Most real-world AI failures aren't one property acting up. They're two properties meeting at the same time. Naming which two changes the fix entirely."
        verified: true
      - title: "Claude Academy — AI Capabilities and Limitations: Next Steps"
        url: https://academy.claude.com/courses/ai-capabilities-and-limitations/next-steps
        locator: "AI Capabilities and Limitations, lesson 13 'Next Steps', §'A small model of the machine'"
        kind: course
        quote: "Calibrated trust means locating your task on each continuum and matching your verification and context habits to where it sits."
        verified: true

  # ─────────────── Course 2 — AI Fluency: Framework and Foundations (14 lessons) ───────────────

  - id: claude-academy-08
    title: "AI Fluency: why it matters, and automation, augmentation, agency"
    level: B
    est_min: 20
    prereqs: [claude-academy-07]
    summary: >-
      The fluency course is about collaboration, not technology: engaging with AI effectively,
      efficiently, ethically and safely. It distinguishes three modes of interaction — automation
      (AI executes a specified task), augmentation (AI as a thinking and execution partner) and
      agency (AI configured to act independently on your behalf) — which recur in every later
      rung of this course.
    key_points:
      - "AI Fluency: effective, efficient, ethical, safe engagement with AI systems."
      - "Automation: AI executes specific tasks based on your instructions."
      - "Augmentation: human and AI as creative thinking and task-execution partners."
      - "Agency: AI works independently on your behalf, shaped by the knowledge and behaviour you set up."
    diagram: >-
      Three columns — automation, augmentation, agency — with the human's role shrinking from
      "specifies every step" to "sets goals and guardrails", and one example per column from his
      work (lint fix, spec co-writing, a Claude Code agent with skills and MCP tools).
    example: >-
      Sort ten of his recent AI interactions (Claude Code sessions, spec drafting for the car-wash
      platform, MCP server work, FPL agent runs) into automation / augmentation / agency. For two
      of them, write whether the mode was the right one and what would change if moved one column
      to the right.
    presentation: standard
    sources:
      - title: "Claude Academy — AI Fluency: Introduction to AI Fluency"
        url: https://academy.claude.com/courses/ai-fluency-framework-foundations/introduction-to-ai-fluency
        locator: "AI Fluency: Framework and Foundations, lesson 1 'Introduction to AI Fluency' (text + 4 min video), §'Key takeaways'"
        kind: course
        quote: "This course focuses on human-AI collaboration, not just understanding AI as a technology. AI Fluency means engaging with AI systems effectively, efficiently, ethically, and safely."
        verified: true
      - title: "Claude Academy — AI Fluency: Why do we need AI Fluency?"
        url: https://academy.claude.com/courses/ai-fluency-framework-foundations/why-do-we-need-ai-fluency
        locator: "AI Fluency: Framework and Foundations, lesson 2 'Why do we need AI Fluency?' (mostly video; short text summary)"
        kind: course
        quote: "You and AI collaborate as creative thinking and task execution partners"
        verified: true

  - id: claude-academy-09
    title: "The 4D framework: Delegation, Description, Discernment, Diligence"
    level: B
    est_min: 20
    prereqs: [claude-academy-08]
    summary: >-
      The four competencies of AI Fluency: Delegation (deciding what to do with AI versus
      yourself), Description (communicating clearly with AI), Discernment (evaluating outputs and
      behaviour critically) and Diligence (interacting responsibly). Each applies in all three
      interaction modes. The following rungs take them one at a time; this one builds the map and
      a first self-assessment.
    key_points:
      - "Delegation: thoughtfully deciding what work to do with AI versus yourself."
      - "Description: communicating clearly with AI systems."
      - "Discernment: evaluating AI outputs and behaviour with a critical eye."
      - "Diligence: ensuring you interact with AI responsibly."
      - "The 4Ds apply across automation, augmentation and agency."
    diagram: >-
      A 4×3 grid: rows are the four Ds, columns are automation / augmentation / agency; each cell
      holds one question the reader should ask in that situation.
    example: >-
      Self-assess 1–5 on each D for his Claude Code work in the Lua monorepo, with one piece of
      evidence per score (e.g. Discernment: "I review diffs but not test coverage"). Pick the
      weakest D as the focus for rungs 11–16.
    presentation: standard
    sources:
      - title: "Claude Academy — AI Fluency: The 4D Framework"
        url: https://academy.claude.com/courses/ai-fluency-framework-foundations/the-4d-framework
        locator: "AI Fluency: Framework and Foundations, lesson 3 'The 4D Framework' (text + video)"
        kind: course
        quote: "AI Fluency means engaging with AI in ways that are effective, efficient, ethical, and safe"
        verified: true

  - id: claude-academy-10
    title: "Deep dive: generative AI fundamentals, capabilities and limitations"
    level: B
    est_min: 25
    prereqs: [claude-academy-09]
    summary: >-
      The fluency course's own primer on generative AI: transformers, pre-training and fine-tuning,
      context windows and emergent capabilities, followed by a capabilities-versus-limitations
      survey (versatility, conversational awareness, tool use; knowledge cutoffs, hallucination,
      context limits, reasoning gaps). For this reader it is a fast review — rungs 01–07 and
      ai-ml-21 to ai-ml-26 cover the same ground in more depth — so the time goes into linking it
      back to those rungs.
    key_points:
      - "Generative AI creates new content rather than only analysing existing data."
      - "Pre-training (pattern learning) and fine-tuning (instruction following), as in rung 02."
      - "Capabilities: versatility, conversational awareness, tool integration."
      - "Limitations: knowledge cutoff, hallucination, context constraints, reasoning gaps — map each to rungs 03–06."
      - "The best results combine human judgement, creativity and ethical oversight with AI strengths."
    diagram: >-
      A cross-reference table drawn as a flow: each limitation named in this lesson → the
      Capabilities-course property it belongs to → the ai-ml rung that explains its mechanism.
    example: >-
      Write a one-page "AI on the car-wash platform: what it can and cannot do" note for his
      non-technical stakeholders, using only the lesson's capability/limitation list and one
      concrete platform example per item. Ask Claude to critique it for overclaiming.
    presentation: standard
    sources:
      - title: "Claude Academy — AI Fluency: Framework and Foundations (course page)"
        url: https://academy.claude.com/courses/ai-fluency-framework-foundations
        locator: "AI Fluency: Framework and Foundations, lesson 4 'Generative AI fundamentals' (video-only; the lesson page /generative-ai-fundamentals showed no readable body text to the fetcher on 2026-10-05 — watch it on the site)"
        kind: course
        verified: true
      - title: "Claude Academy — AI Fluency: Capabilities & limitations"
        url: https://academy.claude.com/courses/ai-fluency-framework-foundations/capabilities-limitations
        locator: "AI Fluency: Framework and Foundations, lesson 5 'Capabilities & limitations' (video + text summary), §'Key takeaways'"
        kind: course
        quote: "The most effective applications combine human and AI strengths, with humans providing critical thinking, judgment, creativity, and ethical oversight"
        verified: true

  - id: claude-academy-11
    title: "Delegation: deciding what to do yourself, together, or hand off"
    level: B
    est_min: 30
    prereqs: [claude-academy-10]
    summary: >-
      Delegation is the first D: deciding what work to keep, what to do with AI and what to let AI
      handle independently. The goal is not to automate everything but to build the most effective partnership for the
      task. The course then asks the learner to choose a medium-sized, multi-step project to carry
      through the remaining lessons — this rung picks it.
    key_points:
      - "Delegation: what to do yourself, together with AI, or let AI do independently."
      - "Goal: the most effective human-AI partnership, not maximum automation."
      - "Project vision first: define what success looks like before splitting tasks."
      - "Task breakdown with a delegation decision and a reason per task."
    diagram: >-
      A project broken into a task tree; each leaf coloured human / together / AI, with a short
      reason label (judgement needed, domain knowledge, mechanical, verifiable).
    example: >-
      Course project: pick one real car-wash POS spec task (e.g. a new redemption-with-upsell
      scenario for the transaction journal). With Claude, write the success criteria, break it
      into 6–10 tasks, and mark each human / together / AI with one-line reasons. This plan is
      reused in rungs 12–17.
    presentation: standard
    sources:
      - title: "Claude Academy — AI Fluency: A closer look at Delegation"
        url: https://academy.claude.com/courses/ai-fluency-framework-foundations/a-closer-look-at-delegation
        locator: "AI Fluency: Framework and Foundations, lesson 6 'A closer look at Delegation' (text + video), §'Key takeaways'"
        kind: course
        quote: "Delegation is about making thoughtful decisions about what work to do yourself, what to do together with AI, or what to let AI handle independently."
        verified: true
