        url: https://academy.claude.com/courses/ai-fluency-framework-foundations
        locator: "AI Fluency: Framework and Foundations, lesson 12 'A closer look at Diligence' (the lesson page /a-closer-look-at-diligence returned no body text to the fetcher on 2026-10-05, twice — read or watch it on the site)"
