  - id: claude-academy-12
    title: "Description: product, process and performance"
    level: B
    est_min: 20
    prereqs: [claude-academy-11]
    summary: >-
      Description is communicating with AI so that collaboration is productive: describing the
      product (what you want), the process (how to approach it) and the performance (how the AI
      should behave in the interaction). AI cannot infer unstated intent, and it is an
      interactive partner rather than a vending machine, so description is a conversation, not a
      single prompt.
    key_points:
      - "Product description: the output, its format, audience and quality bar."
      - "Process description: the approach, steps and reasoning the AI should use."
      - "Performance description: how the AI should behave — concise, critical, ask before assuming."
      - "AI cannot infer what you did not say; clarity of intent drives quality of result."
    diagram: >-
      One prompt split into three coloured blocks — product, process, performance — with arrows
      to the parts of the output each one shapes.
    example: >-
      Bad Prompt Makeover on his own work: take a real one-line prompt he gave Claude Code last
      week, rewrite it with explicit product, process and performance parts (for the rung-11
      project task), run both, and diff the outputs.
    presentation: standard
    sources:
      - title: "Claude Academy — AI Fluency: A closer look at Description"
        url: https://academy.claude.com/courses/ai-fluency-framework-foundations/a-closer-look-at-description
        locator: "AI Fluency: Framework and Foundations, lesson 8 'A closer look at Description' (text + video), §'Key takeaways'"
        kind: course
        quote: "AI systems are interactive partners, not databases or vending machines"
        verified: true

  - id: claude-academy-13
    title: "Deep dive: effective prompting techniques"
    level: B
    est_min: 25
    prereqs: [claude-academy-12]
    summary: >-
      Six concrete techniques make Description work: give context, show examples, specify
      constraints, break complex tasks into steps, ask the model to think first, and define its
      role or tone. Prompting is iterative — expect to refine based on results, and even to ask
      the AI to improve the prompt. API-level prompt structure (system prompts, XML tags, output
      contracts) is in ai-ml-26.
    key_points:
      - "Give context and show examples."
      - "Specify constraints and break complex tasks into steps."
      - "Ask the AI to think first; define its role or tone."
      - "Prompting is iterative and can be collaborative with the AI."
      - "Pairs with ai-ml-26 for API-level prompt structure."
    diagram: >-
      A prompt template skeleton with six labelled slots (context, examples, constraints, steps,
      think-first, role) and a loop arrow labelled "iterate on results".
    example: >-
      Build a reusable Claude Code prompt (or Skill draft) for "write acceptance criteria for a
      POS feature" that uses all six techniques, including one real example from an earlier
      car-wash spec. Run it on the rung-11 project task and note which technique changed the
      output most.
    presentation: standard
    sources:
      - title: "Claude Academy — AI Fluency: Effective prompting techniques"
        url: https://academy.claude.com/courses/ai-fluency-framework-foundations/effective-prompting-techniques
        locator: "AI Fluency: Framework and Foundations, lesson 9 'Effective prompting techniques' (text + video), §'Key takeaways'"
        kind: course
        quote: "Successful prompting is iterative (and perhaps also collaborative with the AI!). Expect to refine your approach based on results"
        verified: true

  - id: claude-academy-14
    title: "Discernment: judging the product, the process and the behaviour"
    level: I
    est_min: 20
    prereqs: [claude-academy-13]
    summary: >-
      Discernment mirrors Description: evaluate the product (is the output accurate and fit for
      purpose), the process (was the reasoning sound) and the performance (did the AI behave as
      asked). It depends on the evaluator's own domain expertise, which is exactly where his QA
      background is an asset. Systematic evaluation of LLM systems is ai-ml-27; this rung is the
      individual judgement it scales up.
    key_points:
      - "Product discernment: is the output itself correct and fit for purpose?"
      - "Process discernment: was the way the AI approached the task sound?"
      - "Performance discernment: did the AI behave in the interaction as asked?"
      - "Domain expertise is the lever; evaluate where you know the ground truth."
      - "Pairs with ai-ml-27 (evaluating LLM systems)."
    diagram: >-
      Description and Discernment as mirrored columns (product / process / performance), joined by
      arrows: each description element creates a check the evaluator applies.
    example: >-
      Take the acceptance criteria produced in rung 13 and review them as a QA lead would: write a
      product/process/performance checklist, score the output against it, and list three defects
      with the evidence for each.
    presentation: standard
    sources:
      - title: "Claude Academy — AI Fluency: A closer look at Discernment"
        url: https://academy.claude.com/courses/ai-fluency-framework-foundations/a-closer-look-at-discernment
        locator: "AI Fluency: Framework and Foundations, lesson 10 'A closer look at Discernment' (text + video), §'Key takeaways'"
        kind: course
        quote: "Discernment is your ability to thoughtfully evaluate what AI produces, how it produces it, and how it behaves"
        verified: true

  - id: claude-academy-15
    title: "The Description–Discernment loop on a real project"
    level: I
    est_min: 30
    prereqs: [claude-academy-14]
    summary: >-
      Description and Discernment form one feedback loop: describe, evaluate, refine the
      description, repeat, while the human adds the domain knowledge and makes the final keep,
      modify or discard decisions. This lesson is the course's main hands-on block: execute the
      project planned under Delegation through several turns of the loop and reflect on where the
      effort actually went.
    key_points:
      - "The loop: describe (product, process, performance) → evaluate → refine → repeat."
      - "Human contribution: perspective, domain knowledge, final decisions."
      - "Track where the effort went: describing, evaluating or fixing."
      - "Adjust the delegation plan when the loop shows a task was mis-assigned."
    diagram: >-
      A cycle: Description → AI output → Discernment → refined Description, with a side exit
      "keep / modify / discard" owned by the human and a feedback arrow to the rung-11 delegation
      plan.
    example: >-
      Run three loop iterations on one task from the rung-11 project (e.g. drafting the
      transaction-journal scenarios for a redemption with upsell). Log each iteration: what was
      changed in the description, what discernment caught, minutes spent. End by moving any task
      whose delegation label turned out wrong.
    presentation: standard
    sources:
      - title: "Claude Academy — AI Fluency: The Description-Discernment loop"
        url: https://academy.claude.com/courses/ai-fluency-framework-foundations/the-description-discernment-loop
        locator: "AI Fluency: Framework and Foundations, lesson 11 'The Description-Discernment loop', project execution steps"
        kind: course
        quote: "Add your unique perspective, creativity, or domain knowledge Make the final decisions about what to keep, modify, or discard"
        verified: true

  - id: claude-academy-16
    title: "Diligence: accountability, transparency, responsibility"
    level: I
    est_min: 20
    prereqs: [claude-academy-15]
    summary: >-
      Diligence is taking responsibility for AI-assisted work — the course defines it as ensuring
      you interact with AI responsibly, and its conclusion as accountability, transparency and
      responsibility. In practice that spans the choice of system and of the data that goes into
      it, openness about AI's role with the people who rely on the work, and verifying and owning
      what ships. For a PO shipping specs to developers and a lead rolling out Claude Code, it is
      the D with organisational consequences.
    key_points:
      - "Diligence ensures accountability, transparency and responsibility in AI work."
      - "Before: which system, which data may go into it (customer and payment data on a POS)."
      - "During: disclose AI's role to colleagues who rely on the output."
      - "After: verify and take ownership of what ships."
    diagram: >-
      A timeline of one AI-assisted deliverable — before (system and data choice), during
      (disclosure), after (verification and sign-off) — with the accountable human named at each
      stage.
    example: >-
      Write a five-line diligence policy for Claude Code use in the Lua monorepo team: what data may
      be pasted or exposed to tools (secrets, customer/payment data), how AI-authored commits are
      marked, who reviews before merge, and who owns a defect. Check it against the rung-11 project.
    presentation: standard
    sources:
