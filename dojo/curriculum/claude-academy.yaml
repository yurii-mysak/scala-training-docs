  # ─────────────── Course 3 — Building Effective Human-Agent Teams (5 lessons, I) ───────────────

  - id: claude-academy-18
    title: "From single-player to multiplayer AI: when an agent becomes a teammate"
    level: I
    est_min: 25
    prereqs: [claude-academy-17]
    summary: >-
      Single-player AI makes one person faster but silos information; multiplayer AI puts agents
      and people in a shared space where the agent can be proactive. A multiplayer agent operates
      as itself — its own identity, credentials and access controls decided by the team — with
      memory that grows from everyone who works with it and shared context that keeps it current.
      The architecture of such agents is ai-ml-29 and ai-ml-31.
    key_points:
      - "Single-player AI: a 'super suit' that speeds one person and siloes information."
      - "Multiplayer AI: shared visibility lets agents act proactively and personally."
      - "Three ingredients: independent identity, shared memory, shared context."
      - "The team decides the agent's access and tools, not the individual user."
      - "Pairs with ai-ml-29 (agents as distributed systems) and ai-ml-31 (Claude Code and Agent SDK patterns)."
    diagram: >-
      Left: three people each with a private assistant, information arrows trapped in each bubble.
      Right: the same people plus one agent with its own identity box, a shared memory store and
      shared channel, arrows flowing both ways.
    example: >-
      Tool or teammate? For his Claude Code setup in the Lua monorepo and one MCP server he built,
      score each on identity, shared memory and shared context (0–2 each). Name the questions his
      team keeps re-asking each other that a teammate agent could answer.
    presentation: standard
    sources:
      - title: "Claude Academy — Human-Agent Teams: Why multiplayer AI matters"
        url: https://academy.claude.com/courses/building-effective-human-agent-teams/why-multiplayer-ai-matters
        locator: "Building Effective Human-Agent Teams, lesson 1 'Why multiplayer AI matters', §'From super suit to shared room'"
        kind: course
        quote: "Single-player AI is like putting on a super suit at work: it makes you faster on your own tasks, but information can get siloed easily."
        verified: true
      - title: "Claude Academy — Human-Agent Teams: How is a multiplayer agent different from traditional AI tools?"
        url: https://academy.claude.com/courses/building-effective-human-agent-teams/how-multiplayer-agents-differ
        locator: "Building Effective Human-Agent Teams, lesson 2 'How is a multiplayer agent different from traditional AI tools?', §'What a multiplayer agent is made of'"
        kind: course
        quote: "A multiplayer agent, however, operates as itself. This means you can decide, as a team, what it has access to and what tools it can use."
        verified: true

  - id: claude-academy-19
    title: "What a strong human-agent team looks like"
    level: I
    est_min: 20
    prereqs: [claude-academy-18]
    summary: >-
      Strong human-agent teams work in public so agents have broad written context, give every
      member (agents included) a defined role and the tools for it, let humans set the north star
      the agents work toward, and build trust over time. For an agent, anything not written down
      and accessible does not exist.
    key_points:
      - "Work in public; if it isn't written and accessible, it doesn't exist for an agent."
      - "Defined roles with matching tools, for agents as for people."
      - "Humans set the north star; agents that know it can bring useful work toward it."
      - "Trust is built incrementally."
    diagram: >-
      A team roster table rendered as a graph: humans and agents as nodes, each with a role and tool
      list, all pointing to one north-star node and one shared written-context node.
    example: >-
      Draft a roster for one car-wash platform initiative (e.g. the pricing-model feature): humans,
      one or two agents (spec reviewer, test-case generator), each agent's role, tools and data
      access, and a measurable north star. Mark the ownership gaps.
    presentation: standard
    sources:
      - title: "Claude Academy — Human-Agent Teams: What a strong human-agent team looks like"
        url: https://academy.claude.com/courses/building-effective-human-agent-teams/what-a-strong-team-looks-like
        locator: "Building Effective Human-Agent Teams, lesson 3 'What a strong human-agent team looks like', §'Key takeaways'"
        kind: course
        quote: "Work in public and give agents broad context. For an agent, if it isn't written down and accessible, it doesn't exist."
        verified: true

  - id: claude-academy-20
    title: "Getting the organisation ready: checklist and first steps"
    level: I
    est_min: 25
    prereqs: [claude-academy-19]
    summary: >-
      Five readiness questions — is information open and searchable, is ownership written down
      (agents included), do teammates and agents have the right tools, are there quality checks,
      is there a shared north star — followed by a practical start: a small group, a measurable
      north star set by people, and agent responsibilities widened only after repeated success on
      a task, with regular retrospectives. Quality checks connect to ai-ml-36 (evals in CI). After
      this rung, take the course quiz on the site.
    key_points:
      - "Readiness: open, searchable information; written ownership; right tools; quality checks; north star."
      - "Quality checks — a rubric, a test, or a second agent — shorten the time to finalise agent work."
      - "Start small; people set an ambitious, measurable north star."
      - "Gradual release: widen an agent's remit only after repeated success on that task."
      - "Course quiz on academy.claude.com closes this course; pairs with ai-ml-36."
    diagram: >-
      A staircase of agent autonomy for one task type: suggest → draft with review → act with
      spot-check → act alone, with the "several successes in a row" gate and a weekly retro loop
      between steps.
    example: >-
      Design a review checkpoint for an agent in his Lua monorepo: pick one task type (e.g. adding
      unit tests to a module), define the quality check (rubric, test run, or a second reviewing
      agent), the success count that unlocks the next autonomy step, and who runs the weekly retro.
      Answer the five readiness questions for his team in one line each.
    presentation: standard
    sources:
