        locator: ch. 10, "The Output of Batch Workflows"; "Comparing Hadoop to Distributed Databases"; "Beyond MapReduce" → "Materialization of Intermediate State", "Graphs and Iterative Processing", "High-Level APIs and Languages"
        kind: book
        verified: false
      - title: Resilient Distributed Datasets (Zaharia et al., NSDI 2012)
        url: https://www.usenix.org/conference/nsdi12/technical-sessions/presentation/zaharia
        locator: sections on RDD lineage, narrow vs wide dependencies, and fault recovery
        kind: paper
