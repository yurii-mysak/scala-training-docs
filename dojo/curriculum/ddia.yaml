  - id: ddia-23
    title: Batch outputs and dataflow engines beyond MapReduce
    level: A
    est_min: 25
    prereqs: [ddia-22]
    files_to: 13-data-engineering
    summary: >-
      What batch jobs should produce (search indexes, key-value stores built offline, immutable
      outputs that make a bad deploy reversible), how Hadoop compares with MPP databases, and why
      dataflow engines (Spark, Flink, Tez) replaced materialised intermediate state with pipelined
      operators, plus graph processing in the Pregel model and the move to declarative high-level
      APIs. Links 13-data-engineering/lakehouse_unified_platform_and_migration.md.
    key_points:
      - Batch outputs — build a new immutable dataset and switch to it atomically; human fault tolerance and minimising irreversibility
      - Hadoop vs MPP databases — diversity of storage and processing models; designing for frequent faults (preemption)
      - Materialised intermediate state vs dataflow engines — fewer disk writes, pipelined operators, recomputation from lineage for fault tolerance
      - Graph processing with the Pregel (bulk synchronous parallel) model
      - Declarative high-level APIs let the engine choose join algorithms and optimise across operators
    diagram: >-
      A three-stage job drawn as chained MapReduce jobs with a distributed-filesystem write between
      every stage, next to the same job as a Spark-style DAG with a single shuffle boundary.
    example: >-
      Design a nightly car-wash revenue roll-up that writes to a new table revenue_v<date> and then
      switches a view atomically (CREATE OR REPLACE VIEW revenue AS SELECT * FROM revenue_v<date>), so
      a buggy run is undone by pointing the view back at yesterday's table. Then, in a four-operator
      Spark-style chain (filter, map, groupByKey, join), mark which operators are narrow and which
      force a shuffle.
    presentation: deep
    sources:
      - title: Designing Data-Intensive Applications (Kleppmann, 1st ed.)
