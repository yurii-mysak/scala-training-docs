  - id: ddia-24
    title: Event streams, change data capture and event sourcing
    level: A
    est_min: 30
    prereqs: [ddia-09, ddia-23]
    files_to: 07-messaging-and-streaming
    summary: >-
      The first half of ch. 11: message brokers versus partitioned logs, then the insight that a
      database's replication log is itself a stream — change data capture, log compaction and event
      sourcing — and why immutable events let many views be derived from one log. Yuriy knows Kafka
      well, so the rung concentrates on the database-stream duality; it deepens
      06-databases-and-distributed-data/Event-Sourcing-Guide.md and the outbox and CDC section of
      Distributed_Transactions.md (§4).
    key_points:
      - Traditional brokers (per-message acknowledgement, redelivery, load balancing that reorders) vs logs (offsets, order per partition, replay, a slow message blocks its partition)
      - Dual writes race and partially fail — keep one source of truth and derive the rest through CDC
      - Change data capture — an initial snapshot plus the log; log compaction keeps the latest value per key so a new consumer can rebuild state
      - Event sourcing — commands vs events; events are immutable facts; current state is a fold over the log
      - Immutability enables several read views from one log and easier recovery, but deletion (privacy requests) needs excision
    diagram: >-
      One Postgres table feeding its WAL into a CDC connector and a compacted Kafka topic, which fans
      out to a search index, a cache and an analytics store.
    example: >-
      Postgres CDC in eight minutes: docker run --rm -e POSTGRES_PASSWORD=pw -p 5432:5432 postgres:16
      -c wal_level=logical; SELECT pg_create_logical_replication_slot('s1', 'test_decoding'); insert,
      update and delete a few rows in a washes table; then SELECT * FROM
      pg_logical_slot_get_changes('s1', NULL, NULL) and read the change stream. Finally explain in
      three sentences how a CDC connector such as Debezium turns this into a Kafka topic, and why a
      compacted topic plus the initial snapshot is enough to rebuild a cache from scratch.
    presentation: deep
    sources:
      - title: Designing Data-Intensive Applications (Kleppmann, 1st ed.)
        url: https://dataintensive.net/
        locator: ch. 11, "Transmitting Event Streams" → "Messaging Systems", "Partitioned Logs"; "Databases and Streams" → "Keeping Systems in Sync", "Change Data Capture", "Event Sourcing", "State, Streams, and Immutability"
        kind: book
        verified: false
      - title: PostgreSQL documentation — Logical Decoding
        url: https://www.postgresql.org/docs/current/logicaldecoding.html
        locator: section "Logical Decoding Examples" (SQL interface with test_decoding)
        kind: docs
        verified: false
      - title: Using logs to build a solid data infrastructure, or why dual writes are a bad idea (Kleppmann, 2015)
        url: https://martin.kleppmann.com/2015/05/27/logs-for-data-infrastructure.html
        locator: the dual-writes race-condition example and the log-based alternative
        kind: blog
        verified: false

  - id: ddia-25
    title: Processing streams — time, windows, joins, fault tolerance
    level: A
    est_min: 30
    prereqs: [ddia-24]
    files_to: 07-messaging-and-streaming
    summary: >-
      What stream processors are used for (complex event processing, analytics, materialised views),
      why event time and processing time diverge and when a window is complete, the four window types,
      the three kinds of stream join and their time dependence, and achieving exactly-once effects via
      microbatching, checkpointing, atomic commit and idempotence. Links
      03-akka-ecosystem/Stream_Processing.md, 07-messaging-and-streaming/Messaging-kafka_advanced.md and
      15-system-design/idempotency-and-deduplication.md.
    key_points:
      - Event time vs processing time; stragglers and deciding when a window is done; whose clock to trust (device vs server timestamps)
      - Window types — tumbling, hopping, sliding, session
      - Stream-stream (window) join, stream-table join (enrichment), table-table join (materialised view maintenance); joins depend on time ordering
      - Fault tolerance — microbatching, checkpointing, atomic commit of output with offsets, idempotent writes, rebuilding state after failure
    diagram: >-
      An event-time axis against a processing-time axis with ten events plotted; one late event lands
      after its one-minute tumbling window has already been emitted.
    example: >-
      Take ten events as (event_time, arrival_time) pairs, two of them arriving 90 s late. Compute
      one-minute tumbling-window counts by processing time and by event time with 30 s of allowed
      lateness, and say what happens to each late event (dropped, emitted as a correction, sent to a
      side output). Then note that Akka Streams groupedWithin windows by processing time, and sketch
      how you would key windows by event time instead.
    presentation: deep
    sources:
      - title: Designing Data-Intensive Applications (Kleppmann, 1st ed.)
        url: https://dataintensive.net/
        locator: ch. 11, "Processing Streams" → "Uses of Stream Processing", "Reasoning About Time", "Stream Joins", "Fault Tolerance"
        kind: book
        verified: false
      - title: The world beyond batch — Streaming 101 (Tyler Akidau, O'Reilly Radar, 2015)
        url: https://www.oreilly.com/radar/the-world-beyond-batch-streaming-101/
        locator: sections on event time vs processing time and on windowing
        kind: blog
        verified: false

  - id: ddia-26
    title: The future of data systems — derived data, unbundling, correctness
    level: A
    est_min: 30
    prereqs: [ddia-21, ddia-25]
    summary: >-
      The book's closing argument: integrate specialised systems by deriving data through ordered logs
      instead of distributed transactions, see the dataflow as the database turned inside out, and get
      correctness end to end — operation identifiers for duplicate suppression, uniqueness through log
      partitions, timeliness versus integrity, auditing. It also asks the ethical questions about
      predictive analytics and privacy. Deepens 15-system-design/idempotency-and-deduplication.md §2.2
      (the end-to-end argument).
    key_points:
      - Derived data vs distributed transactions — logs give ordering and deterministic, idempotent derivation; total ordering has limits across partitions and datacentres
      - Unbundling databases — indexes, caches and materialised views as stream-maintained derived state; application code as a derivation function
      - The end-to-end argument — exactly-once needs an operation identifier carried from the client all the way to the database
      - Timeliness (up to date) vs integrity (no corruption or loss) — integrity is the one you cannot relax; coordination-avoiding systems
      - Doing the right thing — bias and feedback loops in predictive analytics, privacy, tracking and consent
    diagram: >-
      The car-wash POS as a dataflow — the transaction log in the centre, deriving loyalty balances,
      a search index, revenue analytics and customer notifications, each labelled with how stale it
      may be.
    example: >-
      Implement the book's request-ID pattern from "The End-to-End Argument for Databases" in
      Postgres: a requests table with a UNIQUE request_id; inside one transaction insert the request
      row and apply the balance updates. Run the same request twice and show the second insert fails
      and nothing is applied twice. Then draw the derived-data diagram for one real car-wash flow and
      mark which views may lag (timeliness) and which must never be wrong (integrity).
    presentation: deep
    sources:
      - title: Designing Data-Intensive Applications (Kleppmann, 1st ed.)
        url: https://dataintensive.net/
        locator: ch. 12, "Data Integration"; "Unbundling Databases"; "Aiming for Correctness" → "The End-to-End Argument for Databases", "Enforcing Constraints", "Timeliness and Integrity", "Trust, but Verify"; "Doing the Right Thing"
        kind: book
        verified: false
      - title: Turning the database inside-out with Apache Samza (Kleppmann, 2015)
        url: https://martin.kleppmann.com/2015/03/04/turning-the-database-inside-out.html
        locator: talk transcript sections on replication, secondary indexes, caching and materialised views
        kind: blog
        verified: false
