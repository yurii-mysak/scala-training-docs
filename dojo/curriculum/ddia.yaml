  # ---------------------------------------------------------------- Part III — Derived Data
  - id: ddia-22
    title: Batch processing — the Unix philosophy and MapReduce
    level: A
    est_min: 25
    prereqs: [ddia-06]
    files_to: 13-data-engineering
    summary: >-
      Part III treats derived data as the output of batch and stream jobs. Ch. 10 builds MapReduce up
      from a Unix pipeline (sort | uniq -c), then explains distributed execution on a distributed
      filesystem, the shuffle, and reduce-side versus map-side joins. Files to 13-data-engineering,
      next to the lakehouse and Parquet notes.
    key_points:
      - The Unix philosophy — a uniform interface, separating logic from wiring, immutable inputs, cheap experimentation
      - Sorting vs in-memory aggregation; MapReduce as a distributed sort with mapper and reducer callbacks
      - The shuffle — partition by key, sort, copy to reducers; workflows of chained jobs
      - Reduce-side joins — sort-merge join, secondary sort, handling skewed (hot) keys
      - Map-side joins — broadcast hash, partitioned hash, map-side merge — when one input is small or both are already partitioned alike
    diagram: >-
      The book's user-activity join as a dataflow — activity events and the user database both keyed
      by user_id in mappers, shuffled to reducers, joined by sort-merge, with the hot-key skew path
      marked.
    example: >-
      Run the book's pipeline on any web-server access log (or a ten-line generated one): cat
      access.log | awk '{print $7}' | sort | uniq -c | sort -r -n | head -n 5. Then write the same job
      as map (url to 1), shuffle (group by key) and reduce (sum) in 15 lines of Scala collections or
      Python, and mark where a real cluster would move data over the network.
    presentation: deep
    sources:
      - title: Designing Data-Intensive Applications (Kleppmann, 1st ed.)
        url: https://dataintensive.net/
        locator: ch. 10, "Batch Processing with Unix Tools"; "MapReduce and Distributed Filesystems" → "MapReduce Job Execution", "Reduce-Side Joins and Grouping", "Map-Side Joins"
        kind: book
        verified: false
      - title: MapReduce — Simplified Data Processing on Large Clusters (Dean and Ghemawat, OSDI 2004)
        url: https://research.google/pubs/mapreduce-simplified-data-processing-on-large-clusters/
        locator: sections "Programming Model" and "Implementation" (execution overview)
        kind: paper
