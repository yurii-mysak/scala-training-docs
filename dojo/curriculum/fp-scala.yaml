  - id: fp-scala-16
    title: "Monoids: laws, foldMap and parallel folding"
    level: I
    est_min: 25
    prereqs: [fp-scala-15, fp-scala-11, fp-scala-13]
    summary: >-
      Opens Part 3 by naming the first purely algebraic structure: a type with an associative
      combine and an identity element. Monoids are exactly what folds need; foldMap maps then
      combines, and associativity is what lets a fold be split into a balanced tree and run in
      parallel with Par. Extends 01-scala-language/Type-Classes-and-CT.md (§2 Monoids) and
      01-scala-language/typeclass_hierarchy.md (Semigroup, Monoid) with laws-as-tests and the
      parallel fold; instances are given values (see 01-scala-language/ImplicitsTypeClasses.md).
    key_points:
      - "Monoid = a type, an associative combine and an empty element; string, integer, boolean, Option and endofunction monoids (§10.1)"
      - "Monoid laws checked with the ch. 8 Prop: monoidLaws (Exercise 10.4)"
      - "Folding with monoids: foldMap, and foldRight and foldLeft derived from foldMap via the endofunction monoid (§10.2)"
      - "Associativity enables balanced folds: foldMapV splits an IndexedSeq in half (§10.3)"
      - "Parallel folding with Par: parFoldMap (§10.3)"
      - "Monoid instances as given values in Scala 3 (implicit objects in the 1st ed.)"
    diagram: >-
      Two folds of the same eight elements: a left-leaning chain (((a·b)·c)·d)… next to a
      balanced tree (a·b)·(c·d)…, the balanced tree's subtrees marked as independent Par tasks,
      with a caption that associativity makes both results equal.
    example: >-
      Lab in a scala-cli script: Exercise 10.5 foldMap and Exercise 10.7 foldMapV (the balanced
