      - "Parallel parsing: the WC monoid (Stub, Part) counts words across arbitrary splits (§10.4)"
      - "Foldable[F[_]]: foldRight, foldLeft, foldMap and toList for List, IndexedSeq, LazyList, Tree and Option (§10.5)"
      - "Higher-kinded type parameters as the first step to abstracting over containers"
      - "Composing monoids: productMonoid, functionMonoid, mapMergeMonoid (§10.6.1)"
      - "Fusing traversals: a mean (sum and count) in one pass with a product monoid (§10.6.2)"
    diagram: >-
      Word-count split: the book's "lorem ipsum dolor sit amet, " cut into chunks, each chunk
      mapped to a WC value (Stub, or Part(leftStub, words, rightStub)), then combined pairwise
      up a tree into one Part whose word count is the answer.
