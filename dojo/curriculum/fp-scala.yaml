      - "The associative law in flatMap form, and why it lets for-comprehensions be refactored safely (§11.4.1)"
      - "Kleisli composition: compose(f, g), and the laws restated as associativity plus identity (Exercises 11.7–11.10)"
      - "Identity laws; join as an alternative primitive set unit, map, join (§11.4.3, Exercises 11.12–11.13)"
      - "The identity monad: flatMap is just variable substitution (§11.5.1)"
      - "The State monad and partial type application: ({type f[x] = State[S, x]})#f in the 1st ed., [x] =>> State[S, x] in Scala 3 (§11.5.2)"
      - "A monad is a set of primitives that obey laws, not a container or a 'computation' metaphor"
    diagram: >-
      Category-style diagram: objects A, B, C, D with Kleisli arrows f: A → F[B],
      g: B → F[C], h: C → F[D]; the two paths compose(compose(f, g), h) and
      compose(f, compose(g, h)) meeting at F[D], and unit drawn as the identity arrow on each
      object.
