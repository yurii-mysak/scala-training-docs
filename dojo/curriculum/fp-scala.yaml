    summary: >-
      States the monad laws, associativity and left and right identity, and shows they become
      obvious once phrased with Kleisli composition of A => F[B] functions. It then asks "just
      what is a monad?" through the identity monad (flatMap is variable substitution) and the
      State monad, which needs partial type application to fit Monad's F[_]. Extends §7 Kleisli
      of 01-scala-language/Type-Classes-and-CT.md; the State instance closes the loop with ch. 6
      and 02-functional-programming/Purely-Functional-State.md.
