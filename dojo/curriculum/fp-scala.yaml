  # ---------------------------------------------------------------- Part 4 · Effects and I/O (A)
  - id: fp-scala-22
    title: "External effects and I/O: the IO type and trampolining"
    level: A
    est_min: 30
    prereqs: [fp-scala-21]
    summary: >-
      Factors effects out of a program into a pure core and an effectful shell, writes a first
      IO type and shows that it is a monad. The naive IO overflows the stack, so the chapter
      reifies control flow as data (Return, Suspend, FlatMap) and interprets it with a
      tail-recursive loop, trampolining, then generalises the pattern into the Free monad.
      Extends 02-functional-programming/SideEffects_IO.md, which covers the history and Cats
      Effect's IO, with the book's derivation of stack safety.
    key_points:
      - "Factoring effects: inside every impure function is a pure function trying to get out (§13.1)"
      - "A simple IO type and its Monad instance; handling input effects (§13.2)"
      - "StackOverflowError on long flatMap chains, fixed by reifying control flow as data constructors (§13.3.1)"
      - "Trampolining: a tail-recursive run loop that re-associates FlatMap(FlatMap(x, f), g) (§13.3.2)"
      - "From TailRec to Free[F, A], the 'reasonably priced monads' (§13.4.1)"
    diagram: >-
      Flowchart of the run interpreter loop: match Return (done), Suspend (call the thunk),
      FlatMap(Return or Suspend, f) (take a step), and FlatMap(FlatMap(y, g), f) (re-associate
      to FlatMap(y, a => FlatMap(g(a), f)) and loop), with the call stack staying flat.
    example: >-
      Lab in a scala-cli script: Exercise 13.1 (Free is a monad for any F: implement map,
      flatMap and the freeMonad instance) and Exercise 13.2 runTrampoline for
      Free[Function0, A]. Test with a 100 000-step chain of flatMaps that blows the stack on the
      naive IO.
    presentation: deep
    sources:
      - title: "Functional Programming in Scala, 2nd ed. (Chiusano, Bjarnason, Pilquist)"
        url: https://www.manning.com/books/functional-programming-in-scala-second-edition
        locator: "ch. 13 'External effects and I/O', §13.1 'Factoring effects', §13.2 'A simple IO type', §13.3 'Avoiding the StackOverflowError' (§13.3.1–13.3.2), §13.4.1 'Reasonably priced monads'"
        kind: book
        verified: false
      - title: "fpinscala companion repository"
        url: https://github.com/fpinscala/fpinscala
        locator: "iomonad chapter folder: IO.scala (IO, TailRec, Free)"
        kind: docs
        verified: false
      - title: "Rúnar Bjarnason, Stackless Scala With Free Monads"
        url: http://blog.higher-order.com/assets/trampolines.pdf
        locator: "§3 Trampolines, §4 Free monads (paper the chapter builds on)"
        kind: paper
        verified: false

  - id: fp-scala-23
    title: "Free monads, interpreters and the IO type at the end of the universe"
    level: A
    est_min: 30
    prereqs: [fp-scala-22]
    summary: >-
      Uses Free[F, A] with a Console algebra to describe programs that may only do console I/O,
      then writes several interpreters: to Function0, to Par, and pure ones for tests. It moves on
      to non-blocking asynchronous I/O by interpreting into Par, a general-purpose IO type and the
      "main program at the end of the universe", and closes by showing why monadic IO is not
      enough for streaming, the setup for ch. 15. Extends the "Free & Free Applicative Monads"
      section of 02-functional-programming/Functional-Design-Patterns.md.
    key_points:
      - "A monad that supports only console I/O: a Console algebra lifted into Free (§13.4.2)"
      - "Interpreters as natural transformations F ~> G: translate, and running Console in Function0 or Par (§13.4.2)"
      - "Pure interpreters for testing with buffers or State (§13.4.3)"
      - "Non-blocking and asynchronous I/O by interpreting into Par (§13.5)"
      - "A general-purpose IO type and the main program at the end of the universe (§13.6)"
      - "Why the IO type is insufficient for streaming I/O, the motivation for ch. 15 (§13.7)"
    diagram: >-
      Layer diagram: a Free[Console, A] program in the middle as a tree of Suspend and FlatMap
      nodes; below it three interpreters fan out to Function0 (the real console), Par (async) and
      a pure State-based test console, each labelled with its natural transformation.
    example: >-
      Lab in a scala-cli script: Exercise 13.3 (a generic run for Free[F, A] given Monad[F]) and
      Exercise 13.4 (translate, then runConsole through runTrampoline so it is stack-safe). Run
      one Console program against both the real interpreter and a pure test interpreter.
    presentation: deep
    sources:
      - title: "Functional Programming in Scala, 2nd ed. (Chiusano, Bjarnason, Pilquist)"
        url: https://www.manning.com/books/functional-programming-in-scala-second-edition
        locator: "ch. 13, §13.4.2 'A monad that supports only console I/O', §13.4.3 'Pure interpreters', §13.5 'Non-blocking and asynchronous I/O', §13.6 'A general-purpose IO type', §13.7 'Why the IO type is insufficient for streaming I/O'"
        kind: book
        verified: false
      - title: "fpinscala companion repository"
        url: https://github.com/fpinscala/fpinscala
        locator: "iomonad chapter folder: IO.scala (Free, Console, translate, runConsole)"
        kind: docs
        verified: false
