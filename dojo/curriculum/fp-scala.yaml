  - id: fp-scala-20
    title: "Applicative functors: map2 as the primitive"
    level: A
    est_min: 30
    prereqs: [fp-scala-19]
    summary: >-
      Shows that most monadic combinators only need unit and map2, which defines Applicative, a
      weaker but more common abstraction. Applicative computations have a structure fixed up
      front, while monadic ones can choose the next step from earlier results; the chapter
      compares the Option and Parser applicatives with their monads. Validated (Validation in the
      1st ed.) accumulates every error, something no monad can do. Extends §5–6 Apply and
      Applicative of 01-scala-language/typeclass_hierarchy.md and §3 of
      01-scala-language/Type-Classes-and-CT.md.
    key_points:
      - "Applicative with unit and map2 (or unit and apply) as primitives; traverse and sequence only need map2 (§12.1–12.2)"
      - "Monad vs applicative: context-sensitive vs context-free, shown with Option and Parser (§12.3)"
      - "Not every applicative is a monad: zipping lazy lists, and Validated accumulating errors (§12.4.1)"
      - "Applicative laws: left and right identity, associativity, naturality of product (§12.5)"
      - "The practical payoff: form validation that reports every error at once"
    diagram: >-
      Two flowcharts validating the chapter's WebForm (name, birthdate, phone): a monadic
      flatMap chain that stops at the first error, and an applicative map3 where the three
      validations run independently and their errors are combined into one list.
    example: >-
      Lab in a Scala worksheet: Exercise 12.1 (sequence, replicateM and product from map2 and
