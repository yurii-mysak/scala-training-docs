  - id: fp-scala-21
    title: "Traversable functors: traverse, mapAccum and fusion"
    level: A
    est_min: 30
    prereqs: [fp-scala-20, fp-scala-17]
    summary: >-
      Generalises traverse and sequence to any data structure with the Traverse type class, which
      turns out to subsume both Functor and Foldable. With the State applicative a single traverse
      can label elements, reverse a structure or fold it (mapAccum); traversals can be fused and
