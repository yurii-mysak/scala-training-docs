  - id: fp-scala-11
    title: "The algebra of an API: laws, the fork deadlock and general combinators"
    level: I
    est_min: 30
    prereqs: [fp-scala-10]
    summary: >-
      Treats the Par API as an algebra with laws, map(y)(id) == y and fork(x) == x, and reasons
      with them like equations. Checking the forking law exposes a real bug: on a fixed-size
      thread pool the blocking fork deadlocks, which the chapter fixes with a non-blocking
      implementation. It then refines choice, choiceN and chooser into their most general forms,
      flatMap and join.
    key_points:
      - "Laws as specifications: the law of mapping and the free theorem map(map(y)(g))(f) == map(y)(f compose g) (§7.4.1)"
      - "The law of forking, and how the blocking implementation breaks it on a fixed thread pool (§7.4.2–7.4.3)"
      - "A fully non-blocking Par built on callbacks (actors in the book) (§7.4.4)"
      - "Generalising choice → choiceN → chooser → flatMap, and flatMap expressed through join (§7.5)"
      - "Algebraic design as a method: design against laws, not against one implementation"
    diagram: >-
      Deadlock sequence diagram: a one-thread pool; fork(fork(x)) submits the outer task, which
      takes the only thread and blocks on Future.get for the inner task, which waits in the queue
      forever. A second lane shows the callback-based version completing.
    example: >-
      Lab in a scala-cli script: Exercise 7.9, showing that any fixed-size pool can deadlock with
      the blocking fork (reproduce it with Executors.newFixedThreadPool(1) and
      fork(fork(unit(1))), using get with a timeout so the script ends). Then Exercise 7.14 join,
      and define flatMap through join.
    presentation: standard
    sources:
      - title: "Functional Programming in Scala, 2nd ed. (Chiusano, Bjarnason, Pilquist)"
        url: https://www.manning.com/books/functional-programming-in-scala-second-edition
