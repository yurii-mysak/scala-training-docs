  - id: fp-scala-24
    title: "Local effects and mutable state: the ST monad"
    level: A
    est_min: 25
    prereqs: [fp-scala-23]
    summary: >-
      Argues that mutation is fine when nobody can observe it, and builds the ST monad, whose
      phantom type parameter S lets the type checker guarantee that mutable references and arrays
      never escape the scope that created them. A purely functional in-place quicksort is the
      payoff, and the chapter ends by reframing purity as contextual: what counts as a side
      effect depends on who can observe it. Contrasts with the Ref and STM sections of
      02-functional-programming/Purely-Functional-State.md, which deal with shared rather than
      local mutable state.
    key_points:
      - "Purely functional mutable state: referential transparency only requires that mutation cannot be observed (§14.1)"
      - "ST[S, A] as a little language for scoped mutation; STRef and its algebra (§14.2.1–14.2.2)"
      - "Running ST actions with RunnableST so references cannot escape (§14.2.3)"
      - "STArray and a purely functional in-place quicksort (§14.2.4–14.2.5)"
      - "Purity is contextual: what counts as a side effect, e.g. StringBuilder inside a function, eq vs == (§14.3)"
    diagram: >-
      Scope diagram: a runST boundary box containing STRef and STArray allocation, reads and
      writes; the pure result leaves the box, while an STRef[S, A] trying to escape is crossed
      out with the note "S is universally quantified, so this does not type-check".
    example: >-
      Lab in a scala-cli script: Exercise 14.1 (fill for STArray from a Map) and Exercise 14.2
      (partition and qs for the in-place quicksort). Run quicksort(List(5, 3, 8, 1)) and confirm
      the result is a pure function of its input.
    presentation: deep
    sources:
      - title: "Functional Programming in Scala, 2nd ed. (Chiusano, Bjarnason, Pilquist)"
        url: https://www.manning.com/books/functional-programming-in-scala-second-edition
        locator: "ch. 14 'Local effects and mutable state', §14.1 'Purely functional mutable state', §14.2 (§14.2.1–14.2.5, incl. 'A purely functional in-place quicksort'), §14.3 'Purity is contextual'"
        kind: book
        verified: false
      - title: "fpinscala companion repository"
        url: https://github.com/fpinscala/fpinscala
        locator: "localeffects chapter folder: LocalEffects.scala (ST, STRef, STArray, Immutable.quicksort)"
        kind: docs
        verified: false

  - id: fp-scala-25
    title: "Stream processing I: simple stream transformers"
    level: A
    est_min: 30
    prereqs: [fp-scala-24, fp-scala-07]
    summary: >-
      Starts from an imperative line-counting loop that is efficient but not compositional and
      replaces it with a stream-transformer type: Process[I, O] with Emit, Await and Halt in the
      1st edition, Pull and Stream in the 2nd (Pilquist's FS2 design). Transformers such as take,
      filter, count and mean are built and piped together, giving incremental I/O that composes
      like LazyList. Extends 07-messaging-and-streaming/Messaging-fs2_streams_basics.md by
      deriving what FS2 provides.
    key_points:
      - "Problems with imperative I/O: the line-counting example mixes concerns and cannot be reused (§15.1)"
      - "A stream transformer as a state machine: emit output, await input, halt (§15.2)"
      - "Building transformers: lift, filter, take, drop, takeWhile, count, mean, and a general loop (§15.2.1)"
      - "Composition by piping one transformer's output into another; append and repeat (§15.2.2)"
      - "Processing files incrementally without loading them whole (§15.2.3)"
    diagram: >-
      State-machine diagram of a transformer: Await(recv) consumes one input and moves to
      Emit(head, tail) or Halt; below it a pipeline source |> filter |> take(3) |> count with
      elements pulled one at a time from a file.
    example: >-
      Lab in a scala-cli script: Exercise 15.1 (take, drop, takeWhile and dropWhile as
      transformers) and Exercise 15.3 (a running mean), then pipe them over a small file of
      numbers. Numbers follow the 1st ed.; in the 2nd ed. the same tasks are the opening ch. 15
      exercises on Pull, so confirm against the streamingio folder of the companion repo.
    presentation: deep
    sources:
      - title: "Functional Programming in Scala, 2nd ed. (Chiusano, Bjarnason, Pilquist)"
        url: https://www.manning.com/books/functional-programming-in-scala-second-edition
        locator: "ch. 15 'Stream processing and incremental I/O', §15.1 'Problems with imperative I/O: an example', §15.2 simple stream transformations (Process in the 1st ed., Pull and Stream in the 2nd)"
        kind: book
        verified: false
      - title: "fpinscala companion repository"
        url: https://github.com/fpinscala/fpinscala
        locator: "streamingio chapter folder (exercise stubs and answers)"
        kind: docs
        verified: false
      - title: "FS2 documentation"
        url: https://fs2.io/
        locator: "Guide › Building streams, and the Pull section"
        kind: docs
        verified: false

  - id: fp-scala-26
    title: "Stream processing II: effects, resource safety and applications"
    level: A
    est_min: 30
    prereqs: [fp-scala-25, fp-scala-23]
    summary: >-
      Extends the transformer with an effect type so streams can perform I/O, then tackles
      resource safety (files and connections closed on completion, early termination or error),
      multiple inputs, sinks and effectful channels. The closing section sketches where these
      ideas apply, which is the bridge from the book to FS2 and Akka Streams in daily work.
      Extends 07-messaging-and-streaming/Messaging-fs2_streams_advanced.md and the Akka Streams
      notes in the same section.
    key_points:
      - "An extensible stream type parameterised by an effect F; sources that evaluate effects (§15.3.1)"
      - "Resource safety: finalisers run on normal completion, early termination and failure (§15.3.2)"
      - "Single-input transformers, multiple inputs (zip, merge), sinks and effectful channels (§15.3.3–15.3.6)"
      - "Dynamic resource allocation, e.g. a stream of file names becoming a stream of their lines (§15.3.7)"
      - "Applications of compositional streaming, and the direct line to FS2 and Akka Streams (§15.4)"
    diagram: >-
      Lifecycle diagram for a resource-safe source: acquire a file handle → emit lines →
      downstream take(5) stops early → the finaliser closes the handle; a second path shows an
      error mid-stream still reaching the finaliser.
    example: >-
      Lab in a scala-cli script: the chapter's Fahrenheit-to-Celsius exercise (15.9 in the 1st
      ed.): read a file of Fahrenheit values line by line, convert, and write the result to
      another file, built so the input handle is closed even when the pipeline stops early. Then
      write the same pipeline with FS2 (Files[IO].readUtf8Lines) and compare.
    presentation: deep
    sources:
      - title: "Functional Programming in Scala, 2nd ed. (Chiusano, Bjarnason, Pilquist)"
        url: https://www.manning.com/books/functional-programming-in-scala-second-edition
        locator: "ch. 15, §15.3 'An extensible process type' (§15.3.1–15.3.7; 'extensible pulls and streams' in the 2nd ed.), §15.4 'Applications'"
        kind: book
        verified: false
      - title: "fpinscala companion repository"
        url: https://github.com/fpinscala/fpinscala
        locator: "streamingio chapter folder (effectful streams, resource safety)"
        kind: docs
        verified: false
      - title: "FS2 documentation"
        url: https://fs2.io/
        locator: "Guide › Resource acquisition; fs2.io.file Files"
        kind: docs
        verified: false
