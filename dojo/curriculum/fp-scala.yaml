    summary: >-
      The word-count example (WC with Stub and Part) shows how a non-obvious monoid makes a
      sequential problem splittable. The chapter then abstracts over containers with the Foldable
      type class, a higher-kinded F[_], and composes monoids (product, function and map-merge) so
      that several aggregates come out of one traversal. Extends §9 Foldable of
      01-scala-language/typeclass_hierarchy.md and §5 Foldable & Traverse of
      01-scala-language/Type-Classes-and-CT.md.
