      - "From monoids to applicatives: every monoid gives a constant applicative, so foldMap is a traverse (§12.7.1)"
      - "Traversals with State: zipWithIndex, toList, mapAccum, reverse, foldLeft (§12.7.2)"
      - "Combining, fusing and nesting traversals: zip, fuse, compose (§12.7.3–12.7.5)"
      - "Monad composition: applicatives always compose, monads need Traverse on the inner type (§12.7.6)"
