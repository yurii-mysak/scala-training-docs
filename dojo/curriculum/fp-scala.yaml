track: fp-scala
name: "Functional Programming in Scala (red book)"
weight: 3
files_to: 02-functional-programming
description: >-
  A chapter-by-chapter path through "Functional Programming in Scala" in the book's own order:
  Part 1 introduction to FP (B), Part 2 functional design and combinator libraries (I), Part 3
  common structures such as monoids, monads and applicative/traversable functors (I to A), and
  Part 4 effects and I/O (A), with each rung's lab taken from the book's own exercises and done
  in a Scala worksheet or scala-cli script. Section and exercise numbers follow the 2nd
  edition, which keeps the 1st edition's 15-chapter, 4-part structure and nearly all of its
  numbering (ch. 15 was rewritten around Pull/Stream), so writers confirm numbers against the
  companion repo, and rungs extend the existing notes in 02-functional-programming and
  01-scala-language instead of repeating them.
primary_sources:
  - title: "Functional Programming in Scala, Second Edition (Chiusano, Bjarnason, Pilquist; Manning)"
    url: https://www.manning.com/books/functional-programming-in-scala-second-edition
  - title: "Functional Programming in Scala, 1st edition (Chiusano, Bjarnason; Manning)"
    url: https://www.manning.com/books/functional-programming-in-scala
  - title: "fpinscala companion repository: exercise stubs, hints and answers"
    url: https://github.com/fpinscala/fpinscala
rungs:
  # ---------------------------------------------------------------- Part 1 · Introduction to FP (B)
  - id: fp-scala-01
    title: "What is FP: referential transparency and the substitution model"
    level: B
    est_min: 15
    prereqs: []
    summary: >-
      Opens the red book with its Cafe example: a buyCoffee method that charges a credit card as
      a side effect is refactored to return the charge as a value, which makes it testable and
      lets charges be batched and coalesced. From that the chapter defines a pure function and
      referential transparency, and introduces the substitution model the rest of the book uses
      to reason about programs. Extends the existing note
      02-functional-programming/Functional-Programming-Foundations.md ("Pure Functions &
      Referential Transparency") with the book's argument instead of repeating definitions.
    key_points:
      - "A side effect is anything a function does besides returning its result; the Cafe example shows why it hurts testing and reuse (§1.1)"
      - "Pushing effects to the edge: buyCoffee returns (Coffee, Charge) and a separate layer talks to the payment system"
      - "Definition of a pure function, and of referential transparency: an expression can be replaced by its value without changing the program's meaning (§1.2–1.3)"
      - "The substitution model as equational reasoning; the book's String vs StringBuilder.append example shows it breaking (§1.3)"
      - "Why it pays off day to day: local reasoning, modularity and safe refactoring"
    diagram: >-
      Two-panel flowchart. Left: buyCoffee calls cc.charge, with an arrow out to an external
      Payments box labelled "side effect". Right: buyCoffee returns (Coffee, Charge) as values,
      a list of Charges flows into coalesce, and only the outer edge calls Payments, once per
      card.
    example: >-
      Chapter 1 has no numbered exercises, so the lab replays its two worked examples in a
      scala-cli script (ch01.sc). (1) Write Charge with a combine method, buyCoffees(cc, n)
      returning (List[Coffee], Charge), and coalesce(charges: List[Charge]) using groupBy on the
      card and reduce with combine. (2) Run the §1.3 substitution test: with x = "Hello, World",
      replace x.reverse by its value and see that r1 and r2 stay equal; repeat with a
      StringBuilder and append and watch r1 and r2 differ.
    presentation: minimal
    sources:
      - title: "Functional Programming in Scala, 2nd ed. (Chiusano, Bjarnason, Pilquist)"
        url: https://www.manning.com/books/functional-programming-in-scala-second-edition
        locator: "ch. 1 'What is functional programming?', §1.1 (the Cafe / buyCoffee example), §1.2 'Exactly what is a (pure) function?', §1.3 'Referential transparency, purity, and the substitution model'"
        kind: book
        verified: false
      - title: "Scala 3 Book: Pure Functions"
        url: https://docs.scala-lang.org/scala3/book/fp-pure-functions.html
        locator: "Scala 3 Book › Functional Programming › Pure Functions"
        kind: docs
        verified: false

  - id: fp-scala-02
    title: "Getting started: tail recursion, higher-order and polymorphic functions"
    level: B
    est_min: 20
    prereqs: [fp-scala-01]
    summary: >-
      Chapter 2 writes loops as local tail-recursive functions, passes functions as values
      (higher-order functions) and abstracts over types with polymorphic functions such as
      findFirst and isSorted. Its closing idea, "following types to implementations", shows that
      signatures like partial1, curry and compose admit essentially one implementation. Extends
      02-functional-programming/Functional-Programming-Foundations.md ("Recursion & Tail-Rec
      Optimisation") and 01-scala-language/AdvancedFunctions.md (HOFs, currying, @tailrec); the
      new part is the book's type-driven reasoning.
    key_points:
      - "Loops as a local tail-recursive go function; @annotation.tailrec turns a missed optimisation into a compile error (§2.4.1)"
      - "Higher-order functions: formatResult takes the function to apply as a parameter (§2.4.2)"
      - "Monomorphic vs polymorphic functions: findFirst over Array[A] with a predicate A => Boolean (§2.5)"
      - "Function literals and how Scala represents them as Function1 objects (§2.5.2)"
      - "Following types to implementations: the signature of compose leaves only one sensible body (§2.6)"
    diagram: >-
      Call-stack comparison: a naive recursive factorial piling up one frame per call, next to
      the tail-recursive go(n, acc) compiled to a single frame with a jump arrow back to the top.
      A callout notes that @tailrec makes the compiler reject a non-tail call.
    example: >-
      Lab in a Scala worksheet (ch02.worksheet.sc in Metals) or a scala-cli script. Exercise 2.1:
      fib(n) using a local @tailrec def go; check that fib(0) to fib(6) give 0, 1, 1, 2, 3, 5, 8.
      Exercise 2.5: compose[A, B, C](f: B => C, g: A => B): A => C, written only by following the
      types; then compare it with the standard library's f compose g and g andThen f.
    presentation: minimal
    sources:
      - title: "Functional Programming in Scala, 2nd ed. (Chiusano, Bjarnason, Pilquist)"
        url: https://www.manning.com/books/functional-programming-in-scala-second-edition
        locator: "ch. 2 'Getting started with functional programming in Scala', §2.4 'Higher-order functions' (§2.4.1 'Writing loops functionally'), §2.5 'Polymorphic functions', §2.6 'Following types to implementations'"
        kind: book
        verified: false
      - title: "fpinscala companion repository"
        url: https://github.com/fpinscala/fpinscala
        locator: "gettingstarted chapter folder: GettingStarted.scala under exercises, and its counterpart under answers"
        kind: docs
        verified: false
      - title: "Tour of Scala: Higher-order Functions"
        url: https://docs.scala-lang.org/tour/higher-order-functions.html
        locator: "Tour of Scala › Higher-order Functions"
        kind: docs
        verified: false

  - id: fp-scala-03
    title: "Functional data structures I: the List ADT, pattern matching and data sharing"
    level: B
    est_min: 20
    prereqs: [fp-scala-02]
    summary: >-
      Builds the book's own singly linked List as an algebraic data type (Nil and Cons) and writes
      functions over it by pattern matching. The key insight is data sharing: an immutable list is
      never copied when you drop or prepend, which is what makes persistent structures cheap.
      Extends 02-functional-programming/Functional-Data-Structures.md (§1 Persistent Lists, §5
      ADTs) and 01-scala-language/PatternMatching.md; what is new is implementing the structure
      yourself.
    key_points:
      - "Defining List as an ADT: one data constructor per case, plus a companion with sum, product and a variadic apply (§3.1)"
      - "Pattern matching as the way to take an ADT apart; exhaustiveness checking on a sealed type or enum (§3.2)"
      - "Data sharing: tail and drop are O(1) and reuse the original cells, so no defensive copying (§3.3)"
      - "Why init cannot run in constant time on a singly linked list (Exercise 3.6)"
      - "Variance: List[+A] lets the single Nil be a List[Nothing] shared by every list"
    diagram: >-
      Box-and-arrow persistent list: xs = Cons(1, Cons(2, Cons(3, Nil))); ys = tail(xs) points
      into the second cell of xs; zs = setHead(xs, 9) is one new cell 9 pointing at the same
      Cons(2, ...) tail, so three lists share structure.
    example: >-
      Lab in a scala-cli script on the book's own List: Exercise 3.2 tail and Exercise 3.3
      setHead. Decide and justify what each does on Nil (throw or return Nil), then confirm
      sharing with reference equality: tail(xs) eq the second cell of xs.
    presentation: standard
    sources:
      - title: "Functional Programming in Scala, 2nd ed. (Chiusano, Bjarnason, Pilquist)"
        url: https://www.manning.com/books/functional-programming-in-scala-second-edition
        locator: "ch. 3 'Functional data structures', §3.1 'Defining functional data structures', §3.2 'Pattern matching', §3.3 'Data sharing in functional data structures'"
        kind: book
        verified: false
      - title: "fpinscala companion repository"
        url: https://github.com/fpinscala/fpinscala
        locator: "datastructures chapter folder: List.scala (exercises and answers)"
        kind: docs
        verified: false
      - title: "Scala 3 Book: Algebraic Data Types"
        url: https://docs.scala-lang.org/scala3/book/types-adts-gadts.html
        locator: "Scala 3 Book › Domain Modeling / Types › Algebraic Data Types"
        kind: docs
        verified: false

  - id: fp-scala-04
    title: "Functional data structures II: foldRight, foldLeft and trees"
    level: B
    est_min: 25
    prereqs: [fp-scala-03]
    summary: >-
      Generalises recursive list functions into foldRight and its stack-safe twin foldLeft, then
      builds length, reverse, append, map, filter and flatMap on top of them. The chapter closes
      with a binary Tree ADT where size, maximum, depth and map collapse into a single fold.
      Builds on the List from the previous rung and extends
      02-functional-programming/Functional-Data-Structures.md (§3 Trees) with the fold-based
      derivations.
    key_points:
      - "Abstracting sum and product into foldRight; why foldRight is not stack-safe and cannot short-circuit (§3.4, Exercise 3.7)"
      - "foldRight(xs, Nil)(Cons(_, _)) rebuilds the list: a fold replaces the constructors (Exercise 3.8)"
      - "foldLeft as a tail-recursive loop, and foldRight expressed through foldLeft (Exercises 3.10, 3.13)"
      - "Loss of efficiency when list functions are assembled from simpler ones: extra passes (§3.4.2)"
      - "The Tree ADT (Leaf, Branch) and generalising its functions into fold (§3.5)"
    diagram: >-
      Side-by-side expression trees: foldRight(List(1, 2, 3), 0)(_ + _) nesting to the right as
      1 + (2 + (3 + 0)) with stack frames growing, versus foldLeft accumulating
      ((0 + 1) + 2) + 3 in one loop.
    example: >-
      Lab in a Scala worksheet. Exercise 3.10: a @tailrec foldLeft; build a 100 000-element list
      with a small tail-recursive helper (the book's variadic apply is itself recursive) and see
      foldLeft succeed where foldRight overflows. Then the Tree fold exercise that closes §3.5
      (3.28 in the 2nd ed., 3.29 in the 1st) and rewrite size and depth through it.
    presentation: standard
    sources:
      - title: "Functional Programming in Scala, 2nd ed. (Chiusano, Bjarnason, Pilquist)"
        url: https://www.manning.com/books/functional-programming-in-scala-second-edition
        locator: "ch. 3, §3.4 'Recursion over lists and generalizing to higher-order functions' (incl. §3.4.2 on loss of efficiency), §3.5 'Trees'"
        kind: book
        verified: false
      - title: "fpinscala companion repository"
        url: https://github.com/fpinscala/fpinscala
        locator: "datastructures chapter folder: List.scala and Tree.scala (exercises and answers)"
        kind: docs
        verified: false

  - id: fp-scala-05
    title: "Handling errors without exceptions: Option and Either"
    level: B
    est_min: 25
    prereqs: [fp-scala-04]
    summary: >-
      Argues that exceptions break referential transparency and are not tracked by types, then
      rebuilds Option and Either from scratch with map, flatMap, getOrElse, orElse and filter.
      The real lesson is lifting and traversal: map2, sequence and traverse let ordinary functions
      work over values that may have failed. Extends 01-scala-language/Option.md, which covers
      library usage and Option/Either interop; here the reader implements the types and the
      combinators that ch. 11–12 later generalise.
    key_points:
      - "Why exceptions break referential transparency and are not type-safe; the alternatives the book rejects (§4.1–4.2)"
      - "Option as the return type of a total function; usage patterns and lifting with lift(f) (§4.3.1–4.3.2)"
      - "map2, sequence and traverse: combining several Options, and why traverse avoids a second pass"
      - "Either carries the error; for-comprehensions over Either (§4.4)"
      - "Short-circuiting vs accumulating errors: the limit that motivates Validated and applicatives (end of ch. 4, then ch. 12)"
    diagram: >-
      Railway diagram for the chapter's parseInsuranceRateQuote: parse age, parse tickets,
      compute the rate. A success track and a failure track; Option drops to a None track and
      loses the reason, Either carries Left(error) along the failure track, and map2 joins two
      tracks into one.
    example: >-
      Lab in a scala-cli script on the book's Option and Either. Exercise 4.5: traverse for
      Option (write map2 first, then sequence in terms of traverse), tested with the chapter's
      Try helper on List("1", "2", "x"). Exercise 4.7: sequence and traverse for Either, and
      compare which error comes back.
    presentation: standard
    sources:
      - title: "Functional Programming in Scala, 2nd ed. (Chiusano, Bjarnason, Pilquist)"
        url: https://www.manning.com/books/functional-programming-in-scala-second-edition
        locator: "ch. 4 'Handling errors without exceptions', §4.1–4.2, §4.3 'The Option data type' (§4.3.2 'Option composition, lifting, and wrapping exception-oriented APIs'), §4.4 'The Either data type'"
        kind: book
        verified: false
      - title: "fpinscala companion repository"
        url: https://github.com/fpinscala/fpinscala
        locator: "errorhandling chapter folder: Option.scala and Either.scala"
        kind: docs
        verified: false
      - title: "Scala 3 Book: Functional Error Handling"
        url: https://docs.scala-lang.org/scala3/book/fp-functional-error-handling.html
        locator: "Scala 3 Book › Functional Programming › Functional Error Handling"
        kind: docs
        verified: false

  - id: fp-scala-06
    title: "Strictness and laziness: non-strict functions and LazyList"
    level: B
    est_min: 20
    prereqs: [fp-scala-05]
    summary: >-
      Separates strict from non-strict evaluation (thunks and by-name parameters) and builds a
      LazyList (Stream in the 1st ed.) whose cells hold unevaluated thunks, memoized through smart
      constructors. The central idea is separating the description of a computation from its
      evaluation, so chained map and filter steps interleave like one loop. Extends the "Strict
      vs Non-Strict (Lazy) Evaluation" and "Lazy Evaluation in Scala" sections of
      02-functional-programming/Functional-Programming-Foundations.md and the by-name section of
      01-scala-language/AdvancedFunctions.md.
    key_points:
      - "Strict vs non-strict functions; && and if as built-in non-strict forms; () => A thunks and => A by-name parameters (§5.1)"
      - "LazyList with Empty and Cons of thunks; smart constructors cons and empty memoize with lazy val (§5.2, §5.2.1)"
      - "foldRight with a lazy second argument can stop early: exists, forAll, takeWhile"
      - "Incremental evaluation: the book's trace of map(_ + 10).filter(_ % 2 == 0) element by element (§5.3)"
      - "Streams as first-class loops: no intermediate collections are built"
    diagram: >-
      Sequence diagram of the §5.3 trace: LazyList(1, 2, 3, 4).map(_ + 10).filter(_ % 2 == 0)
      .toList, each element pulled through map and then filter before the next element is
      touched, beside a strict List that builds a full intermediate list after map.
    example: >-
      Lab in a scala-cli script on the book's LazyList: Exercise 5.2 take and drop, and
      Exercise 5.5 takeWhile via foldRight. Put a println inside the element thunks to see
      exactly which elements get forced.
    presentation: standard
    sources:
      - title: "Functional Programming in Scala, 2nd ed. (Chiusano, Bjarnason, Pilquist)"
        url: https://www.manning.com/books/functional-programming-in-scala-second-edition
        locator: "ch. 5 'Strictness and laziness', §5.1 'Strict and non-strict functions', §5.2 'An extended example: lazy lists', §5.3 'Separating program description from evaluation'"
        kind: book
        verified: false
      - title: "fpinscala companion repository"
        url: https://github.com/fpinscala/fpinscala
        locator: "laziness chapter folder: LazyList.scala (Stream.scala in the 1st-edition branch)"
        kind: docs
        verified: false
      - title: "Scala collections: Concrete Immutable Collection Classes"
        url: https://docs.scala-lang.org/overviews/collections-2.13/concrete-immutable-collection-classes.html
        locator: "section 'LazyLists'"
        kind: docs
        verified: false

  - id: fp-scala-07
    title: "Infinite lazy lists and corecursion: unfold"
    level: B
    est_min: 25
    prereqs: [fp-scala-06]
    summary: >-
      Uses laziness to define infinite structures such as ones, from(n) and fibs, and
      generalises them into unfold, the corecursive dual of foldRight: it produces data instead
      of consuming it. Rewriting map, take and zipWith through unfold shows how far one general
      combinator reaches. Continues on the LazyList from the previous rung.
    key_points:
      - "Infinite lazy lists are safe because only the demanded prefix is evaluated (ones.take(5), ones.exists)"
      - "Corecursion (guarded recursion) produces data and stays productive, while recursion consumes it (§5.4)"
      - "unfold(state)(f: S => Option[(A, S)]) as the general lazy-list builder"
      - "Deriving fibs, from, continually (constant in the 1st ed.) and ones, then map, take and zipWith, through unfold"
      - "startsWith, tails and scanRight as follow-ups; why holding on to the head keeps memory alive"
    diagram: >-
      State-machine view of unfold: a state S box; f turns it into Some((a, s')), which emits a
      onto the output lane and loops back with s', or into None, which ends the list. Annotated
      with fibs' states (0, 1) → (1, 1) → (1, 2) → (2, 3).
    example: >-
      Lab in a Scala worksheet: Exercise 5.11 unfold, then Exercise 5.12, writing fibs, from,
      continually and ones through unfold. Check fibs.take(10).toList and
      from(1).takeWhile(_ < 6).toList.
    presentation: standard
    sources:
      - title: "Functional Programming in Scala, 2nd ed. (Chiusano, Bjarnason, Pilquist)"
        url: https://www.manning.com/books/functional-programming-in-scala-second-edition
        locator: "ch. 5, §5.4 'Infinite lazy lists and corecursion' ('Infinite streams and corecursion' in the 1st ed.)"
        kind: book
        verified: false
      - title: "fpinscala companion repository"
        url: https://github.com/fpinscala/fpinscala
        locator: "laziness chapter folder: LazyList.scala (unfold and the derived functions in answers)"
        kind: docs
        verified: false

  - id: fp-scala-08
    title: "Purely functional state: a pure random number generator"
    level: B
    est_min: 20
    prereqs: [fp-scala-07]
    summary: >-
      Starts from scala.util.Random's hidden mutation and makes the state explicit: nextInt
      returns the next RNG along with the value. Threading that state by hand quickly gets noisy,
      so the chapter introduces Rand[A] = RNG => (A, RNG) with unit, map, map2 and flatMap.
      Extends 02-functional-programming/Purely-Functional-State.md ("Example: RNG") with the
      derivation that note skips.
    key_points:
      - "Side-effecting Random is hard to test and to reproduce (§6.1)"
      - "Making stateful APIs pure: return the new state with the value; SimpleRNG's linear congruential generator (§6.2–6.3)"
      - "Rand[A] as a state-action type; unit, map and map2 hide the manual threading (§6.4, §6.4.1)"
      - "flatMap for nesting state actions: nonNegativeLessThan and why retrying needs it (§6.4.2)"
      - "Reproducibility (same seed, same results), which property-based testing in ch. 8 builds on"
    diagram: >-
      Chain of immutable RNG states: rng0 → nextInt → (i1, rng1) → nextInt → (i2, rng2). A note
      says calling nextInt on rng0 twice yields the same i1. A second lane shows map2(ra, rb)
      hiding the threading.
    example: >-
      Lab in a scala-cli script: Exercise 6.1 nonNegativeInt (handle Int.MinValue) and
      Exercise 6.6 map2 for Rand. Then use map2 to build both and randIntDouble and run them
      twice from the same seed.
    presentation: standard
    sources:
      - title: "Functional Programming in Scala, 2nd ed. (Chiusano, Bjarnason, Pilquist)"
        url: https://www.manning.com/books/functional-programming-in-scala-second-edition
        locator: "ch. 6 'Purely functional state', §6.1–6.3, §6.4 'A better API for state actions' (§6.4.1 'Combining state actions', §6.4.2 'Nesting state actions')"
        kind: book
        verified: false
      - title: "fpinscala companion repository"
        url: https://github.com/fpinscala/fpinscala
        locator: "state chapter folder: State.scala (RNG, SimpleRNG, Rand)"
        kind: docs
        verified: false

  - id: fp-scala-09
    title: "Purely functional state: the general State data type"
    level: B
    est_min: 25
    prereqs: [fp-scala-08]
    summary: >-
      Generalises Rand into State[S, A], a wrapper around S => (A, S) (an opaque type in the 2nd
      ed., a case class in the 1st), and moves unit, map, map2, flatMap and sequence onto it.
      With get, set and modify, for-comprehensions over State read like imperative code and stay
      pure. This is the State monad summarised in
      02-functional-programming/Purely-Functional-State.md; the rung adds the book's candy-machine
      simulation.
    key_points:
      - "State[S, +A] as the general state action, with Rand[A] = State[RNG, A] (§6.5)"
      - "map2, flatMap and sequence on State; sequencing a list of state actions"
      - "get, set and modify; for-comprehensions as imperative-looking pure code (§6.6)"
      - "The candy machine as a small finite-state domain model (Exercise 6.11)"
      - "Preview: State is a monad, and ch. 11 names the pattern"
    diagram: >-
      State diagram of the candy machine: Locked and Unlocked states carrying (candies, coins),
      transitions on Coin and Turn following Exercise 6.11's rules (coin into a locked machine
      with candy unlocks it; turn on an unlocked machine dispenses and locks; other inputs and
      any input with no candy are ignored).
    example: >-
      Lab in a Scala worksheet: Exercise 6.10 (unit, map, map2, flatMap and sequence for State)
      and Exercise 6.11 simulateMachine(inputs): State[Machine, (Int, Int)]. Run four
      Coin-Turn pairs on Machine(locked = true, candies = 5, coins = 10) and expect (14, 1),
      the book's own check.
    presentation: standard
    sources:
      - title: "Functional Programming in Scala, 2nd ed. (Chiusano, Bjarnason, Pilquist)"
        url: https://www.manning.com/books/functional-programming-in-scala-second-edition
        locator: "ch. 6, §6.5 'A general state action data type', §6.6 'Purely functional imperative programming', Exercise 6.11 (candy machine)"
        kind: book
        verified: false
      - title: "fpinscala companion repository"
        url: https://github.com/fpinscala/fpinscala
        locator: "state chapter folder: State.scala and the candy-machine answer"
        kind: docs
        verified: false

  # ---------------------------------------------------------------- Part 2 · Functional design and combinator libraries (I)
  - id: fp-scala-10
    title: "Purely functional parallelism: designing the Par data type"
    level: I
    est_min: 25
    prereqs: [fp-scala-09]
    summary: >-
      Designs a library for parallel computation from first principles, starting from a parallel
      sum and letting the use case drive the API: unit, map2, fork, lazyUnit and run. The
      representation, Par[A] = ExecutorService => Future[A], is chosen only after the API is
      sketched, which is the chapter's lesson about method. Extends §4 "Functional Parallelism à
      la FP-in-Scala" of 02-functional-programming/Purely-Functional-Concurrency.md; with Akka and
      Future experience behind him, the reader contrasts Par, a description, with
      scala.concurrent.Future, which is already running.
    key_points:
      - "Start from a use case (divide-and-conquer sum) and invent the data type and functions it needs (§7.1.1–7.1.2)"
      - "Explicit forking: why unit stays strict and fork marks the parallel boundary (§7.1.3)"
      - "Picking a representation: ExecutorService => Future[A] (§7.2)"
      - "Refining the API: map2 that does not block, asyncF, sequence, parMap, parFilter (§7.3)"
      - "Par as a description vs Future as a running computation, and what that does for referential transparency"
    diagram: >-
      Fork-join tree for the parallel sum of IndexedSeq(1 to 8): recursive splitAt into halves,
      leaves as unit, inner nodes as map2(fork(left), fork(right))(_ + _), with a legend saying
      nothing runs until run(es) is called.
    example: >-
      Lab in a scala-cli script on the book's Par: Exercise 7.4 asyncF and Exercise 7.5
      sequence. Build parMap from them and run it on Executors.newCachedThreadPool() (the
      fixed-pool deadlock is the next rung's subject).
    presentation: standard
    sources:
      - title: "Functional Programming in Scala, 2nd ed. (Chiusano, Bjarnason, Pilquist)"
        url: https://www.manning.com/books/functional-programming-in-scala-second-edition
        locator: "ch. 7 'Purely functional parallelism', §7.1 'Choosing data types and functions', §7.2 'Picking a representation', §7.3 'Refining the API'"
        kind: book
        verified: false
      - title: "fpinscala companion repository"
        url: https://github.com/fpinscala/fpinscala
