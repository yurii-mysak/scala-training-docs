# IT Iaido curriculum — schema: dojo/SPEC.md section 3.
# Sources are marked verified: false until the batch verification step fetches them.
track: networking
name: Networking, modern
weight: 2
files_to: 10-networking
description: >-
  A ladder from what is actually on the wire (TCP handshake, latency, congestion control, UDP)
  through the modern web transport stack (TLS 1.3, HTTP/2, HTTP/3 and QUIC, DNS, load balancing,
  CDNs, streaming transports) to production networking for distributed systems (service mesh and
  eBPF, zero trust and WireGuard, IPv6, path observability), ending in an end-to-end debugging
  runbook. Each rung builds on the ones before it, deepens rather than repeats the existing notes
  in 10-networking, and has a lab the reader can run on a Mac.
primary_sources:
  - title: High Performance Browser Networking (Ilya Grigorik, O'Reilly), free online edition
    url: https://hpbn.co/
  - title: Cloudflare Learning Center
    url: https://www.cloudflare.com/learning/
  - title: The Cloudflare Blog
    url: https://blog.cloudflare.com/
  - title: "RFC 9000: QUIC, a UDP-Based Multiplexed and Secure Transport"
    url: https://www.rfc-editor.org/rfc/rfc9000.html
  - title: "RFC 8446: The Transport Layer Security (TLS) Protocol Version 1.3"
    url: https://www.rfc-editor.org/rfc/rfc8446.html
  - title: APNIC Blog
    url: https://blog.apnic.net/
  - title: Cilium documentation
    url: https://docs.cilium.io/
  - title: WireGuard
    url: https://www.wireguard.com/
