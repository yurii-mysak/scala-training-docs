<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>{{subject}}</title>
</head>
<body style="margin:0;padding:0;background:#eef1f5;-webkit-text-size-adjust:100%;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;color:#eef1f5;">{{preheader}}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#eef1f5;">
<tr><td align="center" style="padding:20px 10px;">

<table role="presentation" width="680" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:680px;">

  <!-- header -->
  <tr><td style="background:#102a43;border-radius:10px 10px 0 0;padding:22px 26px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
    <div style="font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:#9fb3c8;">Daily learning</div>
    <div style="font-size:24px;line-height:1.3;font-weight:700;color:#ffffff;margin-top:4px;">IT Iaido &middot; Day {{day}} &middot; {{date}}</div>
    <div style="font-size:14px;color:#bcccdc;margin-top:6px;">{{lesson_count}} &middot; {{total_minutes}} min total</div>
  </td></tr>
  <tr><td style="height:12px;line-height:12px;font-size:0;">&nbsp;</td></tr>

  <!--card-->
  <tr><td style="background:#ffffff;border:1px solid #d9e2ec;border-radius:10px;padding:0;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
      <tr><td style="padding:22px 26px 6px 26px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
        <div style="font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:#486581;">{{badge}}</div>
        <div style="font-size:23px;line-height:1.3;font-weight:700;color:#102a43;margin-top:4px;">{{title}}</div>
        <div style="font-size:13px;line-height:1.5;color:#627d98;margin-top:8px;padding:8px 12px;background:#f0f4f8;border-radius:6px;">{{meta}}</div>
      </td></tr>
      <tr><td style="padding:10px 26px 24px 26px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;color:#1f2933;">
{{body}}
      </td></tr>
    </table>
  </td></tr>
  <tr><td style="height:16px;line-height:16px;font-size:0;">&nbsp;</td></tr>
  <!--/card-->

  <!-- footer -->
  <tr><td style="padding:6px 26px 18px 26px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;line-height:1.6;color:#627d98;text-align:center;">
    {{dashboard_link}}
    <div>{{footer_sentence}}</div>
  </td></tr>

</table>

</td></tr>
</table>
</body>
</html>
